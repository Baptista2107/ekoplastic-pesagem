      são só um atalho.</div>`;
}

/* ══════════════════════════════════════════════════════════════════
   PASSO 2 — A ORDEM DE CARREGAMENTO
   ------------------------------------------------------------------
   Esta é a única decisão da separação que o sistema NÃO pode tomar
   sozinho: quem entra primeiro no caminhão depende da rota, do cliente
   e do que o motorista combinou. Tudo o que vem depois — quais
   endereços visitar, em que sequência, qual gaiola serve dois pedidos
   de uma vez — é consequência dela.

   Por isso ela virou uma tela inteira, e não uma seta escondida no
   canto de outra: o sistema PERGUNTA antes de montar qualquer lista.

   A guia numera as cargas da esquerda para a direita e imprime, em
   cada uma, o número da entrega. Como o cabeçalho dela diz que a
   coluna da esquerda é a última a ser carregada, os dois números
   costumam correr em sentidos opostos — e é exatamente por isso que a
   tela mostra os dois e deixa você inverter tudo com um toque.
   ══════════════════════════════════════════════════════════════════ */
function sepDesenharOrdem() {
  const totalFardos = p => (p.itens || []).reduce((a, it) => a + (Number(it.qtd) || 0), 0);
  const linhas = SEP_PEDIDOS.map((p, i) => `
    <div class="ord">
      <div class="ord-n">${p.ordem}º</div>
      <div class="ord-c">
        <div class="ord-cli">${esc(p.cliente || 'pedido ' + p.ordem)}</div>
        <div class="ord-sub">${esc(p.cidade || '')}${p.uf ? '/' + esc(p.uf) : ''}${
          p.pedido_numero ? ' · Ped.' + esc(p.pedido_numero) : ''}</div>
        ${p.carga ? `<div class="ord-tag">${esc(p.carga)}</div>` : ''}
        <div class="ord-qtd">${totalFardos(p)} fardo(s) · ${fmtKg(totalFardos(p) * KG_FARDO)}</div>
      </div>
      <div class="ord-set">
        <button class="btn-ic" onclick="sepMover(${i},-1)" ${i === 0 ? 'disabled' : ''}
                title="Carregar antes">↑</button>
        <button class="btn-ic" onclick="sepMover(${i},1)" ${i === SEP_PEDIDOS.length - 1 ? 'disabled' : ''}
                title="Carregar depois">↓</button>
      </div>
    </div>`).join('');

  $('sep-corpo').innerHTML = `
    ${sepPassos(2)}
    ${sepCabecalhoGuia()}
    <div class="det" style="margin-bottom:12px">
      <h3 style="font-family:inherit;font-size:15px">Em que ordem o caminhão vai ser carregado?</h3>
      <div class="sub">O <b>1º da lista entra primeiro no caminhão</b> — e por isso é o
        <b>último a ser entregue</b>. É esta sequência que vai definir por quais endereços
        você passa e em que ordem.</div>
      <div class="acoes" style="margin-top:10px">
        <button class="btn" onclick="sepInverterOrdem()">⇅ inverter a ordem toda</button>
      </div>
    </div>
    ${linhas || '<div class="vazio">Nenhum pedido nesta carga.</div>'}
    <div class="acoes" style="margin-top:12px">
      <button class="btn ok" style="flex:1" onclick="sepConfirmarOrdem()">
        ✓ ESTA É A ORDEM — VER OS ENDEREÇOS</button>
    </div>
    <div class="acoes">
      <button class="btn" onclick="sepVoltarConferencia()">← corrigir a guia</button>
      <button class="btn" onclick="sepFechar()">fechar</button>
    </div>`;
}

// Inverter tudo de uma vez. Existe porque a dúvida real quase nunca é
// "trocar o 2º com o 3º": é se a guia deve ser lida da esquerda para a
// direita ou ao contrário. Um toque resolve, sem subir carga por carga.
function sepInverterOrdem() {
  SEP_PEDIDOS.reverse();
  SEP_PEDIDOS.forEach((p, k) => p.ordem = k + 1);
  sepRender();
}

async function sepConfirmarOrdem() {
  const ids = SEP_PEDIDOS.map(p => p.id).filter(Boolean);
  if (ids.length !== SEP_PEDIDOS.length) {
    sepAviso('Esta carga ainda não foi gravada. Confira a guia primeiro.', 'err');
    return;
  }
  sepAviso('Gravando a ordem e montando a lista de endereços…', 'at');
  try {
    let r = await fetch(URL_BASE + `/separacao/${SEP.id}/ordem`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ordens: ids }) });
    let d = await r.json();
    if (!d.ok) throw new Error(d.erro || 'falha ao gravar a ordem');

    r = await fetch(URL_BASE + `/separacao/${SEP.id}/planejar`, { method: 'POST' });
    d = await r.json();
    if (!d.ok) throw new Error(d.erro || 'falha ao montar a lista');
    SEP_ORDENANDO = false;
    await sepCarregarEstado();
    beep(880, .09); vibrar(40);
    sepAviso('');
    sepRender();
  } catch (e) { sepAviso('Não consegui montar a lista: ' + esc(e.message), 'err'); }
}

function sepVoltarOrdem() { SEP_ORDENANDO = true; SEP_CORRIGINDO = false; pararCamera(); sepRender(); }

function sepDesenharPlano() {
  const est = SEP_ESTADO || {};
  const coletas = est.coletas || [];
  const falta = est.falta || { por_item: [], por_produto: [], fardos: 0 };
  const vivas = coletas.filter(c => c.status === 'planejada' || c.status === 'coletada');
  const feitas = vivas.filter(c => c.status === 'coletada');
  const fardos = vivas.reduce((a, c) => a + Object.values(c.reparticao || {}).reduce((x, y) => x + y, 0), 0);
  const nomePedido = o => {
    const p = SEP_PEDIDOS.find(x => x.ordem === Number(o));
    return p && p.cliente ? p.cliente : 'pedido ' + o;
  };

  // ── O bloco da FALTA. Quase nunca a guia inteira está pronta: parte
  //    está na máquina e fica pronta no dia. Isso não é erro, é o
  //    normal — o erro seria o caminhão sair faltando carga sem
  //    ninguém saber.
  //
  //    Ele já ocupou o topo desta tela, e foi um engano: com o mapa
  //    ainda incompleto a tela abria com um muro laranja de "falta
  //    tudo" e os endereços — que são o motivo de a tela existir —
  //    ficavam empurrados para baixo do fim do celular. Agora a falta
  //    entra como uma tarja de uma linha em cima e o detalhe fica no
  //    fim, depois da lista. ──
  let tarjaFalta = '', blocoFalta = '';
  if (falta.fardos > 0) {
    tarjaFalta = `<div class="aviso at" style="display:flex;align-items:center;gap:10px">
      <span style="font-size:16px">⏳</span>
      <span style="flex:1"><b>${falta.fardos} fardo(s)</b> desta carga ainda não estão
        endereçados — o normal é estarem em produção.</span>
      <button class="btn" onclick="document.getElementById('falta-det').scrollIntoView({behavior:'smooth'})"
        style="flex:0 0 auto">ver</button></div>`;
  }
  if (falta.fardos > 0) {
    const porProd = falta.por_produto.map(f =>
      `<div class="linha"><span>${esc(f.formato)} ${esc(f.cor_key)}</span>
        <span>${f.faltam} fardo(s) · ${fmtKg(f.kg)}</span></div>`).join('');
    const porPed = falta.por_item.map(f =>
      `<div class="linha"><span>${f.ordem}º · ${esc(f.cliente || 'pedido ' + f.ordem)}</span>
        <span>${f.faltam} × ${esc(f.formato)} ${esc(f.cor_key)}</span></div>`).join('');
    blocoFalta = `<div class="det" id="falta-det" style="border-color:var(--warn)">
      <h3 style="font-family:inherit;font-size:15px;color:var(--warn)">⏳ FALTAM ${falta.fardos} FARDO(S) NO GALPÃO</h3>
      <div class="sub">Não estão endereçados agora. O normal é estarem em produção —
        assim que ficarem prontos e forem endereçados, toque em <b>refazer o plano</b>
        e eles entram sozinhos.</div>
      ${porProd}
      <div class="rua-tit" style="margin:12px 0 4px">QUEM FICA FALTANDO</div>
      ${porPed}
    </div>`;
  }

  // ── Coletas, por pedido na ordem de carregamento, caminhando pelo galpão ──
  // A lista percorre TODOS os pedidos da carga, não só os que têm
  // endereço. Um pedido inteiro em produção sumindo da lista abriria um
  // buraco entre a ordem que o gestor confirmou e a lista que o
  // separador lê — ele contaria "1º, 3º, 4º" e iria procurar o 2º.
  const ordens = SEP_PEDIDOS.length
    ? SEP_PEDIDOS.map(p => p.ordem).sort((a, b) => a - b)
    : [...new Set(vivas.flatMap(c => Object.keys(c.reparticao || {}).map(Number)))].sort((a, b) => a - b);
  const jaBuscada = new Set();
  const blocos = ordens.map(o => {
    const doPedido = vivas.filter(c => c.reparticao && c.reparticao[o]).sort((a, b) => {
      const A = a.posicao.split('-').map(Number), B = b.posicao.split('-').map(Number);
      return (A[0] - B[0]) || (A[2] - B[2]) || (A[1] - B[1]);
    });
    const linhas = doPedido.map(c => {
      const naDoca = jaBuscada.has(c.gaiola_id);
      jaBuscada.add(c.gaiola_id);
      const outros = Object.keys(c.reparticao).map(Number).filter(x => x !== o).sort((a, b) => a - b);
      const pronta = c.status === 'coletada';
      return `<div class="cl ${naDoca ? 'doca' : ''} ${pronta ? 'pronta' : ''}" id="cl-${c.id}-${o}">
        <div class="end">${esc(c.posicao)}</div>
        <div class="cp">
          <div class="p1">${pronta ? '✓ ' : ''}${c.reparticao[o]} fardo(s) · ${esc(c.formato)} ${esc(c.cor_key)}</div>
          <div class="p2">gaiola ${esc(c.gaiola_id)} · ${c.fardos_na_gaiola} fardo(s) na gaiola</div>
          ${naDoca ? '<span class="tag2 doca">já está na doca — não busque de novo</span>' : ''}
          ${outros.length ? `<span class="tag2 share">atende também: ${outros.map(x =>
              esc(nomePedido(x)) + ' (' + c.reparticao[x] + ')').join(', ')}</span>` : ''}
          ${c.sobra > 0 ? `<span class="tag2 sobra">sobram ${c.sobra} fardo(s) — vai para reetiquetagem</span>` : ''}
          ${(!pronta && !naDoca) ? `<div class="acoes" style="margin-top:9px">
              <button class="btn ok" onclick="sepConfirmar(${c.id})">✓ COLETEI</button>
              <button class="btn perigo" onclick="sepNaoEncontrada(${c.id})">✗ não está aqui</button>
            </div>` : ''}
        </div></div>`;
    }).join('');
    const p = SEP_PEDIDOS.find(x => x.ordem === Number(o)) || {};
    const sub = [p.cidade ? p.cidade + (p.uf ? '/' + p.uf : '') : '',
                 p.pedido_numero ? 'Ped.' + p.pedido_numero : '',
                 p.carga || ''].filter(Boolean).join(' · ');
    const nEnd = doPedido.length;
    // Pedido sem nenhum endereço: não some da lista, aparece dizendo por quê.
    const faltaDele = falta.por_item.filter(f => Number(f.ordem) === Number(o));
    const vazio = nEnd ? '' : `<div class="cl" style="border-style:dashed;opacity:.8">
      <div class="end" style="color:var(--warn)">—</div>
      <div class="cp"><div class="p1">nada endereçado para este pedido ainda</div>
        <div class="p2">${faltaDele.length
          ? faltaDele.map(f => `${f.faltam} × ${esc(f.formato)} ${esc(f.cor_key)}`).join(' · ')
            + ' — em produção'
          : 'sem itens a coletar'}</div></div></div>`;
    return `<div class="pl-ped">
      <h4>${o}º a carregar — ${esc(nomePedido(o))}</h4>
      <div class="pl-sub">${esc(sub)}${sub ? ' · ' : ''}${nEnd} endereço(s) a visitar</div>
      ${linhas}${vazio}</div>`;
  }).join('');

  const compart = vivas.filter(c => Object.keys(c.reparticao || {}).length > 1).length;

  $('sep-corpo').innerHTML = `
    ${sepPassos(3)}
    ${sepCabecalhoGuia()}
    <div class="resumo">
      <div class="rz"><b>${feitas.length}/${vivas.length}</b><span>coletadas</span></div>
      <div class="rz"><b>${fardos}</b><span>fardos</span></div>
      <div class="rz"><b>${compart}</b><span>em 2+ pedidos</span></div>
      <div class="rz" ${falta.fardos ? 'style="border-color:var(--warn)"' : ''}>
        <b${falta.fardos ? ' style="color:var(--warn)"' : ''}>${falta.fardos}</b><span>faltando</span></div>
    </div>
    ${tarjaFalta}
    <div id="reader-sep"></div>
    <div class="acoes" style="margin-top:0">
      <button class="btn ok" id="btn-cam-sep" style="flex:1" onclick="sepBipar()">▶ LIGAR CÂMERA</button>
      <button class="btn" onclick="sepReplanejar()">↻ refazer</button>
    </div>
    <div class="rua-tit" style="margin:14px 0 6px">LISTA DE SEPARAÇÃO — NA ORDEM DE CARREGAMENTO</div>
    <div class="dica" style="margin-bottom:12px">Cada bloco é um pedido, na sequência que
      você definiu, e dentro dele os endereços vêm na ordem de caminhada pelo galpão.
      Bipe a etiqueta da prateleira <b>ou</b> a da gaiola ao pegar — é esse bipe que
      libera o endereço no mapa.${compart ? ` <b>${compart} ${compart === 1 ? 'gaiola atende' : 'gaiolas atendem'}</b>
      mais de um pedido: a etiqueta verde avisa, e ${compart === 1 ? 'ela' : 'elas'} não
      ${compart === 1 ? 'deve' : 'devem'} ser buscada${compart === 1 ? '' : 's'} duas vezes.` : ''}</div>
    ${blocos || '<div class="vazio">Nada a coletar.</div>'}
    ${blocoFalta}
    <div class="acoes">
      <button class="btn" onclick="sepVoltarOrdem()">⇅ mudar a ordem</button>
      <button class="btn" onclick="sepVoltarConferencia()">← corrigir a guia</button>
      <button class="btn" onclick="sepFechar()">fechar</button>
    </div>`;
}

/* ── O bipe da coleta ──────────────────────────────────────────────
   É o gesto que fecha o ciclo: o separador já está no endereço e já
   está tirando a gaiola. Bipar ali não é trabalho a mais — e é o que
   dá baixa sem depender de alguém lembrar depois. */
function sepBipar() {
  toggleCamera({ el: 'reader-sep', btn: 'btn-cam-sep', cb: sepLeu });
}

async function sepLeu(texto) {
  const t = String(texto || '').trim().toUpperCase();
  const agora = Date.now();
  if (ultimaLeitura[t] && agora - ultimaLeitura[t] < 2500) return;
  ultimaLeitura[t] = agora;

  const info = interpretar(t);
  const alvo = (info.tipo === 'gaiola' ? info.id : info.tipo === 'endereco' ? info.codigo : t);
  const c = (SEP_ESTADO.coletas || []).find(
    x => x.status === 'planejada' && (x.gaiola_id === alvo || x.posicao === alvo));
  if (!c) {
    beep(320, .2); vibrar(150);
    sepAviso(`<b>${esc(alvo)}</b> não está no plano desta separação. Confira se é a gaiola certa.`, 'err');
    return;
  }
  beep(880, .09); vibrar(40);
  await sepConfirmar(c.id, alvo);
}

async function sepConfirmar(id, lido) {
  try {
    const r = await fetch(URL_BASE + `/separacao/coleta/${id}/confirmar`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lido: lido || null, operador: window.EKO_RESPONSAVEL || null }) });
    const d = await r.json();
    if (!d.ok) throw new Error(d.erro || 'falha');
    await sepCarregarEstado();
    if (d.sobra > 0) {
      sepAviso(`Coletada. <b>Sobram ${d.sobra} fardo(s)</b> — a etiqueta nova está na aba
                <b>SOBRAS</b>${d.posicao_sugerida ? `, para endereçar em <b>${esc(d.posicao_sugerida)}</b>` : ''}.`, 'at');
    } else {
      sepAviso(`Coletada. Endereço <b>${esc(d.posicao_liberada)}</b> liberado no mapa.`, 'ok');
    }
    sepRender();
    sobAtualizarBadge();
  } catch (e) { sepAviso('Não consegui confirmar: ' + esc(e.message), 'err'); }
}

async function sepNaoEncontrada(id) {
  try {
    const r = await fetch(URL_BASE + `/separacao/coleta/${id}/nao-encontrada`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ operador: window.EKO_RESPONSAVEL || null }) });
    const d = await r.json();
    if (!d.ok) throw new Error(d.erro || 'falha');
    sepAviso('Anotado: o mapa foi corrigido. Refazendo o plano com o que resta…', 'at');
    await sepReplanejar();
  } catch (e) { sepAviso('Não consegui: ' + esc(e.message), 'err'); }
}

/* ══════════════════════════════════════════════════════════════════
   SOBRAS — a fila de reetiquetagem
   Gaiola que saiu do endereço mas não foi 100% usada. Fica aqui até a
   etiqueta nova ser impressa e endereçada. A fila tem fim visível.
   ══════════════════════════════════════════════════════════════════ */
async function sobRender() {
  try {
    const r = await fetch(URL_BASE + '/sobras');
    const d = await r.json();
    const lista = (d.sobras || []);
    sobPintarBadge(lista.length);
    if (!lista.length) {
      $('sob-corpo').innerHTML = `<div class="det"><h3 style="font-family:inherit;font-size:15px">Nada pendente</h3>
        <div class="sub">Quando uma gaiola sair do endereço sem ser usada por
        inteiro, a etiqueta nova dela aparece aqui.</div></div>`;
      return;
    }
    $('sob-corpo').innerHTML = lista.map(s => {
      const impressa = s.status === 'impressa' && s.gaiola_nova;
      return `<div class="det">
        <h3 style="font-family:inherit;font-size:16px">${esc(s.formato)} ${esc(s.cor_key)} · ${s.fardos} fardo(s)</h3>
        <div class="sub">${fmtKg(s.fardos * KG_FARDO)} · saiu de ${esc(s.posicao_origem || '—')}
          (gaiola ${esc(s.gaiola_origem)})</div>
        <div class="linha"><span>Endereço sugerido</span>
          <span style="font-family:'IBM Plex Mono',monospace;color:var(--accent);font-size:16px">
            ${esc(s.posicao_sugerida || 'nenhum vão livre')}</span></div>
        ${impressa ? `<div class="linha"><span>Etiqueta nova</span>
          <span style="font-family:'IBM Plex Mono',monospace">${esc(s.gaiola_nova)}</span></div>` : ''}
        <div class="acoes">
          <button class="btn ok" onclick="sobImprimir(${s.id})">🖨 ${impressa ? 'IMPRIMIR DE NOVO' : 'IMPRIMIR ETIQUETA'}</button>
          ${impressa ? `<button class="btn" onclick="irAba('acao')">📷 ir endereçar</button>` : ''}
        </div>
        ${impressa ? `<div class="dica">Cole a etiqueta nova na gaiola, leve ao endereço e
          bipe na aba <b>ENDEREÇAR</b>. A pendência fecha sozinha.</div>` : ''}
      </div>`;
    }).join('');
  } catch (e) {
    $('sob-corpo').innerHTML = `<div class="aviso err">Não consegui carregar: ${esc(e.message)}</div>`;
  }
}

async function sobImprimir(id) {
  $('sob-msg').innerHTML = '<div class="aviso at">Imprimindo…</div>';
  try {
    const r = await fetch(URL_BASE + `/sobras/${id}/imprimir`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ operador: window.EKO_RESPONSAVEL || null }) });
    const d = await r.json();
    if (!d.ok) throw new Error(d.erro || 'falha');
    beep(880, .09);
    const imp = d.impressao || {};
    $('sob-msg').innerHTML = `<div class="aviso ${imp.ok ? 'ok' : 'at'}">
      Etiqueta <b>${esc(d.gaiola_nova)}</b> — ${d.fardos} fardo(s), ${fmtKg(d.kg)}.
      ${imp.ok ? 'Saiu na impressora.' : 'A impressora não confirmou: ' + esc(imp.erro || 'sem resposta') + '.'}
      Endereço sugerido: <b>${esc(d.posicao_sugerida || '—')}</b>.</div>`;
    sobRender();
  } catch (e) { $('sob-msg').innerHTML = `<div class="aviso err">${esc(e.message)}</div>`; }
}

function sobPintarBadge(n) {
  const b = $('sob-badge');
  if (b) b.textContent = n ? ' ' + n : '';
}
async function sobAtualizarBadge() {
  try { const d = await (await fetch(URL_BASE + '/sobras')).json(); sobPintarBadge((d.sobras || []).length); }
  catch (e) {}
}

function sepVoltarConferencia() { SEP_CORRIGINDO = true; pararCamera(); sepRender(); }

/* ══════════════ início ══════════════ */
function iniciar() {
  irModo('entrada');
  carregarMapa();
  carregarHistorico();
  sobAtualizarBadge();
  // No celular a tela nasce no leitor; no computador, no mapa.
  if (window.innerWidth < 760) irAba('acao');
}
function comAcesso(tela, aoEntrar) {
  if (window.EkoAcesso && typeof EkoAcesso.exigir === 'function') return EkoAcesso.exigir(tela, aoEntrar);
  try { aoEntrar(); } catch (e) { console.error(e); }
}
comAcesso('pa', iniciar);
</script>
