<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Endereçamento — Ekoplastic</title>
<!-- Leitor de QR servido pela própria estação (nada de CDN: o galpão não
     pode depender de internet para endereçar). É a mesma biblioteca que o
     inventário já usa há meses no celular. -->
<script src="/acesso-colaborador.js"></script>
<script src="/vendor/html5-qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e0c; --surface:#121a16; --panel:#18231e; --panel-hi:#1f2f27;
  --border:#22322b; --text:#eaf5ef; --muted:#6f8a7d;
  --accent:#2ee6a6;                 /* esmeralda — produto acabado */
  --livre:#1d2b24; --ocupada:#2ee6a6; --bloqueada:#ff4466; --warn:#ffaa00;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100vh;font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text)}
body{padding-bottom:24px}

header{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surface);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.logo{display:flex;align-items:center;gap:9px;font-weight:900;letter-spacing:1px;font-size:14px}
.logo .ic{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#12b980);
  color:#04140d;display:flex;align-items:center;justify-content:center;font-size:15px}
header .sp{flex:1}
.btn-ic{background:transparent;border:1px solid var(--border);border-radius:8px;width:34px;height:34px;
  color:var(--muted);font-size:15px;cursor:pointer}
.btn-ic:hover{color:var(--text)}

.abas{display:flex;gap:8px;padding:12px 14px 0;flex-wrap:wrap}
/* Quatro abas não cabem numa linha de 390 px — a última ficava cortada.
   Abaixo de 620 px viram duas por linha, que é largura de dedo. */
@media (max-width:620px){ .aba{flex:1 1 calc(50% - 4px)} }
.aba{flex:1;padding:11px;border:1px solid var(--border);background:var(--panel);border-radius:11px;
  color:var(--muted);font-family:inherit;font-size:13.5px;font-weight:800;letter-spacing:.4px;cursor:pointer}
.aba.on{background:linear-gradient(135deg,var(--accent),#12b980);color:#04140d;border-color:transparent}
.pg{display:none;padding:14px}
.pg.on{display:block}

/* ─── Resumo ─── */
.resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-bottom:14px}
.rz{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:10px 12px}
.rz b{display:block;font-size:20px;font-weight:900;line-height:1.15}
.rz span{font-size:10.5px;font-weight:800;letter-spacing:.9px;color:var(--muted);text-transform:uppercase;
  overflow-wrap:anywhere;line-height:1.3}

.barra{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.busca{flex:1;min-width:150px;background:var(--panel);border:1px solid var(--border);border-radius:10px;
  padding:10px 12px;color:var(--text);font-family:inherit;font-size:14px}
.chip{padding:9px 14px;border:1px solid var(--border);background:var(--panel);border-radius:9px;
  color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer}
.chip.on{color:var(--text);border-color:var(--accent)}

/* ─── Mapa ─── */
.rua{margin-bottom:18px}
.rua-tit{font-size:12px;font-weight:900;letter-spacing:1.4px;color:var(--muted);margin-bottom:8px}
.niveis{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px;overflow-x:auto}
.nivel{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.nivel:last-child{margin-bottom:0}
.nivel-lb{flex:0 0 76px;font-size:10.5px;font-weight:900;letter-spacing:.6px;color:var(--muted);line-height:1.25}
.nivel-lb small{display:block;font-weight:700;color:#4d6459;letter-spacing:.3px}
.vaos{display:flex;gap:4px}
.vao{width:30px;height:38px;flex:0 0 30px;border-radius:6px;border:1px solid var(--border);
  background:var(--livre);color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .08s}
.vao:hover{transform:translateY(-2px)}
.vao.ocupada{background:var(--ocupada);border-color:var(--ocupada);color:#04140d;font-weight:700}
.vao.bloqueada{background:repeating-linear-gradient(45deg,#2a1218,#2a1218 4px,#3a171f 4px,#3a171f 8px);
  border-color:var(--bloqueada);color:#ff8ba3;cursor:not-allowed}
.vao.velha{box-shadow:inset 0 0 0 2px var(--warn)}
.vao.achado{outline:2px solid #fff;outline-offset:1px}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:4px}
.legenda i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:5px}

/* ─── Detalhe ─── */
.det{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px}
.det h3{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:700;letter-spacing:1px;margin-bottom:2px}
.det .sub{font-size:12px;color:var(--muted);margin-bottom:12px}
.linha{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.linha:last-of-type{border-bottom:none}
.linha span:first-child{color:var(--muted)}
.linha span:last-child{font-weight:800;text-align:right}
.vazio{color:var(--muted);font-size:13.5px;line-height:1.6}

.btn{padding:12px 16px;border-radius:10px;border:1px solid var(--border);background:var(--panel);
  color:var(--text);font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer}
.btn:hover{background:var(--panel-hi)}
.btn.ok{border:none;background:linear-gradient(135deg,var(--accent),#12b980);color:#04140d}
.btn.perigo{border-color:var(--bloqueada);color:#ff8ba3}
.btn:disabled{opacity:.45;cursor:not-allowed}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* ─── Endereçar ─── */
#reader{width:100%;max-width:460px;margin:0 auto 12px;border-radius:12px;overflow:hidden;display:none}
#reader.on{display:block}
.slot{background:var(--panel);border:1.5px dashed var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.slot.cheio{border-style:solid;border-color:var(--accent);background:var(--panel-hi)}
.slot .rot{font-size:10.5px;font-weight:900;letter-spacing:1.1px;color:var(--muted);text-transform:uppercase}
.slot .val{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:700;margin-top:4px}
.slot .val.vazio2{color:#3f5349;font-size:15px;font-family:'Nunito',sans-serif;font-weight:700}
.slot .extra{font-size:12.5px;color:var(--muted);margin-top:4px}
.aviso{border-radius:10px;padding:11px 13px;font-size:13px;line-height:1.5;margin-bottom:10px}
.aviso.err{background:rgba(255,68,102,.12);border:1px solid rgba(255,68,102,.4);color:#ff8ba3}
.aviso.ok{background:rgba(46,230,166,.12);border:1px solid rgba(46,230,166,.4);color:var(--accent)}
.aviso.at{background:rgba(255,170,0,.12);border:1px solid rgba(255,170,0,.4);color:var(--warn)}
.hist{margin-top:16px}
.hist-item{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.hist-item span:last-child{color:var(--muted);white-space:nowrap;font-family:'IBM Plex Mono',monospace}
.dica{font-size:12px;color:var(--muted);line-height:1.55;margin-top:10px}

/* ─── Separação ─── */
.foto-alvo{display:block;border:1.5px dashed var(--border);border-radius:14px;padding:26px 16px;text-align:center;
  background:var(--panel);cursor:pointer;margin-bottom:14px}
.foto-alvo:hover{border-color:var(--accent)}
.foto-alvo .ic2{font-size:34px;display:block;margin-bottom:8px}
.foto-alvo b{display:block;font-size:15px;font-weight:900;letter-spacing:.4px}
.foto-alvo span{display:block;font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.5}
.guia-mini{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--border);
  border-radius:12px;padding:9px;margin-bottom:12px}
.guia-mini img{width:56px;height:56px;object-fit:cover;border-radius:8px;background:#000;cursor:zoom-in}
.guia-mini .gt{flex:1;font-size:12.5px;color:var(--muted);line-height:1.45}
.guia-mini .gt b{display:block;color:var(--text);font-size:13.5px}
#lupa{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;display:none;align-items:center;justify-content:center;padding:10px}
#lupa.on{display:flex}
#lupa img{max-width:100%;max-height:100%;object-fit:contain}

.ped{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.ped-top{display:flex;gap:8px;align-items:center;margin-bottom:9px}
.ped-ordem{flex:0 0 44px;height:44px;border-radius:10px;background:var(--panel-hi);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:700}
.ped-cli{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:9px;
  padding:10px;color:var(--text);font-family:inherit;font-size:14px}
/* O item ocupa DUAS linhas de propósito: numa tela de 390 px, cor +
   formato + quantidade + remover não cabem numa linha só, e deixar
   quebrar sozinho jogava o ✕ órfão embaixo, parecendo outro botão. */
.item{padding:9px 0;border-top:1px dashed var(--border)}
.it-l1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.it-l2{display:flex;align-items:center;gap:8px;margin-top:8px}
.it-l2 .sel-fmt{flex:1;min-width:0}
.cores{display:flex;gap:4px}
.cb{width:34px;height:34px;border-radius:8px;border:2px solid var(--border);cursor:pointer;font-size:11px;
  font-weight:900;display:flex;align-items:center;justify-content:center;font-family:inherit}
.cb.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(46,230,166,.3)}
.sel-fmt{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px 8px;
  color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:700}
.qtd{width:76px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px 8px;
  color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:700;text-align:right}
.lixo{background:transparent;border:none;color:#6b4a52;font-size:17px;cursor:pointer;padding:6px}
.lixo:hover{color:var(--bloqueada)}
.unid{display:flex;gap:6px;align-items:center;margin-bottom:10px;font-size:12.5px;color:var(--muted)}

/* ─── Os três passos da separação ───
   A régua existe porque o processo tem uma ordem que não é óbvia:
   conferir a guia, decidir a ordem de carregamento, só então separar.
   Sem ela, importar o PDF caía numa tela de coleta e a decisão do meio
   parecia ter sido tomada pelo sistema — quando é a única que não é. */
.passos{display:flex;gap:6px;margin-bottom:12px}
.passo{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;
  border:1px solid var(--border);border-radius:10px;background:var(--surface);opacity:.5}
.passo b{width:22px;height:22px;border-radius:50%;background:var(--panel-hi);color:var(--muted);
  display:flex;align-items:center;justify-content:center;font-size:12px}
.passo span{font-size:9.5px;font-weight:800;letter-spacing:.4px;color:var(--muted);text-align:center;line-height:1.25}
.passo.on{opacity:1;border-color:var(--accent);background:rgba(46,230,166,.08)}
.passo.on b{background:var(--accent);color:#04140d}
.passo.on span{color:var(--text)}
.passo.feito{opacity:.85}
.passo.feito b{background:transparent;border:1px solid var(--accent);color:var(--accent)}

/* ─── Ordem de carregamento (passo 2) ─── */
.ord{display:flex;gap:11px;align-items:center;background:var(--panel);border:1px solid var(--border);
  border-radius:12px;padding:12px;margin-bottom:8px}
.ord-n{flex:0 0 46px;height:46px;border-radius:10px;background:var(--accent);color:#04140d;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900}
.ord-c{flex:1;min-width:0}
.ord-cli{font-size:14.5px;font-weight:800;line-height:1.25}
.ord-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.ord-tag{display:inline-block;margin-top:5px;padding:3px 8px;border-radius:20px;font-size:11px;
  font-weight:800;background:rgba(46,230,166,.12);color:var(--accent)}
.ord-qtd{font-size:12.5px;color:var(--muted);margin-top:5px}
.ord-set{flex:0 0 auto;display:flex;flex-direction:column;gap:5px}
.ord-set .btn-ic:disabled{opacity:.25}

/* ─── Plano de coleta ─── */
.pl-ped{margin-bottom:16px}
.pl-ped h4{font-size:12px;font-weight:900;letter-spacing:1.2px;color:var(--muted);margin-bottom:8px;text-transform:uppercase}
.pl-sub{font-size:12px;color:var(--muted);margin:-4px 0 8px}
.cl{display:flex;gap:11px;align-items:flex-start;background:var(--panel);border:1px solid var(--border);
  border-radius:12px;padding:12px;margin-bottom:8px}
.cl .end{flex:0 0 auto;font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:700;color:var(--accent);
  letter-spacing:.5px;line-height:1.2}
.cl .cp{flex:1;min-width:0}
.cl .cp .p1{font-size:14px;font-weight:800}
.cl .cp .p2{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.cl.doca{border-style:dashed;opacity:.85}
.tag2{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:800;margin:4px 4px 0 0}
.tag2.share{background:rgba(46,230,166,.14);color:var(--accent)}
.tag2.sobra{background:rgba(255,170,0,.14);color:var(--warn)}
.tag2.doca{background:rgba(120,140,130,.16);color:var(--muted)}
.cl.pronta{border-color:var(--accent);background:rgba(46,230,166,.07)}
.cl.pronta .end{opacity:.65}
#reader-sep{width:100%;max-width:460px;margin:0 auto 12px;border-radius:12px;overflow:hidden;display:none}
#reader-sep.on{display:block}
#sob-badge{display:inline}
.aba#ab-sob{position:relative}
</style>
<!-- Ajuste automatico para celular: so vale abaixo de 900px de largura -->
<link rel="stylesheet" href="/celular.css">
</head>
<body data-tela="Endereçamento">

<header>
  <div class="logo"><div class="ic">🗺</div> ENDEREÇAMENTO</div>
  <div class="sp"></div>
  <button class="btn-ic" onclick="carregarMapa()" title="Atualizar">↻</button>
  <button class="btn-ic" onclick="location.href='/produto-acabado.html'" title="Produto Acabado">📦</button>
  <button class="btn-ic" onclick="location.href='/'" title="Menu">🏠</button>
</header>

<div class="abas">
  <button class="aba on" id="ab-mapa" onclick="irAba('mapa')">🗺 MAPA</button>
  <button class="aba" id="ab-acao" onclick="irAba('acao')">📷 ENDEREÇAR</button>
  <button class="aba" id="ab-sep" onclick="irAba('sep')">📋 SEPARAÇÃO</button>
  <button class="aba" id="ab-sob" onclick="irAba('sob')">🏷 SOBRAS<span id="sob-badge"></span></button>
</div>

<!-- ═══════════ MAPA ═══════════ -->
<div class="pg on" id="pg-mapa">
  <div class="resumo" id="resumo"></div>

  <div class="barra">
    <input class="busca" id="busca" placeholder="Buscar endereço, gaiola ou formato…" oninput="desenhar()">
    <button class="chip on" data-rua="0" onclick="filtrarRua(0,this)">Todas</button>
    <button class="chip" data-rua="1" onclick="filtrarRua(1,this)">Rua 01</button>
    <button class="chip" data-rua="2" onclick="filtrarRua(2,this)">Rua 02</button>
  </div>

  <div id="detalhe"></div>
  <div id="mapa"><div class="vazio">Carregando o mapa…</div></div>

  <div class="legenda">
    <span><i style="background:var(--livre);border:1px solid var(--border)"></i>livre</span>
    <span><i style="background:var(--ocupada)"></i>ocupada</span>
    <span><i style="background:#3a171f;border:1px solid var(--bloqueada)"></i>bloqueada</span>
    <span><i style="background:var(--livre);box-shadow:inset 0 0 0 2px var(--warn)"></i>parada há 30 dias ou mais</span>
  </div>
</div>

<!-- ═══════════ ENDEREÇAR ═══════════ -->
<div class="pg" id="pg-acao">
  <div class="barra">
    <button class="chip on" id="md-entrada" onclick="irModo('entrada')">➕ COLOCAR</button>
    <button class="chip" id="md-saida" onclick="irModo('saida')">➖ RETIRAR</button>
  </div>

  <div id="msg"></div>

  <div id="reader"></div>
  <div class="acoes" style="margin-top:0">
    <button class="btn ok" id="btn-cam" onclick="toggleCamera()">▶ LIGAR CÂMERA</button>
    <button class="btn" onclick="digitar()">⌨ DIGITAR</button>
  </div>

  <div style="margin-top:14px">
    <div class="slot" id="slot-end" onclick="limparSlot('end')">
      <div class="rot">Endereço</div>
      <div class="val vazio2" id="v-end">leia a etiqueta da prateleira</div>
      <div class="extra" id="e-end"></div>
    </div>
    <div class="slot" id="slot-gai" onclick="limparSlot('gai')">
      <div class="rot">Gaiola</div>
      <div class="val vazio2" id="v-gai">leia a etiqueta da gaiola</div>
      <div class="extra" id="e-gai"></div>
    </div>
  </div>

  <div class="acoes">
    <button class="btn ok" id="btn-confirmar" onclick="confirmar()" disabled style="flex:1">✓ CONFIRMAR</button>
    <button class="btn" onclick="limparTudo()">LIMPAR</button>
  </div>

  <div class="dica" id="dica-modo"></div>

  <div class="hist">
    <div class="rua-tit">ÚLTIMOS MOVIMENTOS</div>
    <div id="hist"><div class="vazio">—</div></div>
  </div>
</div>

<!-- ═══════════ SEPARAÇÃO ═══════════ -->
<div class="pg" id="pg-sep">
  <div id="sep-msg"></div>
  <div id="sep-corpo"><div class="vazio">Carregando…</div></div>
</div>

<!-- ═══════════ SOBRAS ═══════════ -->
<div class="pg" id="pg-sob">
  <div id="sob-msg"></div>
  <div id="sob-corpo"><div class="vazio">Carregando…</div></div>
</div>

<!-- A foto da guia, ampliada -->
<div id="lupa" onclick="this.classList.remove('on')"><img id="lupa-img" alt="Guia de separação"></div>

<!-- Entrada da foto. `capture` faz o celular abrir a câmera direto; no
     computador o mesmo campo abre o seletor de arquivo (serve PDF). -->
<input type="file" id="arq-guia" accept="image/*,application/pdf" capture="environment"
       style="display:none" onchange="sepEnviarFoto(this)">
<!-- Importar o PDF da guia. Sem `capture`: aqui queremos o seletor de
     arquivo, nao a camera. -->
<input type="file" id="arq-pdf" accept="application/pdf"
       style="display:none" onchange="sepImportarPdf(this)">

<script>
const URL_BASE = '';
let MAPA = { posicoes: [], resumo: {}, layout: null };
let FILTRO_RUA = 0;
let SELECIONADA = null;
let MODO = 'entrada';
const ESCOLHA = { end: null, gai: null };
let scanner = null, camLigada = false, CAMERA_ID = null;
const ultimaLeitura = {};
// Conta as leituras. Depois de confirmar, a tela se limpa sozinha em 2,2 s
// — mas se nesse meio tempo o operador já leu a PRÓXIMA etiqueta, a
// limpeza não pode apagar o que ele acabou de ler. O contador é o que
// distingue "ninguém mexeu" de "já tem coisa nova aqui".
let GERACAO = 0;

/* ══════════════ utilidades ══════════════ */
const $ = id => document.getElementById(id);
const fmtKg = v => Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' kg';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function beep(f, d) {
  try { const c = new (window.AudioContext || window.webkitAudioContext)(); const o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination); o.frequency.value = f; o.type = 'sine';
    g.gain.setValueAtTime(.25, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + d);
    o.start(); o.stop(c.currentTime + d); } catch (e) {}
}
function vibrar(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
function dizer(tipo, txt, ms) {
  $('msg').innerHTML = '<div class="aviso ' + tipo + '">' + txt + '</div>';
  if (ms) setTimeout(() => { if ($('msg').textContent.replace(/\s/g,'') === String(txt).replace(/<[^>]+>/g,'').replace(/\s/g,'')) $('msg').innerHTML = ''; }, ms);
}

function irAba(qual) {
  for (const a of ['mapa', 'acao', 'sep', 'sob']) {
    $('ab-' + a).classList.toggle('on', qual === a);
    $('pg-' + a).classList.toggle('on', qual === a);
  }
  if (qual !== 'acao') pararCamera();
  if (qual === 'mapa') carregarMapa();
  if (qual === 'sep') sepRender();
  if (qual === 'sob') sobRender();
}

/* ══════════════ MAPA ══════════════ */
async function carregarMapa() {
  try {
    const r = await fetch(URL_BASE + '/enderecamento/mapa');
    const d = await r.json();
    if (!d.ok) throw new Error(d.erro || 'falha');
    MAPA = d;
    desenharResumo();
    desenhar();
  } catch (e) {
    $('mapa').innerHTML = '<div class="vazio">Não consegui carregar o mapa: ' + esc(e.message) + '</div>';
  }
}

function desenharResumo() {
  const r = MAPA.resumo || {};
  $('resumo').innerHTML = [
    ['ocupadas', r.ocupadas], ['livres', r.livres], ['bloqueadas', r.bloqueadas],
    ['fardos', r.fardos], ['em estoque', fmtKg(r.kg)],
  ].map(([rot, v]) => `<div class="rz"><b>${typeof v === 'number' ? v : esc(v)}</b><span>${rot}</span></div>`).join('');
}

function filtrarRua(n, el) {
  FILTRO_RUA = n;
  document.querySelectorAll('.chip[data-rua]').forEach(c => c.classList.toggle('on', c === el));
  desenhar();
}

// Casa a busca com o endereço, a gaiola, o formato ou a cor.
function casa(p, termo) {
  if (!termo) return false;
  const t = termo.toLowerCase();
  const g = p.gaiola || {};
  return [p.codigo, g.id, g.formato, g.cor].filter(Boolean).some(v => String(v).toLowerCase().includes(t));
}

function desenhar() {
  const termo = ($('busca').value || '').trim();
  const ruas = Object.keys(MAPA.layout ? MAPA.layout.ruas : { 1: 0, 2: 0 }).map(Number)
                 .filter(r => !FILTRO_RUA || r === FILTRO_RUA);
  let html = '';
  for (const rua of ruas) {
    const doRua = MAPA.posicoes.filter(p => p.rua === rua);
    if (!doRua.length) continue;
    const ocup = doRua.filter(p => p.ocupada).length;
    const uteis = doRua.filter(p => !p.bloqueada).length;
    html += `<div class="rua"><div class="rua-tit">RUA ${String(rua).padStart(2,'0')} · ${ocup} de ${uteis} ocupadas</div><div class="niveis">`;
    // Desenha de cima para baixo, como a prateleira é vista de frente.
    for (const nivel of [3, 2, 1]) {
      const vaos = doRua.filter(p => p.nivel === nivel).sort((a, b) => a.posicao - b.posicao);
      if (!vaos.length) continue;
      const tipo = (vaos[0] || {}).tipo_gaiola || '';
      html += `<div class="nivel"><div class="nivel-lb">NÍVEL ${String(nivel).padStart(2,'0')}<small>${tipo === 'GRANDE' ? 'gaiola grande' : 'gaiola pequena'}</small></div><div class="vaos">`;
      for (const p of vaos) {
        const cls = ['vao'];
        if (p.bloqueada) cls.push('bloqueada');
        else if (p.ocupada) cls.push('ocupada');
        if (p.gaiola && p.gaiola.dias >= 30) cls.push('velha');
        if (casa(p, termo)) cls.push('achado');
        const tt = p.bloqueada ? `${p.codigo} — ${p.motivo}`
                 : p.ocupada ? `${p.codigo} — ${p.gaiola.id} · ${p.gaiola.formato || ''} ${p.gaiola.cor || ''} · ${p.gaiola.fardos || 0} fardos`
                 : `${p.codigo} — livre`;
        html += `<div class="${cls.join(' ')}" title="${esc(tt)}" onclick="verPosicao('${p.codigo}')">${String(p.posicao).padStart(2,'0')}</div>`;
      }
      html += '</div></div>';
    }
    html += '</div></div>';
  }
  $('mapa').innerHTML = html || '<div class="vazio">Nada para mostrar.</div>';
}

async function verPosicao(codigo) {
  SELECIONADA = codigo;
  const p = MAPA.posicoes.find(x => x.codigo === codigo);
  if (!p) return;
  const g = p.gaiola;
  let corpo;
  if (p.bloqueada) {
    corpo = `<div class="vazio">Posição <b>bloqueada</b>: ${esc(p.motivo || '')}.<br>Não recebe palete.</div>`;
  } else if (!g) {
    corpo = `<div class="vazio">Livre. Espera uma gaiola <b>${p.tipo_gaiola === 'GRANDE' ? 'grande' : 'pequena'}</b>.</div>`;
  } else {
    const quando = g.entrada ? new Date(g.entrada).toLocaleString('pt-BR') : '—';
    corpo = `
      <div class="linha"><span>Gaiola</span><span>${esc(g.id)}</span></div>
      <div class="linha"><span>Formato</span><span>${esc(g.formato || '—')}</span></div>
      <div class="linha"><span>Cor</span><span>${esc(g.cor || '—')}</span></div>
      <div class="linha"><span>Fardos</span><span>${g.fardos != null ? g.fardos : '—'}</span></div>
      <div class="linha"><span>Peso</span><span>${g.kg != null ? fmtKg(g.kg) : '—'}</span></div>
      <div class="linha"><span>Guardada em</span><span>${esc(quando)}</span></div>
      <div class="linha"><span>Parada há</span><span>${g.dias != null ? g.dias + (g.dias === 1 ? ' dia' : ' dias') : '—'}</span></div>
      ${g.operador ? `<div class="linha"><span>Quem guardou</span><span>${esc(g.operador)}</span></div>` : ''}
      <div class="acoes"><button class="btn perigo" onclick="liberarDaqui('${p.codigo}')">➖ RETIRAR DAQUI</button></div>`;
  }
  $('detalhe').innerHTML = `<div class="det">
      <h3>${esc(p.codigo)}</h3>
      <div class="sub">Rua ${String(p.rua).padStart(2,'0')} · nível ${String(p.nivel).padStart(2,'0')} · posição ${String(p.posicao).padStart(3,'0')}
        · vão de gaiola ${p.tipo_gaiola === 'GRANDE' ? 'GRANDE' : 'PEQUENA'}</div>
      ${corpo}
    </div>`;
  $('detalhe').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

async function liberarDaqui(codigo) {
  const p = MAPA.posicoes.find(x => x.codigo === codigo);
  const g = p && p.gaiola;
  if (!g) return;
  if (!confirm(`Retirar a gaiola ${g.id} de ${codigo}?\n\nO endereço fica livre. O histórico guarda que ela esteve aqui.`)) return;
  try {
    const r = await fetch(URL_BASE + '/enderecamento/liberar', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ posicao: codigo, operador: window.EKO_RESPONSAVEL || null, motivo: 'retirada pelo mapa' }) });
    const d = await r.json();
    if (!d.ok) throw new Error(d.erro || 'falha');
    await carregarMapa();
    verPosicao(codigo);
  } catch (e) { alert('Não consegui liberar: ' + e.message); }
}

/* ══════════════ ENDEREÇAR ══════════════ */
function irModo(m) {
  MODO = m;
  // Trocar de COLOCAR para RETIRAR e reler a MESMA etiqueta é intenção,
  // não repetição acidental. Sem limpar a memória do anti-repetição, a
  // segunda leitura ficaria 2,5 s no vazio e pareceria que a câmera falhou.
  for (const k of Object.keys(ultimaLeitura)) delete ultimaLeitura[k];
  $('md-entrada').classList.toggle('on', m === 'entrada');
  $('md-saida').classList.toggle('on', m === 'saida');
  limparTudo();
  $('slot-gai').style.display = (m === 'saida') ? 'none' : '';
  $('dica-modo').innerHTML = (m === 'entrada')
    ? 'Leia os dois QR, na ordem que for mais fácil: a etiqueta da prateleira e a da gaiola. Toque num quadro para apagar e ler de novo.'
    : 'Leia <b>ou</b> a etiqueta da prateleira <b>ou</b> a da gaiola — o sistema descobre o resto sozinho.';
  $('v-end').textContent = (m === 'entrada') ? 'leia a etiqueta da prateleira' : 'leia a prateleira ou a gaiola';
}

// Descobre sozinho o que foi lido: o QR do endereço é o código puro
// (01-02-007) e o da gaiola começa com EKOPA. Assim o operador não
// precisa dizer de antemão o que vai ler.
function interpretar(texto) {
  const t = String(texto || '').trim();
  if (/^\d{2}-\d{2}-\d{3}$/.test(t)) return { tipo: 'endereco', codigo: t };
  if (/^EKOPA\|/i.test(t)) {
    const p = t.split('|');
    return { tipo: 'gaiola', id: (p[1] || '').toUpperCase(), formato: p[2] || null,
             corKey: p[3] || null, fardos: parseInt(p[4], 10) || null, kg: Number(p[5]) || null,
             tipo_gaiola: (p[6] || '').toUpperCase() || null };
  }
  if (/^G\d+$/i.test(t)) return { tipo: 'gaiola', id: t.toUpperCase() };
  return { tipo: null, bruto: t };
}

async function onLeu(texto) {
  const agora = Date.now();
  if (ultimaLeitura[texto] && agora - ultimaLeitura[texto] < 2500) return;
  ultimaLeitura[texto] = agora;
  const info = interpretar(texto);

  if (!info.tipo) {
    beep(320, .2); vibrar(150);
    dizer('err', 'Isso não é etiqueta de endereço nem de gaiola: <code>' + esc(String(texto).slice(0, 40)) + '</code>', 5000);
    return;
  }
  beep(880, .09); vibrar(40);
  GERACAO++;

  if (MODO === 'saida') {
    // Na saída tanto faz o que foi lido — os dois resolvem o endereço.
    ESCOLHA.end = info.tipo === 'endereco' ? { codigo: info.codigo } : null;
    ESCOLHA.gai = info.tipo === 'gaiola' ? info : null;
    await pintarSaida(info);
    return;
  }

  if (info.tipo === 'endereco') { ESCOLHA.end = { codigo: info.codigo }; await detalharEndereco(); }
  else                          { ESCOLHA.gai = info;                    await detalharGaiola(); }
  pintar();
}

async function detalharEndereco() {
  const c = ESCOLHA.end && ESCOLHA.end.codigo;
  if (!c) return;
  try {
    const r = await fetch(URL_BASE + '/enderecamento/posicao/' + encodeURIComponent(c));
    const d = await r.json();
    if (!d.ok) { ESCOLHA.end = null; dizer('err', d.erro || 'endereço não existe', 5000); return; }
    ESCOLHA.end.info = d;
    if (d.posicao.bloqueada) { dizer('err', `Endereço ${c} está bloqueado: ${esc(d.posicao.motivo || '')}`, 6000); ESCOLHA.end = null; return; }
    if (d.atual) dizer('at', `Atenção: ${c} já tem a gaiola <b>${esc(d.atual.gaiola_id)}</b>. Retire antes de colocar outra.`, 7000);
  } catch (e) { /* segue com o pouco que tem */ }
}

async function detalharGaiola() {
  const g = ESCOLHA.gai;
  if (!g || !g.id) return;
  try {
    const r = await fetch(URL_BASE + '/enderecamento/gaiola/' + encodeURIComponent(g.id));
    const d = await r.json();
    if (d.ok) {
      if (d.gaiola) { g.formato = d.gaiola.formato || g.formato; g.fardos = d.gaiola.fardos ?? g.fardos;
                      g.kg = d.gaiola.kg ?? g.kg; g.tipo_gaiola = g.tipo_gaiola || d.gaiola.tipo_gaiola || null; }
      if (d.atual) dizer('at', `A gaiola ${esc(g.id)} já está endereçada em <b>${esc(d.atual.posicao)}</b>. Retire de lá primeiro.`, 7000);
    }
  } catch (e) {}
}

async function pintarSaida(info) {
  const alvo = info.tipo === 'endereco' ? { posicao: info.codigo } : { gaiola_id: info.id };
  try {
    const url = info.tipo === 'endereco'
      ? '/enderecamento/posicao/' + encodeURIComponent(info.codigo)
      : '/enderecamento/gaiola/' + encodeURIComponent(info.id);
    const d = await (await fetch(URL_BASE + url)).json();
    const ocup = d.ok ? d.atual : null;
    if (!ocup) {
      dizer('err', info.tipo === 'endereco' ? `O endereço ${esc(info.codigo)} já está vazio.`
                                            : `A gaiola ${esc(info.id)} não está endereçada.`, 6000);
      limparSlots(); return;
    }
    ESCOLHA.end = { codigo: ocup.posicao, ocupacao: ocup };
    ESCOLHA.gai = { id: ocup.gaiola_id, formato: ocup.formato, cor: ocup.cor, fardos: ocup.fardos, kg: ocup.kg };
    pintar();
    dizer('ok', `Vai retirar <b>${esc(ocup.gaiola_id)}</b> de <b>${esc(ocup.posicao)}</b>. Confirme.`, 0);
  } catch (e) { dizer('err', 'Erro: ' + esc(e.message), 5000); }
}

function pintar() {
  const e = ESCOLHA.end, g = ESCOLHA.gai;
  $('slot-end').classList.toggle('cheio', !!e);
  $('v-end').className = 'val' + (e ? '' : ' vazio2');
  $('v-end').textContent = e ? e.codigo : (MODO === 'entrada' ? 'leia a etiqueta da prateleira' : 'leia a prateleira ou a gaiola');
  const pos = e && e.info && e.info.posicao;
  $('e-end').textContent = pos ? `Rua ${String(pos.rua).padStart(2,'0')} · nível ${String(pos.nivel).padStart(2,'0')} · vão ${pos.tipo_gaiola === 'GRANDE' ? 'grande' : 'pequeno'}` : '';

  $('slot-gai').classList.toggle('cheio', !!g);
  $('v-gai').className = 'val' + (g ? '' : ' vazio2');
  $('v-gai').textContent = g ? g.id : 'leia a etiqueta da gaiola';
  $('e-gai').textContent = g ? [g.formato, g.cor, g.fardos ? g.fardos + ' fardos' : null, g.kg ? fmtKg(g.kg) : null]
                                .filter(Boolean).join(' · ') : '';

  const pronto = MODO === 'saida' ? !!e : (!!e && !!g);
  $('btn-confirmar').disabled = !pronto;
  $('btn-confirmar').textContent = MODO === 'saida' ? '✓ CONFIRMAR RETIRADA' : '✓ CONFIRMAR';
}

function limparSlot(qual) { ESCOLHA[qual] = null; GERACAO++; pintar(); }
// Limpa os quadros SEM apagar o recado da tela — quando o recado explica
// justamente por que os quadros foram limpos.
function limparSlots() { ESCOLHA.end = null; ESCOLHA.gai = null; GERACAO++; pintar(); }
function limparTudo() { $('msg').innerHTML = ''; limparSlots(); }

async function confirmar() {
  const e = ESCOLHA.end, g = ESCOLHA.gai;
  $('btn-confirmar').disabled = true;
  try {
    if (MODO === 'saida') {
      const r = await fetch(URL_BASE + '/enderecamento/liberar', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ posicao: e.codigo, operador: window.EKO_RESPONSAVEL || null }) });
      const d = await r.json();
      if (!d.ok) throw new Error(d.erro || 'falha');
      beep(1100, .15); vibrar([50, 40, 50]);
      dizer('ok', `✓ ${esc(d.gaiola_id)} retirada de <b>${esc(d.posicao)}</b>. Endereço livre.`, 0);
    } else {
      const r = await fetch(URL_BASE + '/enderecamento/ocupar', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ posicao: e.codigo, gaiola_id: g.id, formato: g.formato,
                               cor: g.cor, fardos: g.fardos, kg: g.kg, tipo_gaiola: g.tipo_gaiola,
                               operador: window.EKO_RESPONSAVEL || null }) });
      const d = await r.json();
      if (!d.ok) throw new Error(d.erro || 'falha');
      beep(1100, .15); vibrar([50, 40, 50]);
      dizer(d.aviso ? 'at' : 'ok',
        `✓ <b>${esc(g.id)}</b> guardada em <b>${esc(e.codigo)}</b>.` + (d.aviso ? '<br>' + esc(d.aviso) : ''), 0);
    }
    const geracao = ++GERACAO;
    setTimeout(() => { if (GERACAO === geracao) limparTudo(); }, 2200);
    carregarHistorico();
  } catch (err) {
    beep(320, .25); vibrar([120, 60, 120]);
    dizer('err', esc(err.message), 0);
    $('btn-confirmar').disabled = false;
  }
}

async function digitar() {
  const v = prompt(MODO === 'saida'
    ? 'Digite o endereço (01-02-007) ou a gaiola (G0000123):'
    : 'Digite o endereço (01-02-007) ou a gaiola (G0000123):');
  if (!v) return;
  delete ultimaLeitura[v.trim()];
  await onLeu(v.trim().toUpperCase());
}

async function carregarHistorico() {
  try {
    const d = await (await fetch(URL_BASE + '/enderecamento/historico?limit=12')).json();
    const ms = (d.movimentos || []);
    if (!ms.length) { $('hist').innerHTML = '<div class="vazio">Nenhum movimento ainda.</div>'; return; }
    $('hist').innerHTML = ms.map(m => {
      const saiu = !!m.saida;
      const q = new Date(saiu ? m.saida : m.entrada).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
      return `<div class="hist-item"><span>${saiu ? '➖' : '➕'} ${esc(m.gaiola_id)} ${saiu ? 'saiu de' : 'em'} <b>${esc(m.posicao)}</b></span><span>${esc(q)}</span></div>`;
    }).join('');
  } catch (e) {}
}

/* ══════════════ câmera ══════════════
   Mesma receita do inventário, que já roda no celular do galpão:
   escolhe a traseira "simples" (a ultra-angular não foca de perto),
   pede resolução alta e mira ampla. Se a câmera não abrir, o botão
   DIGITAR resolve — a tela nunca fica sem saída.                    */
async function escolherCameraId() {
  try {
    const cams = await Html5Qrcode.getCameras();
    if (!cams || !cams.length) return null;
    const rot = c => (c.label || '').toLowerCase();
    const tras = cams.filter(c => /traseira|back|rear|trás/.test(rot(c)));
    if (tras.length) {
      const semUltra = tras.filter(c => !/ultra/.test(rot(c)));
      const lista = semUltra.length ? semUltra : tras;
      const simples = lista.find(c => !/dupla|dual|tripla|grande|wide/.test(rot(c)));
      return (simples || lista[lista.length - 1]).id;
    }
    return cams[cams.length - 1].id;
  } catch (e) { return null; }
}

// A camera atende DUAS abas: Enderecar e Separacao. O destino diz em
// qual quadro o video aparece, qual botao troca de texto e para onde vai
// a leitura. Sem isso seriam dois leitores concorrendo pela mesma camera.
let CAM_DEST = { el: 'reader', btn: 'btn-cam', cb: (t) => onLeu(t) };
async function toggleCamera(destino) {
  if (destino && camLigada && destino.el !== CAM_DEST.el) await pararCamera();
  if (destino) CAM_DEST = destino;
  if (camLigada) { await pararCamera(); return; }
  if (typeof Html5Qrcode === 'undefined') { dizer('err', 'A biblioteca de leitura não carregou. Use DIGITAR.', 0); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    dizer('err', 'O navegador não liberou a câmera. Isso costuma ser o certificado do servidor não confiável neste aparelho — use DIGITAR enquanto isso.', 0);
    return;
  }
  $(CAM_DEST.el).classList.add('on');
  $(CAM_DEST.btn).textContent = '⏹ DESLIGAR CÂMERA';
  camLigada = true;

  const qrboxFn = (vw, vh) => { const l = Math.floor(Math.min(vw, vh) * 0.92); return { width: Math.max(120, l), height: Math.max(120, l) }; };
  const config = { fps: 10, qrbox: qrboxFn, aspectRatio: 1.0,
                   videoConstraints: { facingMode: 'environment', width: { ideal: 3840 }, height: { ideal: 2160 } } };
  const id = CAMERA_ID || await escolherCameraId();
  CAMERA_ID = id || null;
  const alvos = []; if (id) alvos.push(id);
  alvos.push({ facingMode: 'environment' }); alvos.push({ facingMode: 'user' });

  let ok = false, ultimo = '';
  for (const alvo of alvos) {
    try { if (scanner) { try { await scanner.stop(); } catch (e) {} try { scanner.clear(); } catch (e) {} } } catch (e) {}
    scanner = new Html5Qrcode(CAM_DEST.el, { verbose: false });
    try { await scanner.start(alvo, config, t => CAM_DEST.cb(t), () => {}); ok = true; break; }
    catch (err) { ultimo = (err && (err.name || err.message)) || 'erro'; if (/NotAllowed|Permission/i.test(String(ultimo))) break; }
  }
  if (!ok) {
    camLigada = false; $(CAM_DEST.el).classList.remove('on'); $(CAM_DEST.btn).textContent = '▶ LIGAR CÂMERA';
    dizer('err', 'A câmera não abriu (' + esc(ultimo) + '). Use DIGITAR.', 0);
    return;
  }
  try { await scanner.applyVideoConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {}
}

async function pararCamera() {
  camLigada = false;
  const b = $(CAM_DEST.btn); if (b) b.textContent = '▶ LIGAR CÂMERA';
  try { if (scanner) { await scanner.stop(); scanner.clear(); } } catch (e) {}
  const e2 = $(CAM_DEST.el); if (e2) e2.classList.remove('on');
}

/* ══════════════════════════════════════════════════════════════════
   SEPARAÇÃO
   ------------------------------------------------------------------
   O ciclo: FOTO DA GUIA → conferência → ordem de carregamento →
   plano de coleta.

   A foto é o gatilho de propósito. Ela é o que prova de onde vieram os
   números, e fica na tela durante toda a conferência para comparar.
   ══════════════════════════════════════════════════════════════════ */
const SEP_CORES = [
  { key: 'AM',  nome: 'Amarela',  cor: '#f5c800', txt: '#231d00' },
  { key: 'BC',  nome: 'Branca',   cor: '#eaeaea', txt: '#1a1a1a' },
  { key: 'PT',  nome: 'Preta',    cor: '#3a3a3a', txt: '#f0f0f0' },
  { key: 'REC', nome: 'Colorida', cor: '#2eb82e', txt: '#04220a' },
];
const SEP_FORMATOS = ['30x40','30x45','33x46','35x45','40x50','42x53','50x60','60x80','80x100'];
const KG_FARDO = 25;

let SEP = null;            // { id, status, arquivo }
let SEP_PEDIDOS = [];      // rascunho editável na tela
let SEP_UNIDADE = 'kg';    // a guia vem em kg; fardos existe para quem preferir
let SEP_PLANO = null;
let SEP_ESTADO = null;
let SEP_CORRIGINDO = false;    // resposta completa do GET /separacao/:id
let SEP_ORDENANDO = false;     // na tela de ORDEM DE CARREGAMENTO (passo 2)
let SEP_LISTA = [];

const sepAviso = (t, c) => { $('sep-msg').innerHTML = t ? `<div class="aviso ${c||'at'}">${t}</div>` : ''; };

/* ── Entrada da guia ───────────────────────────────────────────── */
function sepFotografar() { $('arq-guia').click(); }

// Reduz a foto antes de enviar. Foto de celular passa de 4 MB e não
// acrescenta nada: o que se lê numa guia impressa cabe folgado em
// 2000 px. Se a redução falhar (formato que o navegador não abre),
// manda o arquivo original em vez de desistir.
function sepReduzir(file, lado, q) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const esc = Math.min(1, lado / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * esc); c.height = Math.round(img.height * esc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(b => b ? resolve(b) : reject(new Error('canvas vazio')), 'image/jpeg', q);
      } catch (e) { URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('navegador não abriu a imagem')); };
    img.src = url;
  });
}

async function sepEnviarFoto(input) {
  const f = input.files && input.files[0];
  input.value = '';                       // deixa escolher o mesmo arquivo de novo
  if (!f) return;
  sepAviso('Enviando a guia…', 'at');
  let corpo = f, tipo = f.type || 'image/jpeg';
  if (tipo !== 'application/pdf') {
    try { corpo = await sepReduzir(f, 2000, 0.85); tipo = 'image/jpeg'; }
    catch (e) { corpo = f; tipo = f.type || 'image/jpeg'; }
  }
  try {
    const r = await fetch(URL_BASE + '/separacao/nova',
                          { method: 'POST', headers: { 'Content-Type': tipo }, body: corpo });
    const d = await r.json();
    if (!d.ok) throw new Error(d.erro || 'falha ao enviar');
    beep(880, .09); vibrar(40);
    SEP = { id: d.id, status: d.status, arquivo: d.arquivo };
    SEP_PEDIDOS = [];  SEP_ESTADO = null;  SEP_CORRIGINDO = false;  SEP_ORDENANDO = false;
    SEP_UNIDADE = 'kg';        // guia nova SEMPRE começa em kg — ver comentário
    sepNovoPedido();
    sepAviso('Guia recebida. Agora confira os pedidos com a foto ao lado.', 'ok');
    sepRender();
  } catch (e) {
    sepAviso('Não consegui enviar a guia: ' + esc(e.message), 'err');
  }
}

/* ── Estado ────────────────────────────────────────────────────── */
async function sepCarregarLista() {
  try {
    const r = await fetch(URL_BASE + '/separacao?limit=15');
    const d = await r.json();
    SEP_LISTA = d.ok ? (d.separacoes || []) : [];
  } catch (e) { SEP_LISTA = []; }
}

// Recarrega o estado inteiro do servidor. A tela do plano desenha SEMPRE
// a partir daqui — nunca de um plano guardado na memória — para o que o
// operador vê ser o que o banco tem, inclusive o que já foi coletado.
async function sepCarregarEstado() {
  const r = await fetch(URL_BASE + '/separacao/' + SEP.id);
  const d = await r.json();
  if (!d.ok) throw new Error(d.erro || 'falha');
  SEP = d.separacao;
  SEP_ESTADO = d;
  SEP_PEDIDOS = (d.pedidos || []).map(p => ({
    id: p.id, ordem: p.ordem, cliente: p.cliente || '', cidade: p.cidade || '', uf: p.uf || '',
    carga: p.carga || '', pedido_numero: p.pedido_numero || '',
    itens: (p.itens || []).map(it => ({ cor_key: it.cor_key, formato: it.formato, qtd: it.fardos })),
  }));
  if (SEP_PEDIDOS.length) SEP_UNIDADE = 'fardos';   // o banco já guarda em fardos
  return d;
}

async function sepAbrir(id) {
  try {
    SEP = { id };
    await sepCarregarEstado();
    if (!SEP_PEDIDOS.length) sepNovoPedido();
    sepAviso('');
    sepRender();
  } catch (e) { sepAviso('Não consegui abrir: ' + esc(e.message), 'err'); }
}

function sepFechar() { SEP = null; SEP_PEDIDOS = []; SEP_ESTADO = null; SEP_CORRIGINDO = false;
  SEP_ORDENANDO = false; pararCamera(); sepAviso(''); sepRender(); }

/* ── Edição da conferência ─────────────────────────────────────── */
function sepNovoPedido() {
  const ordem = SEP_PEDIDOS.length ? Math.max(...SEP_PEDIDOS.map(p => p.ordem)) + 1 : 1;
  SEP_PEDIDOS.push({ ordem, cliente: '', cidade: '', uf: '', itens: [{ cor_key: 'BC', formato: '50x60', qtd: '' }] });
  sepRender();
}
function sepRemoverPedido(i) {
  SEP_PEDIDOS.splice(i, 1);
  SEP_PEDIDOS.forEach((p, k) => p.ordem = k + 1);   // renumera para não deixar buraco
  sepRender();
}
function sepNovoItem(i) { SEP_PEDIDOS[i].itens.push({ cor_key: 'BC', formato: '50x60', qtd: '' }); sepRender(); }
function sepRemoverItem(i, j) { SEP_PEDIDOS[i].itens.splice(j, 1); sepRender(); }
function sepSetCor(i, j, key) { SEP_PEDIDOS[i].itens[j].cor_key = key; sepRender(); }
function sepSet(i, campo, v) { SEP_PEDIDOS[i][campo] = v; }
function sepSetItem(i, j, campo, v) { SEP_PEDIDOS[i].itens[j][campo] = v; }
function sepUnidade(u) { SEP_UNIDADE = u; sepRender(); }

// Subir/descer na ordem de carregamento. Primeiro a carregar é o
// último a entregar — quem decide é o gestor, o sistema só respeita.
function sepMover(i, d) {
  const j = i + d;
  if (j < 0 || j >= SEP_PEDIDOS.length) return;
  const t = SEP_PEDIDOS[i]; SEP_PEDIDOS[i] = SEP_PEDIDOS[j]; SEP_PEDIDOS[j] = t;
  SEP_PEDIDOS.forEach((p, k) => p.ordem = k + 1);
  sepRender();
}

/* ── Enviar conferência e planejar ─────────────────────────────── */
async function sepConferirEPlanejar() {
  const pedidos = [];
  for (const p of SEP_PEDIDOS) {
    const itens = [];
    for (const it of p.itens) {
      const q = Number(String(it.qtd).replace(',', '.'));
      if (!(q > 0)) continue;
      itens.push(SEP_UNIDADE === 'kg'
        ? { cor_key: it.cor_key, formato: it.formato, kg: q }
        : { cor_key: it.cor_key, formato: it.formato, fardos: Math.round(q) });
    }
    if (!itens.length) continue;
    // carga e pedido_numero vêm da guia e não aparecem nesta tela; se
    // não forem devolvidos aqui, corrigir um item apagaria o rótulo
    // "CARGA 1 · Entrega #4" que a tela de ordem usa como referência.
    pedidos.push({ ordem: p.ordem, cliente: p.cliente || null, cidade: p.cidade || null,
                   uf: p.uf || null, carga: p.carga || null,
                   pedido_numero: p.pedido_numero || null, itens });
  }
  if (!pedidos.length) { sepAviso('Preencha ao menos um item com quantidade.', 'err'); return; }

  sepAviso('Conferindo…', 'at');
  try {
    let r = await fetch(URL_BASE + `/separacao/${SEP.id}/conferir`,
      { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pedidos }) });
    let d = await r.json();
    if (!d.ok) throw new Error(d.erro || 'falha na conferência');
    const avisos = d.avisos || [];

    SEP_CORRIGINDO = false;
    await sepCarregarEstado();
    beep(880, .09); vibrar(40);

    // Confere → ORDEM → lista. Não pula direto para os endereços: a
    // sequência de carregamento é o que decide a lista, e ela é do
    // gestor. Os avisos do arredondamento em kg viajam junto.
    SEP_ORDENANDO = true;
    sepAviso(avisos.length ? avisos.map(a => esc(a)).join('<br>') : '', 'at');
    sepRender();
  } catch (e) { sepAviso('Não consegui gerar o plano: ' + esc(e.message), 'err'); }
}

async function sepReplanejar() {
  sepAviso('Refazendo o plano…', 'at');
  try {
    const r = await fetch(URL_BASE + `/separacao/${SEP.id}/planejar`, { method: 'POST' });
    const d = await r.json();
    if (!d.ok) throw new Error(d.erro || 'falha');
    await sepCarregarEstado();
    sepAviso(d.resumo && d.resumo.faltando
      ? `Plano refeito. Ainda faltam ${d.resumo.faltando} fardo(s).`
      : 'Plano refeito. Nada faltando.', d.resumo && d.resumo.faltando ? 'at' : 'ok');
    sepRender();
  } catch (e) { sepAviso('Não consegui refazer: ' + esc(e.message), 'err'); }
}

/* ── Desenho ───────────────────────────────────────────────────────
   O processo tem TRÊS passos, nesta ordem, e a tela diz em qual você
   está. Sem isso, importar a guia caía direto numa tela de coleta e
   ninguém entendia onde entrou a decisão da ordem de carregamento —
   que é justamente a única decisão que o sistema não pode tomar. */
function sepRender() {
  if (!SEP) { sepDesenharAbertura(); return; }
  if (SEP_CORRIGINDO) { sepDesenharConferencia(); return; }
  if (SEP_ORDENANDO)  { sepDesenharOrdem(); return; }
  const temPlano = SEP_ESTADO && (SEP_ESTADO.coletas || []).some(
    c => c.status === 'planejada' || c.status === 'coletada');
  if (temPlano) sepDesenharPlano();
  else sepDesenharConferencia();
}

// A régua dos três passos, no alto de cada tela.
function sepPassos(atual) {
  const nomes = [[1, 'CONFERIR A GUIA'], [2, 'ORDEM DE CARREGAMENTO'], [3, 'SEPARAR']];
  return `<div class="passos">${nomes.map(([n, t]) => `
    <div class="passo ${n === atual ? 'on' : (n < atual ? 'feito' : '')}">
      <b>${n < atual ? '✓' : n}</b><span>${t}</span></div>`).join('')}</div>`;
}

async function sepDesenharAbertura() {
  await sepCarregarLista();
  const linhas = SEP_LISTA.map(s => {
    const q = { rascunho: 'aguardando conferência', conferida: 'conferida',
                em_separacao: 'em separação', concluida: 'concluída', cancelada: 'cancelada' }[s.status] || s.status;
    const dt = String(s.criada_em || '').slice(0, 16).replace('T', ' ');
    return `<div class="hist-item" style="cursor:pointer" onclick="sepAbrir(${s.id})">
      <span><b>#${s.id}</b> · ${esc(q)}${s.pedidos ? ' · ' + s.pedidos + ' pedido(s)' : ''}
        ${s.pendentes ? ` · <span style="color:var(--warn)">${s.pendentes} a coletar</span>` : ''}
        ${s.faltando ? ` · <span style="color:var(--warn)">faltam ${s.faltando}</span>` : ''}</span>
      <span>${esc(dt)}</span></div>`;
  }).join('');

  $('sep-corpo').innerHTML = `
    <div class="foto-alvo" onclick="sepEscolherPdf()" style="border-style:solid;border-color:var(--accent)">
      <span class="ic2">📄</span>
      <b>IMPORTAR A GUIA DE SEPARAÇÃO</b>
      <span>O PDF da guia. A estação lê o arquivo inteiro — clientes,
        cores, formatos e quantidades — e já monta o plano. Ninguém digita.</span>
    </div>
    <div class="acoes" style="margin-bottom:6px">
      <button class="btn" onclick="sepBuscarBling()">🧾 pedidos do Bling</button>
      <button class="btn" onclick="sepFotografar()">📷 foto da guia</button>
    </div>
    <div class="dica">Os dois de cima são alternativas para quando não houver
      o PDF. A foto obriga a digitar a carga inteira.</div>
    ${linhas ? `<div class="hist" style="margin-top:16px"><div class="rua-tit">SEPARAÇÕES RECENTES</div>${linhas}</div>` : ''}`;
}

/* ══════════════════════════════════════════════════════════════════
   IMPORTAR O PDF DA GUIA
   ------------------------------------------------------------------
   O PDF da guia tem camada de texto — não é imagem. Então aqui não há
   OCR: o pdf.js (servido pela própria estação, sem CDN) extrai o texto
   e o servidor interpreta as linhas. É exato, e é o que dispensa
   digitar a carga inteira.
   ══════════════════════════════════════════════════════════════════ */
let PDF_ARQUIVO = null, PDF_NOME = null, PDF_LIDO = null;

function sepEscolherPdf() { $('arq-pdf').click(); }

// A tela só ENVIA o arquivo. Quem lê o PDF é o servidor.
//
// A primeira versão lia aqui, no navegador, com módulo ES. Funcionou no
// laboratório e falhou no galpão: dependia do aparelho suportar módulo
// ES e worker de módulo, e isso muda de celular para celular e para o
// navegador da tela touch. Enviar o arquivo é o mesmo que a foto já
// fazia — e a foto nunca falhou.
async function sepImportarPdf(input) {
  const f = input.files && input.files[0];
  input.value = '';
  if (!f) return;
  PDF_NOME = f.name;
  PDF_ARQUIVO = f;
  sepAviso('Lendo a guia no servidor…', 'at');
  $('sep-corpo').innerHTML = '<div class="vazio">Lendo a guia…</div>';
  try {
    const r = await fetch(URL_BASE + '/separacao/guia/previa', {
      method: 'POST', headers: { 'Content-Type': 'application/pdf' }, body: f });
    const d = await r.json();
    if (!d.ok) throw new Error(d.erro || 'falha ao interpretar');
    PDF_LIDO = d;
    sepAviso('');
    sepDesenharPrevia();
  } catch (e) {
    sepAviso('Não consegui ler o PDF: ' + esc(e.message), 'err');
    sepDesenharAbertura();
  }
}

// Mostra o que foi entendido ANTES de criar a carga. Não é digitação:
// é conferir de relance se o total bate com o da guia.
function sepDesenharPrevia() {
  const d = PDF_LIDO;
  // Não reconheceu nada? Em vez de uma tela vazia e um botão que vai
  // falhar, mostra O QUE FOI LIDO do PDF. É com essas linhas que se
  // descobre em que o layout difere — sem elas, o problema é um beco
  // sem saída para quem está no galpão.
  if (!d.pedidos.length) { sepDesenharDiagnostico(); return; }
  const blocos = d.pedidos.map(p => `
    <div class="ped">
      <div class="ped-top">
        <div class="ped-ordem">${p.ordem}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:14.5px;font-weight:800">${esc(p.cliente)}</div>
          <div style="font-size:12.5px;color:var(--muted)">${esc(p.cidade || '')}${p.uf ? '/' + esc(p.uf) : ''}${
            p.pedido_numero ? ' · Ped.' + esc(p.pedido_numero) : ''}</div>
          ${p.carga ? `<div style="font-size:11.5px;color:var(--accent);font-weight:700">${esc(p.carga)}</div>` : ''}
        </div>
      </div>
      ${p.itens.map(i => `<div class="linha"><span>${esc(i.formato)} ${esc(i.cor_key)}</span>
        <span>${fmtKg(i.kg)} · ${i.fardos} fardo(s)</span></div>`).join('')}
    </div>`).join('');

  // A guia imprime os próprios totais. Bater com eles é a garantia que
  // não depende de eu ter entendido o layout — e poupa conferência no olho.
  const cf = d.conferencia;
  const blocoConf = cf ? (cf.ok ? `
    <div class="aviso ok">✓ <b>Confere com a guia:</b> ${cf.guia_fardos != null
      ? `${cf.guia_fardos} fardos · ${fmtKg(cf.guia_kg)} — o mesmo que o documento imprime.`
      : 'os totais por carga batem com o rodapé.'}</div>` : `
    <div class="aviso err"><b>NÃO bate com os totais da guia:</b><br>
      ${cf.avisos.map(a => esc(a)).join('<br>')}<br>
      Não siga com esta carga sem conferir o documento.</div>`) : '';

  const avisos = (d.avisos || []).length ? `
    <div class="det" style="border-color:var(--warn)">
      <h3 style="font-family:inherit;font-size:14.5px;color:var(--warn)">
        ⚠ ${d.avisos.length} linha(s) que não entendi</h3>
      <div class="sub">Ficaram DE FORA da carga. Confira se são de produto acabado.</div>
      ${d.avisos.map(a => `<div class="linha"><span>${esc(String(a.linha).slice(0, 42))}</span>
        <span>${esc(a.motivo)}</span></div>`).join('')}
    </div>` : '';

  $('sep-corpo').innerHTML = `
    ${sepPassos(1)}
    <div class="guia-mini">
      <div style="width:56px;height:56px;border-radius:8px;background:var(--surface);display:flex;
        align-items:center;justify-content:center;font-size:22px">📄</div>
      <div class="gt"><b>${esc(PDF_NOME || 'guia.pdf')}</b>
        ${d.pedidos.length} cliente(s) · ${d.total_fardos} fardos</div>
      <button class="btn" onclick="sepFechar()">✕</button>
    </div>
    <div class="resumo">
      <div class="rz"><b>${d.pedidos.length}</b><span>clientes</span></div>
      <div class="rz"><b>${fmtKg(d.total_kg).replace(' kg','')}</b><span>kg na guia</span></div>
      <div class="rz"><b>${d.total_fardos}</b><span>fardos</span></div>
    </div>
    ${blocoConf}
    ${avisos}
    <div class="acoes" style="margin-bottom:12px">
      <button class="btn" onclick="sepFechar()">← voltar</button>
      <button class="btn ok" style="flex:1" onclick="sepCriarDaGuia()">
        ✓ CONFERE — DEFINIR A ORDEM DE CARREGAMENTO</button>
    </div>
    <div class="dica" style="margin-bottom:12px">A ordem abaixo é a das colunas da guia.
      <b>O próximo passo é confirmar ou mudar a ordem de carregamento</b> — é ela que
      define por quais endereços você vai passar, e em que sequência.</div>
    ${blocos}`;
}

function sepDesenharDiagnostico() {
  const linhas = (PDF_LIDO && PDF_LIDO.linhas) || [];
  const amostra = linhas.filter(l => l && l.trim()).slice(0, 40);
  const d = (PDF_LIDO && PDF_LIDO.diag) || null;

  // As quatro peças que o leitor precisa achar. Mostrar quais vieram e
  // qual faltou vale mais que qualquer texto: o galpão manda um print
  // desta tela e a causa já está nele.
  const pecas = !d ? '' : [
    ['colunas de pedido', d.colunas_pedido, 'Ped.1063'],
    ['produtos', d.cabecalhos_produto, 'SACOLA … (25KG)'],
    ['tamanhos', d.linhas_tamanho, 'TAMANHO:40X50'],
    ['quantidades', d.quantidades_frd, '120 frd'],
  ].map(([nome, n, ex]) => `
    <div style="display:flex;align-items:center;gap:8px;padding:6px 0">
      <span style="font-size:15px">${n ? '✓' : '✕'}</span>
      <span style="flex:1">${nome}
        <span style="opacity:.55;font-size:12px">(ex.: ${esc(ex)})</span></span>
      <b style="color:${n ? 'var(--accent)' : 'var(--bloqueada)'}">${n}</b>
    </div>`).join('');

  const extras = !d ? '' : [
    d.formatos_fora && d.formatos_fora.length
      ? `Formato(s) que o galpão não tem: <b>${esc(d.formatos_fora.join(', '))}</b>.` : '',
    d.cores_fora && d.cores_fora.length
      ? `Produto(s) sem cor conhecida: <b>${esc(d.cores_fora.join(' / '))}</b>.` : '',
    d.amostra_colunas && d.amostra_colunas.length
      ? `Cabeçalhos de coluna que achei: ${esc(d.amostra_colunas.join(' · '))}.` : '',
  ].filter(Boolean).join('<br>');

  $('sep-corpo').innerHTML = `
    <div class="guia-mini">
      <div style="width:56px;height:56px;border-radius:8px;background:var(--surface);display:flex;
        align-items:center;justify-content:center;font-size:22px">📄</div>
      <div class="gt"><b>${esc(PDF_NOME || 'guia.pdf')}</b>
        ${linhas.length} linha(s) lidas · nenhum cliente reconhecido</div>
      <button class="btn" onclick="sepFechar()">✕</button>
    </div>
    <div class="aviso err">${d ? esc(d.motivo)
      : 'O texto do PDF foi lido, mas o <b>layout é diferente</b> do que eu conheço.'}</div>
    ${d ? `<div class="det" style="margin-bottom:12px">
      <h3 style="font-family:inherit;font-size:14.5px">O que eu procurei no arquivo</h3>
      ${pecas}
      ${extras ? `<div class="sub" style="margin-top:8px">${extras}</div>` : ''}
    </div>` : ''}
    <div class="det">
      <h3 style="font-family:inherit;font-size:14.5px">O que eu li do arquivo</h3>
      <div class="sub">Estas são as primeiras linhas, como saíram do PDF.
        Mande esta tela (ou o próprio PDF) que eu ajusto a leitura.</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.6;
        background:var(--surface);border:1px solid var(--border);border-radius:8px;
        padding:10px;overflow-x:auto;white-space:pre;max-height:420px;overflow-y:auto">${
        amostra.map((l, i) => esc(String(i + 1).padStart(3, ' ') + '  ' + l)).join('\n')
        || '(o PDF não tinha texto nenhum)'}</div>
      <div class="acoes">
        <button class="btn" onclick="sepCopiarLinhas()">📋 copiar as linhas</button>
        <button class="btn" onclick="sepEscolherPdf()">📄 tentar outro PDF</button>
      </div>
    </div>`;
}

function sepCopiarLinhas() {
  const txt = ((PDF_LIDO && PDF_LIDO.linhas) || []).join('\n');
  try {
    navigator.clipboard.writeText(txt);
    sepAviso('Linhas copiadas. Cole na conversa para eu ajustar a leitura.', 'ok');
  } catch (e) {
    sepAviso('Não consegui copiar — mande um print desta tela.', 'at');
  }
}

async function sepCriarDaGuia() {
  sepAviso('Montando a carga…', 'at');
  try {
    const r = await fetch(URL_BASE + '/separacao/de-guia', {
      method: 'POST', headers: { 'Content-Type': 'application/pdf' }, body: PDF_ARQUIVO });
    const d = await r.json();
    if (!d.ok) throw new Error(d.erro || 'falha');
    beep(880, .09); vibrar(40);
    SEP = { id: d.id, status: d.status, arquivo: null };
    SEP_UNIDADE = 'fardos'; SEP_CORRIGINDO = false;
    await sepCarregarEstado();
    // Não planeja ainda. A lista de endereços é consequência da ordem
    // de carregamento, e a ordem é do gestor — montar a lista antes de
    // perguntar é montar a lista errada e ter de refazer.
    SEP_ORDENANDO = true;
    sepAviso('Guia lida. Agora confirme a ordem de carregamento.', 'ok');
    sepRender();
  } catch (e) { sepAviso('Não consegui montar a carga: ' + esc(e.message), 'err'); }
}

/* ── Pedidos direto do Bling ──────────────────────────────────────
   A guia sai do painel de carteira, que existe porque os pedidos estão
   no Bling. Ler na fonte é exato e não custa digitação nenhuma. */
let BL_PEDIDOS = [], BL_ESCOLHA = [];

async function sepBuscarBling() {
  sepAviso('Buscando os pedidos em aberto no Bling…', 'at');
  $('sep-corpo').innerHTML = '<div class="vazio">Carregando…</div>';
  try {
    const r = await fetch(URL_BASE + '/separacao/bling/pedidos?dias=60');
    const d = await r.json();
    if (!d.ok) throw new Error(d.erro || 'falha');
    BL_PEDIDOS = d.pedidos || [];
    BL_ESCOLHA = [];
    sepAviso('');
    sepDesenharBling();
  } catch (e) {
    sepAviso('Não consegui falar com o Bling: ' + esc(e.message)
      + '<br>Dá para seguir pela foto da guia enquanto isso.', 'err');
    sepDesenharAbertura();
  }
}

function blMarcar(id) {
  const i = BL_ESCOLHA.indexOf(id);
  if (i >= 0) BL_ESCOLHA.splice(i, 1); else BL_ESCOLHA.push(id);   // a ordem da escolha vira a de carregamento
  sepDesenharBling();
}
function blMover(i, d) {
  const j = i + d;
  if (j < 0 || j >= BL_ESCOLHA.length) return;
  const t = BL_ESCOLHA[i]; BL_ESCOLHA[i] = BL_ESCOLHA[j]; BL_ESCOLHA[j] = t;
  sepDesenharBling();
}

function sepDesenharBling() {
  const busca = (window.__blBusca || '').toLowerCase();
  const visiveis = BL_PEDIDOS.filter(p => !busca
    || String(p.cliente || '').toLowerCase().includes(busca)
    || String(p.numero || '').includes(busca));

  // A ORDEM DE CARREGAMENTO é a ordem em que foram marcados. Fica no
  // topo, com setas, porque é decisão do gestor — o sistema não escolhe.
  const escolhidos = BL_ESCOLHA.map((id, i) => {
    const p = BL_PEDIDOS.find(x => x.bling_id === id) || {};
    return `<div class="cl">
      <div class="end">${i + 1}º</div>
      <div class="cp"><div class="p1">${esc(p.cliente || '')}</div>
        <div class="p2">pedido ${esc(String(p.numero || p.bling_id))}</div></div>
      <div style="display:flex;gap:4px">
        <button class="btn-ic" onclick="blMover(${i},-1)" title="Carregar antes">↑</button>
        <button class="btn-ic" onclick="blMover(${i},1)" title="Carregar depois">↓</button>
        <button class="btn-ic" onclick="blMarcar(${p.bling_id})" title="Tirar">✕</button>
      </div></div>`;
  }).join('');

  const lista = visiveis.map(p => {
    const on = BL_ESCOLHA.includes(p.bling_id);
    return `<div class="cl ${on ? 'pronta' : ''}" style="cursor:pointer" onclick="blMarcar(${p.bling_id})">
      <div class="end" style="font-size:15px">${on ? '✓' : '○'}</div>
      <div class="cp"><div class="p1">${esc(p.cliente || '(sem nome)')}</div>
        <div class="p2">pedido ${esc(String(p.numero || p.bling_id))} ·
          ${esc(String(p.data || '').slice(0, 10))}</div></div></div>`;
  }).join('');

  $('sep-corpo').innerHTML = `
    <div class="acoes" style="margin-bottom:12px">
      <button class="btn" onclick="sepFechar()">← voltar</button>
      <button class="btn ok" style="flex:1" onclick="sepCriarDoBling()"
        ${BL_ESCOLHA.length ? '' : 'disabled'}>✓ MONTAR CARGA (${BL_ESCOLHA.length})</button>
    </div>
    ${escolhidos ? `<div class="rua-tit">ORDEM DE CARREGAMENTO</div>${escolhidos}
      <div class="dica" style="margin-bottom:14px">O primeiro a carregar é o
        último a entregar. Use as setas para acertar.</div>` : ''}
    <div class="rua-tit">PEDIDOS EM ABERTO NO BLING (${BL_PEDIDOS.length})</div>
    <input class="busca" style="width:100%;margin:8px 0 10px" placeholder="Buscar cliente ou número…"
           value="${esc(window.__blBusca || '')}"
           oninput="window.__blBusca=this.value; sepDesenharBling()">
    ${lista || '<div class="vazio">Nenhum pedido em aberto encontrado.</div>'}`;
}

async function sepCriarDoBling() {
  if (!BL_ESCOLHA.length) return;
  sepAviso('Lendo os itens dos pedidos no Bling…', 'at');
  try {
    const r = await fetch(URL_BASE + '/separacao/de-bling', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ operador: window.EKO_RESPONSAVEL || null,
        pedidos: BL_ESCOLHA.map((id, i) => ({ bling_id: id, ordem: i + 1 })) }) });
    const d = await r.json();
    if (!d.ok) throw new Error(d.erro || 'falha');
    beep(880, .09); vibrar(40);
    SEP = { id: d.id, status: d.status, arquivo: null };
    SEP_UNIDADE = 'fardos'; SEP_CORRIGINDO = false;
    await sepCarregarEstado();

    // Item que a estação não soube traduzir NÃO some calado.
    if ((d.nao_reconhecidos || []).length) {
      sepAviso('<b>Não reconheci estes itens e eles ficaram de fora:</b><br>'
        + d.nao_reconhecidos.map(x => `${esc(x.cliente || '')} — ${esc(x.descricao || x.codigo || '?')}`
            + ` <i>(${esc(x.motivo)})</i>`).join('<br>')
        + '<br>Confira se são de produto acabado. Se forem, dá para acrescentar em “corrigir a guia”.', 'at');
    } else sepAviso('Pedidos lidos. Agora confirme a ordem de carregamento.', 'ok');

    SEP_ORDENANDO = true;      // mesma regra do PDF: a ordem vem antes da lista
    sepRender();
  } catch (e) { sepAviso('Não consegui montar a carga: ' + esc(e.message), 'err'); }
}

function sepCabecalhoGuia() {
  if (!SEP) return '';
  const ehPdf = String(SEP.arquivo || '').toLowerCase().endsWith('.pdf');
  const url = `${URL_BASE}/separacao/${SEP.id}/guia`;
  const mini = ehPdf
    ? `<div style="width:56px;height:56px;border-radius:8px;background:var(--surface);display:flex;
         align-items:center;justify-content:center;font-size:22px">📄</div>`
    : `<img src="${url}" alt="Guia" onclick="sepLupa('${url}')">`;
  return `<div class="guia-mini">
      ${mini}
      <div class="gt"><b>Separação #${SEP.id}</b>
        ${ehPdf ? `<a href="${url}" target="_blank" style="color:var(--accent)">abrir o PDF da guia</a>`
                : 'toque na foto para ampliar'}</div>
      <button class="btn" onclick="sepFechar()">✕</button>
    </div>`;
}
function sepLupa(url) { $('lupa-img').src = url; $('lupa').classList.add('on'); }

function sepDesenharConferencia() {
  const cards = SEP_PEDIDOS.map((p, i) => {
    const itens = p.itens.map((it, j) => `
      <div class="item">
        <div class="it-l1">
          <div class="cores">${SEP_CORES.map(c => `
            <button class="cb ${it.cor_key === c.key ? 'on' : ''}" style="background:${c.cor};color:${c.txt}"
                    title="${c.nome}" onclick="sepSetCor(${i},${j},'${c.key}')">${c.key}</button>`).join('')}</div>
          <button class="lixo" onclick="sepRemoverItem(${i},${j})" title="Remover item">✕</button>
        </div>
        <div class="it-l2">
          <select class="sel-fmt" onchange="sepSetItem(${i},${j},'formato',this.value)">
            ${SEP_FORMATOS.map(f => `<option ${it.formato === f ? 'selected' : ''}>${f}</option>`).join('')}
          </select>
          <input class="qtd" type="number" inputmode="decimal" min="0" placeholder="0"
                 value="${it.qtd === '' ? '' : it.qtd}" oninput="sepSetItem(${i},${j},'qtd',this.value)">
          <span style="font-size:12.5px;color:var(--muted);flex:0 0 42px">${SEP_UNIDADE}</span>
        </div>
      </div>`).join('');
    return `<div class="ped">
      <div class="ped-top">
        <div class="ped-ordem" title="Ordem de carregamento">${p.ordem}</div>
        <input class="ped-cli" placeholder="Cliente" value="${esc(p.cliente)}"
               oninput="sepSet(${i},'cliente',this.value)">
        <button class="btn-ic" onclick="sepMover(${i},-1)" title="Carregar antes">↑</button>
        <button class="btn-ic" onclick="sepMover(${i},1)" title="Carregar depois">↓</button>
        <button class="lixo" onclick="sepRemoverPedido(${i})" title="Remover pedido">✕</button>
      </div>
      ${itens}
      <div class="acoes" style="margin-top:8px">
        <button class="btn" onclick="sepNovoItem(${i})">+ item</button>
      </div>
    </div>`;
  }).join('');

  $('sep-corpo').innerHTML = `
    ${sepPassos(1)}
    ${sepCabecalhoGuia()}
    <div class="unid">A guia está em:
      <button class="chip ${SEP_UNIDADE === 'kg' ? 'on' : ''}" onclick="sepUnidade('kg')">kg</button>
      <button class="chip ${SEP_UNIDADE === 'fardos' ? 'on' : ''}" onclick="sepUnidade('fardos')">fardos</button>
      <span style="margin-left:auto">1 fardo = ${KG_FARDO} kg</span>
    </div>
    ${cards}
    <div class="acoes">
      <button class="btn" onclick="sepNovoPedido()">+ PEDIDO</button>
      <button class="btn ok" style="flex:1" onclick="sepConferirEPlanejar()">
        ✓ CONFERIDO — DEFINIR A ORDEM</button>
    </div>
    <div class="dica">Aqui você acerta <b>o que</b> vai na carga. A <b>ordem de
