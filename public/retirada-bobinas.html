<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script src="/acesso-colaborador.js"></script>
<script src="/eko-dialogo.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Bobina na Sacoleira</title>
<style>
  /* Tela revista em 28/09/2026 (VPS, pedido do Frederico): sem turno, sem
     câmera (lê o gatilho do coletor), um botão de digitar, as sacoleiras
     no topo e o histórico enxuto. */
  :root{
    --bg:#0a1119; --panel:#131f30; --panel-hi:#1d2c42; --border:#2a3a52;
    --txt:#eef4fb; --muted:#c3d0e2; --verde:#00ff9d; --ambar:#ffc250; --vermelho:#ff6b6b; --azul:#5aa9ff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;} html{height:100%;}
  body{background:var(--bg); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding-bottom:24px; font-size:16px; line-height:1.4; min-height:100dvh;}
  header{padding:calc(12px + env(safe-area-inset-top)) 16px 12px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:20; display:flex; align-items:center; gap:12px;}
  header h1{margin:0; font-size:19px; font-weight:800; flex:1; line-height:1.2;}
  header h1 small{display:block; font-size:12px; color:var(--muted); font-weight:600; margin-top:2px;}
  .btn-sair{background:var(--panel-hi); border:1px solid var(--border); color:var(--muted); border-radius:12px; min-width:44px; height:44px; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:800; text-decoration:none;}
  .wrap{padding:14px 16px; max-width:560px; margin:0 auto;}
  .oculto{display:none !important;}

  .btn{border:none; border-radius:14px; font-family:inherit; font-weight:800; cursor:pointer; min-height:52px; font-size:17px; padding:12px 16px; transition:transform .05s;}
  .btn:active{transform:scale(0.98);}
  .btn:disabled{opacity:.5;}
  .btn-verde{background:var(--verde); color:#052916;}
  .btn-cinza{background:var(--panel-hi); color:var(--txt); border:1.5px solid var(--border);}
  .btn-link{background:none; border:none; color:var(--muted); font-family:inherit; font-size:15px; font-weight:700; padding:12px; min-height:44px; cursor:pointer; width:100%;}

  .sec-tit{display:flex; justify-content:space-between; align-items:baseline; font-size:12px; font-weight:800; letter-spacing:1px; color:var(--muted); text-transform:uppercase; margin:22px 0 10px;}
  .sec-tit:first-child{margin-top:4px;}
  .sec-tit .sub{letter-spacing:0; text-transform:none; font-weight:700;}

  /* Sacoleiras */
  .sacs{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .sac{background:var(--panel); border:1.5px solid var(--border); border-radius:14px; padding:12px; min-width:0; display:flex; flex-direction:column;}
  .sac .s-top{display:flex; align-items:center; gap:6px; font-size:12px; font-weight:800; letter-spacing:.8px; color:var(--muted);}
  .sac .dot{width:8px; height:8px; border-radius:50%; background:var(--border); flex:0 0 auto;}
  .sac.ativa{border-color:rgba(0,255,157,.45);}
  .sac.ativa .dot{background:var(--verde);}
  .sac .s-mat{font-size:16px; font-weight:800; margin-top:8px; line-height:1.25; overflow-wrap:anywhere;}
  .sac .s-info{font-size:12px; color:var(--muted); margin-top:4px; font-family:ui-monospace,monospace; overflow-wrap:anywhere;}
  .sac .s-vazia{font-size:15px; color:var(--muted); margin-top:8px; font-weight:700; flex:1;}
  .sac .s-fim{margin-top:10px; min-height:40px; font-size:14px; padding:8px; border-radius:10px; width:100%;}

  /* Digitar */
  .digitar{width:100%; margin-top:16px;}

  /* Bobina lida */
  .lida{background:var(--panel-hi); border:2px solid var(--verde); border-radius:16px; padding:16px; margin-top:14px;}
  .lida.erro{border-color:var(--vermelho);}
  .lida .l-id{font-family:ui-monospace,monospace; font-size:14px; color:var(--muted); font-weight:700;}
  .lida .l-mat{font-size:22px; font-weight:900; margin:4px 0 2px; line-height:1.2;}
  .lida.erro .l-mat{color:var(--vermelho); font-size:18px;}
  .lida .l-kg{font-size:26px; font-weight:900; color:var(--verde);}
  .lida .l-orig{font-size:13px; color:var(--muted); margin-top:4px;}
  .lida .l-per{font-size:12px; font-weight:800; letter-spacing:1px; color:var(--muted); margin-top:16px;}
  .destinos{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px;}
  .destinos .btn{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:72px; line-height:1.15;}
  .destinos .btn b{font-size:22px;}
  .destinos .btn span{font-size:12px; font-weight:700; opacity:.8; margin-top:3px;}

  /* Turno — só aparece com o Bling ligado */
  .turnos{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:6px;}
  .turnos .lb{font-size:12px; font-weight:800; letter-spacing:1px; color:var(--muted); margin-right:4px;}
  .chip{background:var(--panel); border:1.5px solid var(--border); color:var(--txt); border-radius:999px; padding:10px 14px; font-weight:800; font-family:inherit; font-size:14px; min-height:44px; cursor:pointer;}
  .chip.sel{border-color:var(--verde); color:var(--verde);}

  /* Hoje */
  .hist{display:flex; flex-direction:column; gap:6px;}
  .h-item{display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--panel); border:1px solid var(--border); border-radius:12px;}
  .h-item .h-hora{font-family:ui-monospace,monospace; font-size:13px; color:var(--muted); flex:0 0 auto;}
  .h-item .h-sac{font-size:12px; font-weight:900; background:var(--panel-hi); border-radius:8px; padding:3px 7px; flex:0 0 auto;}
  .h-item .h-mat{flex:1; min-width:0; font-size:14px; font-weight:700; line-height:1.25;}
  .h-item .h-mat small{display:block; font-family:ui-monospace,monospace; font-size:12px; color:var(--muted); font-weight:600;}
  .h-item .h-dir{text-align:right; flex:0 0 auto; font-size:13px; font-weight:800; line-height:1.3;}
  .h-item .h-dir small{display:block; font-size:12px; font-weight:700; color:var(--muted);}
  .h-item .h-pct{color:var(--verde);}
  .h-antes{display:inline-block; font-size:11px; font-weight:800; color:var(--ambar); border:1px solid var(--ambar); border-radius:6px; padding:0 5px; margin-left:4px;}
  .ht{display:flex; flex-direction:column; gap:6px; margin-bottom:12px;}
  .ht-cab{display:flex; align-items:center; gap:10px; padding:4px 2px;}
  .ht-tit{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .ht-vazio{font-size:13px; color:var(--muted); padding:2px 4px 6px;}
  .hb{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:10px 12px;}
  .hb.alerta{border-color:var(--vermelho);}
  .hb-l1{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .hb-mat{font-size:15px; font-weight:800; line-height:1.3; min-width:0;}
  .hb-num{text-align:right; flex:0 0 auto; line-height:1.1;}
  .hb-num b{font-size:24px; color:var(--verde);}
  .hb-num .pc, .ht-tot .pc{font-size:13px; font-weight:800; color:var(--muted);}
  .hb-num small{display:block; font-size:12px; font-weight:700; color:var(--muted);}
  .hb-num .na-maq{font-size:14px; font-weight:800;}
  .hb-l2{font-size:13px; color:var(--muted); font-weight:600; margin-top:4px;}
  .hb-bar{height:6px; background:var(--panel-hi); border-radius:3px; margin-top:8px; overflow:hidden;}
  .hb-bar i{display:block; height:100%; background:var(--verde); border-radius:3px;}
  .hb-bar.alerta i{background:var(--vermelho);}
  .hb-l3{font-size:13px; color:var(--muted); font-weight:600; margin-top:4px;}
  .hb-l3 b{color:var(--txt);}
  .hb-l3 b.hb-pct{color:var(--verde);}
  .hb .h-desf{margin-top:8px;}
  .ht-cab .h-sac{font-size:13px; font-weight:900; background:var(--panel-hi); border-radius:8px; padding:3px 8px;}
  .ht-tit{flex:1; font-size:15px; font-weight:800;}
  .ht-tit small{font-size:12px; font-weight:700; color:var(--muted);}
  .ht-tot{text-align:right; font-size:13px; font-weight:800;}
  .ht-tot b{font-size:18px; color:var(--verde);}
  .ht-tot small{display:block; font-size:12px; font-weight:700; color:var(--muted);}
  .h-item .na-maq{color:var(--verde);}
  .h-desf{display:block; margin:6px 0 0 auto; background:none; border:1px solid var(--border); color:var(--muted); border-radius:8px; font-family:inherit; font-size:12px; font-weight:700; padding:6px 10px; min-height:32px; cursor:pointer;}
  .vazio{color:var(--muted); font-size:14px; text-align:center; padding:18px; background:var(--panel); border-radius:12px;}
  .carregando{color:var(--muted); font-size:14px; text-align:center; padding:18px;}

  /* Inventário */
  .inv-tot{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .inv-tot div{background:var(--panel); border:1.5px solid var(--border); border-radius:14px; padding:14px; text-align:center;}
  .inv-tot b{display:block; font-size:30px; font-weight:900; color:var(--verde); line-height:1.1;}
  .inv-tot span{font-size:12px; font-weight:800; letter-spacing:1px; color:var(--muted); text-transform:uppercase;}
  .inv-dica{color:var(--muted); font-size:14px; text-align:center; margin:12px 0 4px;}
  .inv-ult{border-radius:14px; padding:12px 14px; margin-top:10px; border:2px solid var(--verde); background:var(--panel-hi);}
  .inv-ult.alerta{border-color:var(--ambar);} .inv-ult.erro{border-color:var(--vermelho);}
  .inv-ult b{font-family:ui-monospace,monospace;}
  .tag{font-size:11px; font-weight:800; border-radius:6px; padding:2px 6px; white-space:nowrap;}
  .tag.ok{background:rgba(0,255,157,.12); color:var(--verde);} .tag.al{background:rgba(255,194,80,.14); color:var(--ambar);} .tag.er{background:rgba(255,107,107,.14); color:var(--vermelho);}
  .inv-final textarea{width:100%; min-height:160px; margin-top:8px; background:var(--bg); color:var(--txt); border:1.5px solid var(--border); border-radius:10px; font-family:ui-monospace,monospace; font-size:11px; padding:8px;}

  /* Modal de fardos */
  .modal-fundo{position:fixed; inset:0; background:rgba(0,0,0,0.72); z-index:90; display:flex; align-items:center; justify-content:center; padding:16px;}
  .modal{background:var(--panel); border:2px solid var(--ambar); border-radius:18px; padding:18px; width:100%; max-width:420px; max-height:92dvh; overflow:auto;}
  .modal h2{margin:0 0 6px; font-size:19px;}
  .modal .m-sub{color:var(--muted); font-size:14px; line-height:1.45;}
  .modal .m-sub b{color:var(--txt);}
  .modal label{display:block; font-size:12px; color:var(--muted); font-weight:800; letter-spacing:1px; margin-top:16px;}
  .modal input{width:100%; margin-top:6px; padding:12px; font-size:30px; font-weight:900; text-align:center; border-radius:12px; border:2px solid var(--border); background:var(--bg); color:var(--txt); font-family:inherit;}
  .modal input:focus{outline:none; border-color:var(--ambar);}
  .modal .btn{width:100%; margin-top:12px;}

  /* 29/09/2026 (Gustavo): formato cortado, quem bipou, peso dos fardos,
     alerta de peso — e os NÚMEROS com mais evidência. */
  .sac .s-corte{margin-top:8px; font-size:22px; font-weight:900; line-height:1.1; color:var(--verde);}
  .sac .s-corte small{display:block; font-size:12px; font-weight:700; color:var(--muted); margin-top:2px;}
  .sac .s-corte.duvida{color:var(--ambar); font-size:17px;}
  .sac .s-corte.sem{color:var(--muted); font-size:15px;}
  .sac .s-kg{font-size:20px; font-weight:900; margin-top:6px;}
  .sac .s-quem{font-size:13px; font-weight:800; margin-top:2px;}
  .modal .m-kg{font-size:26px; font-weight:900; text-align:center; margin-top:8px;}
  .modal .m-kg small{display:block; font-size:12px; font-weight:700; color:var(--muted);}
  .modal .m-alerta{margin-top:8px; padding:10px 12px; border-radius:12px; background:#3b1414;
    border:1.5px solid var(--vermelho); color:var(--vermelho); font-weight:800; font-size:14px;}
  .modal .m-resumo{margin-top:14px; padding:12px; border-radius:12px; background:var(--panel-hi);
    border:1.5px solid var(--border); font-size:15px; line-height:1.5;}
  .modal .m-resumo b{font-size:18px;}
  .fmts{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
  .fmts .chip{min-width:84px; font-size:17px;}
  .fmts .chip.cand{border-style:dashed; border-color:var(--ambar);}
  .fmts .chip.sel{background:rgba(0,255,157,.12);}
  .m-dica{font-size:12px; color:var(--muted); margin-top:6px;}
  /* 01/10/2026 (Gustavo): o formato vem decidido; o operador só troca no "Outro". */
  .fmt-dec{display:flex; align-items:center; gap:10px; margin-top:8px;}
  .fmt-dec .fd-v{flex:1; font-size:26px; font-weight:900; color:var(--verde); line-height:1.1;}
  .fmt-dec .fd-v small{display:block; font-size:12px; font-weight:700; color:var(--muted); margin-top:2px;}
  .fmt-dec .chip{flex:0 0 auto;}
  /* Resumo do turno que fechou */
  .rs-sac{margin-top:14px; padding:12px; border-radius:12px; background:var(--panel-hi); border:1.5px solid var(--border);}
  .rs-cab{display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-weight:900; font-size:16px;}
  .rs-cab small{font-size:12px; color:var(--muted); font-weight:700;}
  .rs-tot{font-size:22px; font-weight:900; color:var(--verde); margin-top:4px;}
  .rs-tot small{font-size:13px; color:var(--muted); font-weight:700;}
  .rs-it{font-size:13px; color:var(--muted); font-weight:600; margin-top:6px; line-height:1.4;}
  .rs-it b{color:var(--txt);}
  .rs-bob{margin-top:8px; background:var(--panel);}
  .rs-sac .rs-it + .rs-bob{margin-top:10px;}
  .rs-fmt{white-space:nowrap;}
  .rs-pe{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .rs-pe .hb-l3{flex:1; min-width:0;}
  .rs-pe .h-desf{margin:4px 0 0; flex:0 0 auto;}
  .nomes{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; max-height:40dvh; overflow:auto;}
  .modal input.txt{font-size:20px; font-weight:800; text-align:left;}
  .h-item .h-dir b{font-size:17px;}
  .h-item.alerta{border-color:var(--vermelho);}
  .h-item .h-alerta{color:var(--vermelho);}

  /* 30/09/2026 (Gustavo): turno do corte marcado pelo supervisor. */
  .tc{background:var(--panel); border:1.5px solid var(--border); border-radius:14px; padding:12px;}
  .tc.sem{border-color:var(--ambar);}
  .tc-maqs{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .tc-maq{font-size:12px; font-weight:800; letter-spacing:.8px; color:var(--muted);}
  .tc-maq b{display:block; font-size:20px; letter-spacing:0; color:var(--verde); margin-top:2px;}
  .tc-maq b.sem{color:var(--ambar); font-size:16px;}
  .tc-maq small{display:block; font-size:12px; font-weight:700; letter-spacing:0; color:var(--muted);}
  .tc-bts{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;}
  .tc-bts .btn{min-height:44px; font-size:14px; padding:8px;}
  .btn-vermelho{background:var(--vermelho); color:#2a0707;}
  .modal input.senha{font-size:24px; letter-spacing:6px;}

  .toast{position:fixed; left:50%; transform:translateX(-50%); top:76px; padding:14px 20px; border-radius:14px; font-size:16px; font-weight:800; z-index:100; box-shadow:0 8px 28px rgba(0,0,0,0.6); max-width:92vw; text-align:center; display:none;}
  .toast.ok{background:#0d3b2a; color:var(--verde); border:1.5px solid var(--verde);}
  .toast.erro{background:#3b1414; color:var(--vermelho); border:1.5px solid var(--vermelho);}
  .toast.aviso{background:#3b2f0d; color:var(--ambar); border:1.5px solid var(--ambar);}
</style>

<body>
<header>
  <h1>🧵 Bobina na Sacoleira<small id="quem"></small></h1>
  <a class="btn-sair" href="/" title="Voltar ao sistema">✕</a>
</header>
<div class="toast" id="toast"></div>

<div class="wrap" id="tela-sac">
  <!-- Turno: só com o Bling ligado (é o cliente da venda). -->
  <div class="turnos oculto" id="turnos"></div>

  <div class="sec-tit"><span>Sacoleiras agora</span></div>
  <div class="sacs" id="sacs"><div class="carregando">Carregando…</div></div>

  <!-- A leitura é do gatilho do coletor (app Ekoplastic Coletor). O botão
       de digitar fica para etiqueta rasurada. A câmera saiu em 28/09/2026
       (pedido do Frederico: "só o coletor faz a bipagem"). -->
  <button class="btn btn-cinza digitar" onclick="digitarCodigo()">⌨️ Digitar código da etiqueta</button>

  <!-- bobina lida, aguardando a sacoleira -->
  <div id="area-bobina"></div>

  <div class="sec-tit"><span>Neste turno</span><span class="sub" id="hoje-resumo"></span></div>
  <div class="hist" id="lista-hist"><div class="carregando">Carregando…</div></div>

  <!-- Turno do corte: marcado pelo supervisor (senha). O painel de operação
       das sacoleiras na VPS corta os turnos por estes registros. Fica embaixo,
       logo acima do inventário (Gustavo, 30/09/2026): é ação de supervisor,
       não do dia a dia do operador. -->
  <div class="sec-tit"><span>Turno do corte</span></div>
  <div class="tc" id="turno-corte"><div class="carregando">Carregando…</div></div>

  <button class="btn btn-cinza digitar" onclick="abrirInventario()">📋 Inventário de bobinas</button>
</div>

<!-- INVENTÁRIO: bipa toda bobina que está no estoque. Só registra; não muda
     o status de nenhuma etiqueta. -->
<div class="wrap oculto" id="tela-inv">
  <div class="sec-tit"><span>Inventário de bobinas</span><span class="sub" id="inv-desde"></span></div>
  <div class="inv-tot"><div><b id="inv-qtd">0</b><span>bobinas</span></div><div><b id="inv-kg">0</b><span>kg</span></div></div>
  <div class="inv-dica">Bipe cada bobina do estoque com o gatilho.</div>
  <div id="inv-ultima"></div>
  <button class="btn btn-cinza digitar" onclick="digitarCodigo()">⌨️ Digitar código da etiqueta</button>
  <div class="sec-tit"><span>Lidas</span><span class="sub" id="inv-alertas"></span></div>
  <div class="hist" id="inv-lista"></div>
  <div id="inv-final"></div>
  <button class="btn btn-verde digitar" id="inv-concluir" onclick="concluirInventario()">✓ Concluir inventário</button>
  <button class="btn-link" onclick="voltarSacoleiras()">← Voltar às sacoleiras (o inventário continua aberto)</button>
</div>

<script>
const URL_BASE='';
const ultimoBipe={};
let bobinaAtual=null;      // bobina lida, aguardando a sacoleira
let BLING=false;           // a baixa cria pedido no Bling? (config baixa_bobina_bling)
let TURNOS=[], TURNO=null; // só usados com o Bling ligado
let ABERTAS=[];            // [{sacoleira, bobina|null}] — o que está montado agora
let MODO='sac';            // 'sac' (entrada na sacoleira) | 'inv' (inventário)
let enviando=false;

function toast(tipo,msg,ms){
  const t=document.getElementById('toast');
  t.className='toast '+tipo; t.innerHTML=msg; t.style.display='block';
  clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none', ms||2400);
}
function beep(freq,dur){
  try{
    const ac=beep._ac=beep._ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.frequency.value=freq;o.connect(g);g.connect(ac.destination);
    g.gain.setValueAtTime(0.15,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+(dur||0.12));
    o.start();o.stop(ac.currentTime+(dur||0.12));
  }catch(e){}
}
function vibrar(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }
function fmtKg(n){ return (Math.round(n*10)/10).toLocaleString('pt-BR')+' kg'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function descBob(b){ return esc(b.cor)+' · '+esc(b.largura)+(b.tipo_bobina?(' · '+esc(b.tipo_bobina)):''); }
// Curta (cor · largura) para os cartões das sacoleiras e o histórico: com o
// tipo junto o texto quebra em duas linhas no celular.
function descCurta(b){ return esc(b.cor)+' · '+esc(b.largura); }
function hora(iso){ try{ return new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
function diaHora(iso){ try{ return new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
// "há 2h 15min" desde a montagem — é o que o operador olha para saber se a
// bobina está perto do fim.
function haQuanto(iso){
  const min=Math.max(0, Math.round((Date.now()-new Date(iso).getTime())/60000));
  if(min<60) return 'há '+min+' min';
  const h=Math.floor(min/60), m=min%60;
  if(h<48) return 'há '+h+'h'+(m?(' '+String(m).padStart(2,'0')+'min'):'');
  return 'desde '+diaHora(iso);
}

// Etiqueta rasurada: digitar o número. Passa pelas mesmas validações do
// leitor do coletor (onLeu).
async function digitarCodigo(){
  const cod = await ekoPerguntar({ titulo:'Digitar código', texto:'Número da etiqueta da bobina (ex.: 1669 ou E0001669)',
    placeholder:'1669', ok:'Ler' });
  if(!cod) return;
  let id = cod.trim().toUpperCase().replace(/\s+/g,'');
  if(!id) return;
  // Só os números: completa como a etiqueta impressa (E + 7 dígitos).
  if(/^\d{1,7}$/.test(id)) id = 'E' + id.padStart(7,'0');
  delete ultimoBipe[id];   // digitação manual não sofre o anti-repetição da câmera
  await onLeu(id);
}


// ── LEITURA: consulta a bobina e mostra para o operador escolher a sacoleira.
async function onLeu(codigo){
  const id=(codigo||'').trim().toUpperCase();
  const agora=Date.now();
  if(ultimoBipe[id] && agora-ultimoBipe[id]<2500) return;
  ultimoBipe[id]=agora;
  if(enviando) return;
  if(MODO==='inv'){ await lerInventario(id); return; }
  if(MODO==='inv-fim'){ beep(320,0.2); toast('aviso','Inventário concluído. Toque em "Voltar às sacoleiras" para bipar entradas.',4000); return; }
  try{
    const r=await fetch(URL_BASE+'/bobinas/'+encodeURIComponent(id));
    const d=await r.json();
    if(!r.ok || !d.ok){ beep(320,0.2); vibrar(150); mostrarErro(id,(d&&d.erro)||'Etiqueta não encontrada'); return; }
    const b=d.bobina;
    if(b.status==='consumida'){
      beep(320,0.2); vibrar([80,60,80]);
      mostrarErro(id,'Já foi para a sacoleira'+(b.destino?(' '+esc(b.destino)):'')+(b.baixa_em?(' em '+diaHora(b.baixa_em)):''));
      return;
    }
    if(b.status==='cancelada'){ beep(320,0.2); vibrar(150); mostrarErro(id,'Etiqueta cancelada'); return; }
    if(d.bling && !b.produto_id){ beep(320,0.2); vibrar(150); mostrarErro(id,'Sem produto no Bling para '+esc(b.chave)); return; }
    // Sem turno do corte aberto não monta bobina (01/10/2026, Gustavo).
    await carregarTurnoCorte();
    const comTurno=TC.sacoleiras.filter(s=>s.turno).map(s=>s.sacoleira);
    if(!comTurno.length){ beep(320,0.2); vibrar(150); mostrarErro(id,'Sem turno aberto. O supervisor inicia o turno antes de bipar.'); return; }

    beep(880,0.1); vibrar(60);
    bobinaAtual=b;
    await carregarSacoleiras();
    const botao=p=>{
      const m=(ABERTAS.find(a=>a.sacoleira===p)||{}).bobina;
      const sub=!comTurno.includes(p)?'sem turno':m?('troca '+esc(m.id)):'livre';
      return '<button class="btn btn-verde btn-destino" data-destino="'+p+'" onclick="confirmarBaixa(\''+p+'\')"'+
        (comTurno.includes(p)?'':' disabled data-semturno="1"')+'><b>'+p+'</b><span>'+sub+'</span></button>';
    };
    const orig=['Extrusora '+esc(b.maquina||'—'), esc(b.operador||''), b.hora_impressao?diaHora(b.hora_impressao):''].filter(Boolean).join(' · ');
    document.getElementById('area-bobina').innerHTML=
      '<div class="lida">'+
        '<div class="l-id">'+esc(b.id)+'</div>'+
        '<div class="l-mat">'+descBob(b)+'</div>'+
        '<div class="l-kg">'+fmtKg(b.peso)+'</div>'+
        '<div class="l-orig">'+orig+'</div>'+
        '<div class="l-per">MONTAR NA SACOLEIRA</div>'+
        '<div class="destinos">'+botao('P1')+botao('P2')+'</div>'+
        '<button class="btn-link" onclick="cancelarLeitura()">Cancelar</button>'+
      '</div>';
    document.getElementById('area-bobina').scrollIntoView({behavior:'smooth', block:'center'});
  }catch(e){ toast('erro','Erro ao consultar: '+esc(e.message),3000); }
}

function mostrarErro(id,msg){
  bobinaAtual=null;
  document.getElementById('area-bobina').innerHTML=
    '<div class="lida erro"><div class="l-id">'+esc(id)+'</div><div class="l-mat">⛔ '+msg+'</div>'+
    '<button class="btn-link" onclick="cancelarLeitura()">Fechar</button></div>';
}
function cancelarLeitura(){ bobinaAtual=null; document.getElementById('area-bobina').innerHTML=''; }
function travarDestinos(p){
  document.querySelectorAll('.btn-destino').forEach(b=>{ b.disabled=true; if(b.dataset.destino===p) b.querySelector('span').textContent=BLING?'enviando ao Bling…':'registrando…'; });
}
function soltarDestinos(){ document.querySelectorAll('.btn-destino').forEach(b=>{ b.disabled=!!b.dataset.semturno; }); }

// ── BAIXA: a bobina entra na sacoleira. Se já havia uma, ela sai agora e a
// tela pergunta quantos fardos ela deu.
async function confirmarBaixa(sac){
  if(!bobinaAtual || enviando) return;
  if(BLING && !TURNO){ toast('erro','Escolha o turno primeiro',3000); return; }
  // Quem está bipando é quem vai cortar esta bobina (29/09/2026).
  const nome=await perguntarNome(sac);
  if(!nome) return;
  let fardosAnterior=null, saida=null;
  const montada=(ABERTAS.find(a=>a.sacoleira===sac)||{}).bobina;
  if(montada && montada.id!==bobinaAtual.id){
    saida=await perguntarFardos(montada, sac, 'troca');
    if(saida===null) return;                    // cancelou: nada é gravado
    fardosAnterior=saida.fardos;
  }
  enviando=true; travarDestinos(sac);
  try{
    let d, r;
    for(let tentativa=0; tentativa<2; tentativa++){
      r=await fetch(URL_BASE+'/bobinas/baixa',{
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ id:bobinaAtual.id, destino:sac, turno:(BLING&&TURNO)?TURNO.codigo:null,
                              fardos_anterior:fardosAnterior, soltos_anterior:saida?saida.soltos:null,
                              formato_anterior:saida?saida.formato:null,
                              formato_anterior_origem:saida?saida.origem:null,
                              operador:nome })
      });
      d=await r.json();
      // Outro celular montou bobina nesta sacoleira no meio do caminho: o
      // servidor pede os fardos dela. Pergunta e tenta de novo, uma vez.
      if(r.status===409 && d && d.precisa_fardos && tentativa===0){
        await carregarSacoleiras();
        const nova=(ABERTAS.find(a=>a.sacoleira===sac)||{}).bobina;
        saida=await perguntarFardos((nova && nova.id===d.anterior.id)?nova:d.anterior, sac, 'troca');
        if(saida===null){ soltarDestinos(); enviando=false; return; }
        fardosAnterior=saida.fardos;
        continue;
      }
      break;
    }
    if(!r.ok || !d.ok){ beep(320,0.25); vibrar(200); toast('erro',esc((d&&d.erro)||'Falha ao registrar'),6000); soltarDestinos(); enviando=false; return; }
    beep(1050,0.14); vibrar([60,50,60]);
    const ped = d.modo==='sem_bling' ? '' : ('<br>pedido '+esc(d.pedido)+(d.modo==='simulacao'?' (simulação)':''));
    toast('ok','✓ '+esc(bobinaAtual.id)+' na '+sac+' · '+esc(nome)+ped,3000);
    cancelarLeitura();
    await atualizarTudo();
  }catch(e){ toast('erro','Erro: '+esc(e.message),5000); soltarDestinos(); }
  enviando=false;
}

// Pergunta quantos fardos a bobina deu e CONFIRMA o formato que ela virou
// (29/09/2026): o formato vem pré-selecionado pelo sistema (comprimento da
// sacoleira, travado pelos formatos da máquina), com a cor da bobina, e o
// operador só confirma ou troca. Mostra o peso dos fardos (× 25 kg) e avisa
// quando passa do peso da bobina. Resolve {fardos, formato, origem} ou null.
const KG_FARDO=25, PC_FARDO=5, KG_PC=KG_FARDO/PC_FARDO;
// Pacotes → "17 fardos +2 pc" (fardo = 5 pacotes de 5 kg).
function txtPc(p){ const f=Math.floor(p/PC_FARDO), s=p%PC_FARDO; return f+' fardo'+(f===1?'':'s')+(s?(' +'+s+' pc'):''); }
function perguntarFardos(bob, sac, modo){
  return new Promise(resolve=>{
    const ent=ABERTAS.find(a=>a.sacoleira===sac)||{};
    const permitidos=ent.permitidos||[];
    const fmt=bob.formato||{};
    const cands=fmt.candidatos||[];
    let escolhido=fmt.sugerido||null;
    const corNome=(bob.cor_pa&&bob.cor_pa.nome)||bob.cor||'';
    const fundo=document.createElement('div');
    fundo.className='modal-fundo';
    // modo 'turno' (30/09/2026): fim do turno com a bobina montada. Ela NÃO
    // sai: o número é só o que ela deu neste turno. Na troca e no Finalizar,
    // se já houve fim de turno com ela montada, também se pede só a parte
    // deste turno — o total da bobina é a soma, feita pelo servidor.
    const turno = modo==='turno';
    // Em pacotes (30/09/2026): o que já foi informado em fim de turno e os
    // soltos que havia no fardo aberto quando esta parte começou.
    const antes = Number(bob.pacotes_parciais)||0;
    const ini = Number(bob.soltos_inicio)||0;
    let soltos = 0;
    const tit = turno ? ('Fim do turno · Sacoleira '+sac) : modo==='troca' ? ('Troca na Sacoleira '+sac) : ('Encerrar bobina · Sacoleira '+sac);
    const acao = turno ? 'Registrar fardos do turno' : modo==='troca' ? 'Confirmar troca' : 'Finalizar bobina';
    const chips=permitidos.map(f=>'<button class="chip'+(cands.includes(f)&&cands.length<permitidos.length?' cand':'')+
      (f===escolhido?' sel':'')+'" data-f="'+esc(f)+'">'+esc(f.replace('x',' × '))+'</button>').join('');
    fundo.innerHTML='<div class="modal">'+
      '<h2>'+tit+'</h2>'+
      '<div class="m-sub">'+(turno?'Continua na máquina a <b>':'Sai a <b>')+esc(bob.id)+'</b> · '+descBob(bob)+' · <b>'+fmtKg(bob.peso)+'</b>'+
        (bob.baixa_em?('<br>montada '+haQuanto(bob.baixa_em)):'')+
        (bob.baixa_operador?(' · bipada por <b>'+esc(bob.baixa_operador)+'</b>'):'')+'</div>'+
      '<label>FORMATO CORTADO · '+esc(corNome.toUpperCase())+'</label>'+
      // 01/10/2026 (Gustavo): o sistema decide (máquina + bobina + comprimento
      // da sacoleira); "Outro" abre só os formatos que ESTA sacoleira corta.
      (fmt.sugerido?('<div class="fmt-dec" id="md-fmt-dec"><div class="fd-v" id="md-fmt-v"></div>'+
        '<button class="chip" id="md-outro">Outro</button></div>'):'')+
      '<div class="fmts'+(fmt.sugerido?' oculto':'')+'" id="md-fmts">'+chips+'</div>'+
      (fmt.sugerido?'':('<div class="m-dica">'+esc(fmt.motivo||'sem formato decidido')+' — toque no formato se souber; dá para registrar sem.</div>'))+
      '<label>'+((turno||antes>0)?'FARDOS FECHADOS NESTE TURNO':'FARDOS FECHADOS')+'</label><input id="md-fardos" type="number" inputmode="numeric" min="0" max="999" step="1" autocomplete="off">'+
      (ini>0?('<div class="m-dica">Havia '+ini+' pacote'+(ini===1?'':'s')+' solto'+(ini===1?'':'s')+' no início — conte o fardo que ela completou.</div>'):'')+
      '<label>PACOTES SOLTOS AGORA</label><div class="fmts soltos">'+[0,1,2,3,4].map(n=>
        '<button class="chip'+(n===0?' sel':'')+'" data-s="'+n+'">'+n+'</button>').join('')+'</div>'+
      '<div class="m-kg" id="md-kg"></div>'+
      '<div id="md-alerta"></div>'+
      '<div class="m-resumo" id="md-resumo"></div>'+
      '<button class="btn btn-verde" id="md-ok">'+acao+'</button>'+
      '<button class="btn-link" id="md-cancelar">Cancelar</button></div>';
    document.body.appendChild(fundo);
    const inp=fundo.querySelector('#md-fardos');
    const pintar=()=>{
      const fv=fundo.querySelector('#md-fmt-v');
      if(fv) fv.innerHTML=(escolhido?esc(escolhido.replace('x',' × ')):'?')+
        '<small>'+(escolhido===fmt.sugerido?esc(fmt.motivo||'pelo sistema'):'escolhido no Outro')+'</small>';
      const n=Number(inp.value), temN=inp.value!=='' && Number.isInteger(n) && n>=0;
      // Produção desta parte em pacotes: fechados × 5 + soltos agora − soltos no início.
      const pc=temN?(n*PC_FARDO+soltos-ini):null;
      const kg=temN?pc*KG_PC:null;
      const kgTotal=temN?(antes+pc)*KG_PC:null;
      fundo.querySelector('#md-kg').innerHTML=!temN?'':(pc<0?'<small>não fecha com os soltos do início — confira</small>':
        (fmtKg(kg)+'<small>'+txtPc(pc)+(antes>0?(' · bobina: '+txtPc(antes+pc)):'')+'</small>'));
      const passa=temN && Number(bob.peso)>0 && kgTotal>Number(bob.peso);
      fundo.querySelector('#md-alerta').innerHTML=passa?('<div class="m-alerta">⚠ '+fmtKg(kgTotal)+' de fardos para uma bobina de '+
        fmtKg(bob.peso)+' — rendeu mais do que pesa. Confira os fardos antes de confirmar.</div>'):'';
      fundo.querySelector('#md-resumo').innerHTML='Cortou <b>'+(escolhido?esc(escolhido.replace('x',' × ')):'?')+'</b> · '+esc(corNome)+
        (temN&&pc>=0?(' · <b>'+txtPc(pc)+'</b>'):'')+
        '<br>por <b>'+esc(bob.baixa_operador||'—')+'</b>';
    };
    fundo.querySelectorAll('#md-fmts .chip').forEach(c=>c.onclick=()=>{
      escolhido=c.dataset.f;
      fundo.querySelectorAll('#md-fmts .chip').forEach(x=>x.classList.toggle('sel',x===c));
      pintar();
    });
    const outro=fundo.querySelector('#md-outro');
    if(outro) outro.onclick=()=>{ const g=fundo.querySelector('#md-fmts'); g.classList.toggle('oculto'); outro.classList.toggle('sel',!g.classList.contains('oculto')); };
    fundo.querySelectorAll('.soltos .chip').forEach(c=>c.onclick=()=>{
      soltos=Number(c.dataset.s);
      fundo.querySelectorAll('.soltos .chip').forEach(x=>x.classList.toggle('sel',x===c));
      pintar();
    });
    inp.addEventListener('input',pintar);
    pintar();
    setTimeout(()=>inp.focus(),50);
    const fim=v=>{ fundo.remove(); resolve(v); };
    fundo.querySelector('#md-cancelar').onclick=()=>fim(null);
    fundo.querySelector('#md-ok').onclick=()=>{
      const n=Number(inp.value);
      if(inp.value==='' || !Number.isInteger(n) || n<0 || n>999){ toast('erro','Digite o número de fardos (0 a 999)',3000); inp.focus(); return; }
      if(n*PC_FARDO+soltos-ini<0){ toast('erro','Havia '+ini+' pacote(s) solto(s) no início — confira fardos e soltos',4000); return; }
      // Formato NÃO trava o registro (01/10/2026, Gustavo: o encerrar turno
      // "prendia" quando o sistema não sabia o formato). Sem formato, a parte
      // vai sem ele — o fim de turno não pode depender disso.
      fim({ fardos:n, soltos, formato:escolhido, origem:(escolhido && escolhido===fmt.sugerido)?'sugerido':'escolhido' });
    };
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') fundo.querySelector('#md-ok').click(); });
  });
}

// Quem está bipando (29/09/2026). Lista os nomes que a pesagem já conhece,
// deixa digitar um novo e lembra o último neste aparelho. Resolve o nome ou null.
let NOMES=null;
async function perguntarNome(sac){
  if(NOMES===null){
    try{ const d=await (await fetch(URL_BASE+'/bobinas/operadores')).json(); NOMES=(d&&d.operadores)||[]; }
    catch(e){ NOMES=[]; }
  }
  let ultimo=''; try{ ultimo=localStorage.getItem('eko_bipador')||''; }catch(e){}
  return new Promise(resolve=>{
    const fundo=document.createElement('div');
    fundo.className='modal-fundo';
    const logado=String(window.EKO_RESPONSAVEL||'').trim().toUpperCase();
    const lista=[...new Set([ultimo, logado].concat(NOMES).filter(Boolean))];
    fundo.innerHTML='<div class="modal">'+
      '<h2>Quem está bipando?</h2>'+
      '<div class="m-sub">A <b>'+esc(bobinaAtual.id)+'</b> vai para a Sacoleira <b>'+esc(sac)+'</b>. '+
        'Quem bipa é quem corta esta bobina.</div>'+
      '<div class="nomes">'+lista.map(n=>'<button class="chip'+(n===ultimo?' sel':'')+'" data-n="'+esc(n)+'">'+esc(n)+'</button>').join('')+'</div>'+
      '<label>OU DIGITE O NOME</label><input id="md-nome" class="txt" type="text" autocomplete="off" autocapitalize="characters" maxlength="40" value="'+esc(ultimo)+'">'+
      '<button class="btn btn-verde" id="md-ok">Continuar</button>'+
      '<button class="btn-link" id="md-cancelar">Cancelar</button></div>';
    document.body.appendChild(fundo);
    const inp=fundo.querySelector('#md-nome');
    fundo.querySelectorAll('.nomes .chip').forEach(c=>c.onclick=()=>{
      inp.value=c.dataset.n;
      fundo.querySelectorAll('.nomes .chip').forEach(x=>x.classList.toggle('sel',x===c));
    });
    const fim=v=>{ fundo.remove(); resolve(v); };
    fundo.querySelector('#md-cancelar').onclick=()=>fim(null);
    fundo.querySelector('#md-ok').onclick=()=>{
      const n=inp.value.trim().toUpperCase();
      if(n.length<2){ toast('erro','Toque no seu nome ou digite',3000); inp.focus(); return; }
      try{ localStorage.setItem('eko_bipador',n); }catch(e){}
      if(!NOMES.includes(n)) NOMES.unshift(n);
      fim(n);
    };
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') fundo.querySelector('#md-ok').click(); });
  });
}

// Finalizar: a bobina saiu SEM outra no lugar (máquina parou, acabou o pedido).
async function finalizar(sac){
  const bob=(ABERTAS.find(a=>a.sacoleira===sac)||{}).bobina;
  if(!bob) return;
  const saida=await perguntarFardos(bob, sac, 'finalizar');
  if(saida===null) return;
  const n=saida.fardos;
  try{
    const r=await fetch(URL_BASE+'/bobinas/finalizar',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ sacoleira:sac, fardos:n, soltos:saida.soltos, formato:saida.formato, formato_origem:saida.origem,
                            operador:(window.EKO_RESPONSAVEL||null) })
    });
    const d=await r.json();
    if(!r.ok || !d.ok){ toast('erro',esc((d&&d.erro)||'Falha ao finalizar'),5000); return; }
    beep(1050,0.14); vibrar([60,50,60]);
    toast('ok','✓ '+esc(bob.id)+' encerrada · bobina '+txtPc(d.pacotes_total||0),3000);
    await atualizarTudo();
  }catch(e){ toast('erro','Erro: '+esc(e.message),5000); }
}

// ── SACOLEIRAS AGORA
async function carregarSacoleiras(){
  const g=document.getElementById('sacs');
  try{
    const r=await fetch(URL_BASE+'/bobinas/abertas');
    const d=await r.json();
    ABERTAS=(d&&d.sacoleiras)||[];
  }catch(e){ g.innerHTML='<div class="vazio" style="grid-column:1/-1">Não consegui ler as sacoleiras.</div>'; return; }
  g.innerHTML=ABERTAS.map(a=>{
    const b=a.bobina;
    if(!b) return '<div class="sac"><div class="s-top"><span class="dot"></span>SACOLEIRA '+a.sacoleira+'</div>'+
                  '<div class="s-vazia">Sem bobina</div></div>';
    // Formato que está sendo cortado agora (sugestão pelo CLP da sacoleira).
    const f=b.formato||{}, cor=(b.cor_pa&&b.cor_pa.nome)||b.cor||'';
    let corte;
    if(f.sugerido) corte='<div class="s-corte">'+esc(f.sugerido.replace('x',' × '))+'<small>cortando · '+esc(cor)+'</small></div>';
    else if((f.candidatos||[]).length && (f.candidatos||[]).length<(a.permitidos||[]).length)
      corte='<div class="s-corte duvida">'+esc(f.candidatos.map(x=>x.replace('x','×')).join(' ou '))+'<small>'+esc(f.motivo||'')+'</small></div>';
    else corte='<div class="s-corte sem">formato ?<small>'+esc(f.motivo||'sem leitura da sacoleira')+'</small></div>';
    return '<div class="sac ativa"><div class="s-top"><span class="dot"></span>SACOLEIRA '+a.sacoleira+'</div>'+
      '<div class="s-mat">'+descCurta(b)+'</div>'+
      corte+
      '<div class="s-kg">'+fmtKg(b.peso)+'</div>'+
      (b.baixa_operador?('<div class="s-quem">'+esc(b.baixa_operador)+'</div>'):'')+
      '<div class="s-info">'+esc(b.id)+' · '+haQuanto(b.baixa_em)+'</div>'+
      '<button class="btn btn-cinza s-fim" onclick="finalizar(\''+a.sacoleira+'\')">Encerrar bobina</button></div>';
  }).join('');
}

// ── HOJE: o que entrou nas sacoleiras hoje, com os fardos de quem já saiu.
// Número grande de fardos com os pacotes soltos pequenos ao lado ("12 +2 pc").
function pcGrande(p, soNumero){
  const f=Math.floor(p/PC_FARDO), s=p%PC_FARDO;
  return '<b>'+f+'</b>'+(soNumero?'':(' fardo'+(f===1?'':'s')))+(s?('<span class="pc"> +'+s+' pc</span>'):'');
}
async function carregarHistorico(){
  // 30/09/2026: a lista é POR TURNO do corte, uma por sacoleira. A bobina que
  // já estava montada quando o turno começou é do turno que entrou. Fardos à
  // direita = os deste turno; embaixo, o total da bobina e o rendimento
  // (fardos × 25 kg ÷ peso), final só quando ela sai.
  const el=document.getElementById('lista-hist');
  let d;
  try{ d=await (await fetch(URL_BASE+'/bobinas/do-turno')).json(); }
  catch(e){ el.innerHTML='<div class="vazio">Não consegui ler a lista do turno.</div>'; return; }
  const sacs=(d&&d.sacoleiras)||[];
  document.getElementById('hoje-resumo').textContent='';
  const hojeStr=new Date().toDateString();
  const quando=iso=>{ try{ return new Date(iso).toDateString()===hojeStr?hora(iso):diaHora(iso); }catch(e){ return ''; } };
  el.innerHTML=sacs.map(s=>{
    const t=s.turno;
    // Cabeçalho numa linha: sacoleira · turno · desde — e o total à direita.
    const cab='<div class="ht-cab"><span class="h-sac">'+s.sacoleira+'</span>'+
      '<span class="ht-tit">'+(t?esc(t.label):'Hoje')+
        '<small>'+(t?((t.fim?'encerrado · ':'')+'desde '+quando(t.inicio)+(t.fim?(' até '+quando(t.fim)):'')):'sem turno marcado')+'</small></span>'+
      '<span class="ht-tot">'+pcGrande(s.pacotes_turno||0)+'<small>'+fmtKg(s.kg_turno||0)+'</small></span></div>';
    if(!s.bobinas.length) return '<div class="ht">'+cab+'<div class="ht-vazio">nenhuma bobina neste turno</div></div>';
    const itens=s.bobinas.map((x,k)=>{
      // Só a última entrada da sacoleira pode ser desfeita, e só sem fardos.
      const ultima=k===0 && !x.pedido && !(x.pacotes_total>0);
      const pct=x.rendimento_pct, alerta=pct!=null && pct>100;
      const fmt=x.formato_cortado?(' · <b>'+esc(x.formato_cortado.replace('x',' × '))+'</b>'):'';
      // Linha 1: o que é a bobina | fardos deste turno (o número que importa).
      let num;
      if(x.pacotes_turno!=null) num=pcGrande(x.pacotes_turno,true)+'<small>neste turno</small>';
      else if(x.montada) num='<span class="na-maq">na máquina</span>';
      else num='<b>—</b><small>sem fardos</small>';
      // Linha 3: de onde vem o total da bobina, e o rendimento com barra.
      let rend='';
      if(x.pacotes_total!=null){
        const antes=(x.pacotes_turno!=null)?x.pacotes_total-x.pacotes_turno:0;
        const conta=(antes>0 && x.pacotes_turno!=null)?(txtPc(antes)+' antes + '):'';
        rend='<div class="hb-bar'+(alerta?' alerta':'')+'"><i style="width:'+Math.min(100,pct||0)+'%"></i></div>'+
          '<div class="hb-l3">'+(x.montada?'Até agora: ':'Bobina: ')+conta+'<b>'+txtPc(x.pacotes_total)+'</b>'+
          (pct!=null?(' · <b class="'+(alerta?'h-alerta':'hb-pct')+'">'+pct+'%</b>'+(alerta?' ⚠ passa do peso':'')):'')+'</div>';
      }
      return '<div class="hb'+(alerta?' alerta':'')+'">'+
        '<div class="hb-l1"><span class="hb-mat">'+descCurta(x)+fmt+'</span><span class="hb-num">'+num+'</span></div>'+
        '<div class="hb-l2">'+esc(x.id)+' · '+fmtKg(x.peso)+(x.operador?(' · '+esc(x.operador)):'')+
          ' · entrou '+quando(x.baixa_em)+(x.veio_de_antes?' <span class="h-antes">turno anterior</span>':'')+
          (x.pedido?(' · pedido '+esc(x.pedido)):'')+'</div>'+
        rend+
        (ultima?('<button class="h-desf" onclick="desfazer(\''+esc(x.id)+'\',\''+s.sacoleira+'\')">desfazer</button>'):'')+
      '</div>';
    }).join('');
    return '<div class="ht">'+cab+itens+'</div>';
  }).join('');
}

// Leitura errada: a bobina registrada não é a que foi para a máquina. Volta
// para o estoque; depois é só bipar a certa. Só a última de cada sacoleira.
async function desfazer(id, sac){
  if(!(await ekoConfirmar({ titulo:'Desfazer a entrada de '+id+' na '+sac+'?', perigo:true,
      texto:'Use quando a leitura saiu errada: a bobina volta para o estoque. Depois bipe a bobina certa.',
      ok:'Desfazer', cancelar:'Manter' }))) return;
  try{
    const r=await fetch(URL_BASE+'/bobinas/desfazer',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ id, operador:(window.EKO_RESPONSAVEL||null) })
    });
    const d=await r.json();
    if(!r.ok || !d.ok){ toast('erro',esc((d&&d.erro)||'Falha ao desfazer'),6000); return; }
    beep(700,0.12); vibrar(80);
    toast('ok','↩ '+esc(id)+' voltou para o estoque',3000);
    await atualizarTudo();
  }catch(e){ toast('erro','Erro: '+esc(e.message),5000); }
}

// ── INVENTÁRIO ───────────────────────────────────────────────────────────
const SIT={ estoque:['ok','em estoque'], na_sacoleira:['al','sistema: na sacoleira'],
            usada:['al','sistema: já usada'], cancelada:['er','etiqueta cancelada'] };
function tagSit(s,dest){ const t=SIT[s]||['al',s]; return '<span class="tag '+t[0]+'">'+t[1]+(s==='na_sacoleira'&&dest?(' '+esc(dest)):'')+'</span>'; }
function mostrarTela(m){
  MODO=m;
  document.getElementById('tela-sac').classList.toggle('oculto', m!=='sac');
  document.getElementById('tela-inv').classList.toggle('oculto', m!=='inv');
  window.scrollTo(0,0);
}
function pintarInventario(d){
  const itens=d.itens||[];
  document.getElementById('inv-qtd').textContent=itens.length;
  document.getElementById('inv-kg').textContent=(d.kg||0).toLocaleString('pt-BR');
  document.getElementById('inv-desde').textContent=d.inventario?('aberto '+diaHora(d.inventario.inicio)):'';
  const al=itens.filter(x=>x.situacao!=='estoque').length;
  document.getElementById('inv-alertas').textContent=al?('⚠ '+al+' com divergência'):'';
  document.getElementById('inv-lista').innerHTML = itens.length ? itens.map(x=>
    '<div class="h-item"><span class="h-hora">'+hora(x.lido_em)+'</span>'+
    '<div class="h-mat">'+descCurta(x)+'<small>'+esc(x.id)+' · '+fmtKg(x.peso||0)+'</small></div>'+
    '<div class="h-dir">'+tagSit(x.situacao,x.destino)+
    (d.aberto!==false?('<button class="h-desf" onclick="removerInventario(\''+esc(x.id)+'\')">remover</button>'):'')+'</div></div>').join('')
    : '<div class="vazio">Nenhuma bobina lida ainda.</div>';
}
async function retomarInventario(){
  try{
    const r=await fetch(URL_BASE+'/bobinas/inventario'); const d=await r.json();
    if(d && d.aberto){ mostrarTela('inv'); pintarInventario(d); toast('aviso','Inventário em andamento — continue bipando',3000); }
  }catch(e){}
}
async function abrirInventario(){
  try{
    const r=await fetch(URL_BASE+'/bobinas/inventario/abrir',{ method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ operador:(window.EKO_RESPONSAVEL||null) }) });
    const d=await r.json();
    if(!r.ok||!d.ok){ toast('erro',esc((d&&d.erro)||'Falha ao abrir'),5000); return; }
    cancelarLeitura(); document.getElementById('inv-final').innerHTML=''; document.getElementById('inv-ultima').innerHTML='';
    document.getElementById('inv-concluir').classList.remove('oculto');
    mostrarTela('inv'); pintarInventario(d);
  }catch(e){ toast('erro','Erro: '+esc(e.message),5000); }
}
async function lerInventario(id){
  const u=document.getElementById('inv-ultima');
  try{
    const r=await fetch(URL_BASE+'/bobinas/inventario/ler',{ method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ id, operador:(window.EKO_RESPONSAVEL||null) }) });
    const d=await r.json();
    if(!r.ok||!d.ok){ beep(320,0.25); vibrar(200); u.innerHTML='<div class="inv-ult erro"><b>'+esc(id)+'</b> — '+esc((d&&d.erro)||'não registrada')+'</div>'; return; }
    if(d.repetida){ beep(500,0.15); vibrar([60,60,60]); u.innerHTML='<div class="inv-ult alerta"><b>'+esc(id)+'</b> já tinha sido lida neste inventário</div>'; return; }
    const alerta=d.situacao!=='estoque';
    if(alerta){ beep(600,0.2); vibrar([80,60,80]); } else { beep(1050,0.1); vibrar(50); }
    u.innerHTML='<div class="inv-ult'+(alerta?' alerta':'')+'"><b>'+esc(id)+'</b> · '+descCurta(d.bobina)+' · '+fmtKg(d.bobina.peso||0)+'<br>'+tagSit(d.situacao,d.bobina.destino)+'</div>';
    const g=await (await fetch(URL_BASE+'/bobinas/inventario')).json();
    if(g && g.aberto) pintarInventario(g);
  }catch(e){ toast('erro','Erro: '+esc(e.message),5000); }
}
async function removerInventario(id){
  if(!(await ekoConfirmar({ titulo:'Tirar '+id+' do inventário?', ok:'Tirar', cancelar:'Manter' }))) return;
  try{
    await fetch(URL_BASE+'/bobinas/inventario/remover',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ id }) });
    const g=await (await fetch(URL_BASE+'/bobinas/inventario')).json();
    if(g && g.aberto) pintarInventario(g);
  }catch(e){ toast('erro','Erro: '+esc(e.message),5000); }
}
async function concluirInventario(){
  const n=document.getElementById('inv-qtd').textContent;
  if(!(await ekoConfirmar({ titulo:'Concluir o inventário com '+n+' bobina(s)?',
      texto:'Depois de concluído, não entra mais nenhuma leitura nele.', ok:'Concluir', cancelar:'Continuar bipando' }))) return;
  try{
    const r=await fetch(URL_BASE+'/bobinas/inventario/concluir',{ method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' });
    const d=await r.json();
    if(!r.ok||!d.ok){ toast('erro',esc((d&&d.erro)||'Falha ao concluir'),5000); return; }
    d.aberto=false; pintarInventario(d);
    const txt=await (await fetch(URL_BASE+'/bobinas/inventario/lista?id='+d.inventario.id)).text();
    const ps=d.por_situacao||{};

      (ps.na_sacoleira?(' · '+ps.na_sacoleira+' que o sistema dava na sacoleira'):'')+(ps.usada?(' · '+ps.usada+' que o sistema dava como usadas'):'')+'</div>'+
      '<textarea id="inv-texto" readonly>'+esc(txt)+'</textarea>'+
      '<button class="btn btn-verde digitar" onclick="copiarInventario()">📋 Copiar lista</button></div>';
    document.getElementById('inv-concluir').classList.add('oculto');
    document.getElementById('inv-ultima').innerHTML='';
    MODO='inv-fim';   // leitura não entra mais em inventário nenhum
    toast('ok','✓ Inventário concluído',3000);
  }catch(e){ toast('erro','Erro: '+esc(e.message),5000); }
}
async function copiarInventario(){
  const t=document.getElementById('inv-texto');
  try{ await navigator.clipboard.writeText(t.value); toast('ok','Lista copiada',2000); }
  catch(e){ t.select(); try{ document.execCommand('copy'); toast('ok','Lista copiada',2000); }catch(e2){ toast('aviso','Selecione o texto e copie',3000); } }
}
function voltarSacoleiras(){ mostrarTela('sac'); atualizarTudo(); }

// ── TURNO DO CORTE (30/09/2026): só o supervisor inicia, troca e encerra.
let TC={ sacoleiras:[], turnos:[] };
async function carregarTurnoCorte(){
  const el=document.getElementById('turno-corte');
  try{ const d=await (await fetch(URL_BASE+'/bobinas/turno-corte')).json(); if(d&&d.ok) TC=d; }
  catch(e){ el.innerHTML='<div class="vazio">Não consegui ler o turno.</div>'; return; }
  const lb=c=>(TC.turnos.find(t=>t.codigo===c)||{}).label||c;
  const algumSem=TC.sacoleiras.some(s=>!s.turno);
  el.className='tc'+(algumSem?' sem':'');
  el.innerHTML='<div class="tc-maqs">'+TC.sacoleiras.map(s=>'<div class="tc-maq">SACOLEIRA '+s.sacoleira+
      (s.turno?('<b>'+esc(lb(s.turno.turno))+'</b><small>desde '+diaHora(s.turno.inicio)+'</small>')
              :'<b class="sem">sem turno</b><small>fora de turno</small>')+'</div>').join('')+'</div>'+
    '<div class="tc-bts"><button class="btn btn-verde" onclick="turnoCorte(\'iniciar\')">'+(algumSem&&TC.sacoleiras.every(s=>!s.turno)?'Iniciar turno':'Iniciar / trocar')+'</button>'+
    '<button class="btn btn-vermelho" onclick="turnoCorte(\'encerrar\')"'+(TC.sacoleiras.some(s=>s.turno)?'':' disabled')+'>Encerrar turno</button></div>';
}
function turnoCorte(acao){
  const iniciar=acao==='iniciar';
  const abertas=TC.sacoleiras.filter(s=>s.turno).map(s=>s.sacoleira);
  // 01/10/2026 (Gustavo): turno sempre nas DUAS sacoleiras — sem escolher máquina.
  let turno=null; const maqs=iniciar?['P1','P2']:abertas.slice();
  const parciais={};   // { P1: {fardos, formato, formato_origem} } — fardos do turno que fecha
  const fundo=document.createElement('div');
  fundo.className='modal-fundo';
  fundo.innerHTML='<div class="modal">'+
    '<h2>'+(iniciar?'Iniciar turno do corte':'Encerrar turno do corte')+'</h2>'+
    '<div class="m-sub">'+(iniciar?'Se a sacoleira já tem turno aberto, ele é encerrado agora e o novo começa no mesmo instante.'
      :'A sacoleira fica <b>fora de turno</b> até alguém iniciar o próximo. A bobina montada continua na máquina.')+
    '<br>Com bobina montada, a seguir peço quantos fardos ela deu <b>neste turno</b>.</div>'+
    (iniciar?('<label>TURNO</label><div class="fmts" id="md-turnos">'+TC.turnos.map(t=>
      '<button class="chip" data-t="'+esc(t.codigo)+'">'+esc(t.label)+'</button>').join('')+'</div>'):'')+
    '<label>SENHA DO SUPERVISOR</label><input id="md-senha" class="senha" type="password" inputmode="numeric" autocomplete="off" maxlength="8">'+
    '<div class="m-resumo" id="md-resumo"></div>'+
    '<button class="btn '+(iniciar?'btn-verde':'btn-vermelho')+'" id="md-ok">'+(iniciar?'Iniciar':'Encerrar turno')+'</button>'+
    '<button class="btn-link" id="md-cancelar">Cancelar</button></div>';
  document.body.appendChild(fundo);
  const lb=c=>(TC.turnos.find(t=>t.codigo===c)||{}).label||c;
  const pintar=()=>{
    fundo.querySelectorAll('#md-turnos .chip').forEach(c=>c.classList.toggle('sel',c.dataset.t===turno));
    const alvo=maqs.slice().sort().join(' e ')||'?';
    fundo.querySelector('#md-resumo').innerHTML=iniciar
      ? ('Começa <b>'+(turno?esc(lb(turno)):'?')+'</b> na <b>'+alvo+'</b>'+
         maqs.map(p=>{ const s=TC.sacoleiras.find(x=>x.sacoleira===p); return s&&s.turno?('<br>encerra '+esc(lb(s.turno.turno))+' da '+p):''; }).join(''))
      : ('Encerra o turno da <b>'+alvo+'</b>');
  };
  fundo.querySelectorAll('#md-turnos .chip').forEach(c=>c.onclick=()=>{ turno=c.dataset.t; pintar(); });
  pintar();
  const inp=fundo.querySelector('#md-senha');
  const fim=()=>fundo.remove();
  fundo.querySelector('#md-cancelar').onclick=fim;
  const ok=fundo.querySelector('#md-ok');
  ok.onclick=async()=>{
    if(iniciar && !turno){ toast('erro','Toque no turno',3000); return; }
    if(!maqs.length){ toast('erro','Nenhuma sacoleira com turno aberto',3000); return; }
    if(!inp.value){ toast('erro','Digite a senha do supervisor',3000); inp.focus(); return; }
    ok.disabled=true;
    try{
      // Fardos do turno que fecha (30/09/2026): cada sacoleira cujo turno
      // fecha agora e que tem bobina montada. Perguntado uma vez; se a senha
      // estiver errada, o que foi digitado fica guardado para a nova tentativa.
      await carregarSacoleiras();
      const fecham=maqs.filter(p=>{ const s=TC.sacoleiras.find(x=>x.sacoleira===p); return s&&s.turno; });
      for(const p of fecham){
        if(parciais[p]) continue;
        const bob=(ABERTAS.find(a=>a.sacoleira===p)||{}).bobina;
        if(!bob) continue;
        const v=await perguntarFardos(bob, p, 'turno');
        if(v===null){ ok.disabled=false; return; }
        parciais[p]={ fardos:v.fardos, soltos:v.soltos, formato:v.formato, formato_origem:v.origem };
      }
      let r, d;
      for(let tentativa=0; tentativa<2; tentativa++){
        r=await fetch(URL_BASE+'/bobinas/turno-corte/'+acao,{ method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({ senha:inp.value, turno, maquinas:maqs, parciais, operador:(window.EKO_RESPONSAVEL||null) }) });
        d=await r.json();
        // Bobina montada por outro aparelho no meio do caminho: pergunta a que faltou.
        if(r.status===409 && d && d.precisa_fardos && tentativa===0){
          for(const b of (d.bobinas||[])){
            const v=await perguntarFardos(b, b.sacoleira, 'turno');
            if(v===null){ ok.disabled=false; return; }
            parciais[b.sacoleira]={ fardos:v.fardos, soltos:v.soltos, formato:v.formato, formato_origem:v.origem };
          }
          continue;
        }
        break;
      }
      if(!r.ok||!d.ok){ beep(320,0.25); vibrar(200); toast('erro',esc((d&&d.erro)||'Falha'),5000); ok.disabled=false;
        if(r.status===401){ inp.value=''; inp.focus(); } return; }
      beep(1050,0.14); vibrar([60,50,60]);
      const txtF=(d.parciais||[]).map(x=>' · '+x.sacoleira+' '+txtPc(x.pacotes)).join('');
      toast('ok', (iniciar?('✓ '+esc(lb(turno))+' iniciado · '+maqs.join(' e ')):'✓ Turno encerrado · '+maqs.join(' e '))+txtF,4000);
      fim(); atualizarTudo();
      // Encerrar ou trocar fecha um turno: mostra o resumo dele (01/10/2026, Gustavo).
      if(!iniciar || (d.encerrados||[]).length) mostrarResumoTurno(inp.value);
    }catch(e){ toast('erro','Erro: '+esc(e.message),5000); ok.disabled=false; }
  };
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') ok.click(); });
}

// Resumo do turno que acabou de fechar: por sacoleira, as bobinas que
// passaram nele, formato, fardos do turno e quem bipou. Cada bobina tem
// "corrigir" para conferir com o lançamento manual (01/10/2026, Gustavo) —
// usa a senha que o supervisor acabou de digitar para encerrar o turno.
async function mostrarResumoTurno(senha, fundoAntigo){
  let d;
  try{ d=await (await fetch(URL_BASE+'/bobinas/do-turno?fechado=1')).json(); }catch(e){ return; }
  const sacs=((d&&d.sacoleiras)||[]).filter(s=>s.turno);
  if(!sacs.length) return;
  if(fundoAntigo) fundoAntigo.remove();
  const fundo=document.createElement('div');
  fundo.className='modal-fundo';
  const blocos=sacs.map(s=>{
    const t=s.turno, bs=s.bobinas||[];
    const saiu=bs.filter(b=>!b.montada).length, entrou=bs.filter(b=>!b.veio_de_antes).length;
    const quem=[...new Set(bs.map(b=>b.operador).filter(Boolean))];
    const kgBob=bs.filter(b=>!b.veio_de_antes).reduce((a,b)=>a+(Number(b.peso)||0),0);
    // Uma caixa por bobina, igual à lista "Neste turno" (01/10/2026, Gustavo:
    // "não tem separação"): o que é a bobina à esquerda, fardos do turno à direita.
    const itens=bs.slice().reverse().map(b=>{
      const pct=b.rendimento_pct, alerta=pct!=null && pct>100;
      const num=b.pacotes_turno!=null?(pcGrande(b.pacotes_turno,true)+'<small>neste turno</small>')
                                     :'<b>—</b><small>sem fardos</small>';
      const situ=b.montada?'continua na máquina':('encerrada'+(pct!=null?(' · rendeu <b class="'+(alerta?'h-alerta':'hb-pct')+'">'+pct+'%</b>'):''));
      return '<div class="hb rs-bob'+(alerta?' alerta':'')+'">'+
        '<div class="hb-l1"><span class="hb-mat">'+descCurta(b)+
          (b.formato_turno?(' · <b class="rs-fmt">'+esc(b.formato_turno.replace('x',' × '))+'</b>'):'')+'</span>'+
          '<span class="hb-num">'+num+'</span></div>'+
        '<div class="hb-l2">'+esc(b.id)+' · '+fmtKg(b.peso)+(b.operador?(' · '+esc(b.operador)):'')+
          (b.veio_de_antes?' <span class="h-antes">turno anterior</span>':'')+'</div>'+
        '<div class="rs-pe"><div class="hb-l3">'+situ+
          (b.editado?(' · <span class="h-antes">corrigido'+(b.fardos_antes!=null?(' (era '+b.fardos_antes+')'):'')+'</span>'):'')+'</div>'+
        (b.parte_id?('<button class="h-desf rs-edit" data-p="'+b.parte_id+'" data-f="'+(b.fechados_turno??'')+
          '" data-s="'+(b.soltos_turno??0)+'" data-id="'+esc(b.id)+'">corrigir</button>'):'')+
      '</div></div>';
    }).join('');
    return '<div class="rs-sac"><div class="rs-cab"><span>Sacoleira '+s.sacoleira+' · '+esc(t.label)+'</span>'+
      '<small>'+hora(t.inicio)+' – '+hora(t.fim)+'</small></div>'+
      '<div class="rs-tot">'+txtPc(s.pacotes_turno||0)+' <small>· '+fmtKg(s.kg_turno||0)+'</small></div>'+
      '<div class="rs-it">'+entrou+' bobina'+(entrou===1?'':'s')+' montada'+(entrou===1?'':'s')+(kgBob?(' ('+fmtKg(kgBob)+')'):'')+
        ' · '+saiu+' encerrada'+(saiu===1?'':'s')+(quem.length?(' · '+esc(quem.join(', '))):'')+'</div>'+
      (itens||'<div class="rs-it">nenhuma bobina no turno</div>')+'</div>';
  }).join('');
  const totPc=sacs.reduce((a,s)=>a+(s.pacotes_turno||0),0);
  fundo.innerHTML='<div class="modal"><h2>Resumo do turno</h2>'+
    '<div class="m-sub">Total das sacoleiras: <b>'+txtPc(totPc)+'</b> · <b>'+fmtKg(totPc*KG_PC)+'</b></div>'+
    blocos+'<button class="btn btn-verde" id="md-cancelar">OK</button></div>';
  document.body.appendChild(fundo);
  fundo.querySelector('#md-cancelar').onclick=()=>fundo.remove();
  fundo.querySelectorAll('.rs-edit').forEach(bt=>bt.onclick=async()=>{
    const v=await corrigirParte(bt.dataset.id, Number(bt.dataset.f)||0, Number(bt.dataset.s)||0);
    if(!v) return;
    try{
      const r=await fetch(URL_BASE+'/bobinas/parcial/editar',{ method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ senha, parte_id:Number(bt.dataset.p), fardos:v.fardos, soltos:v.soltos,
                              operador:(window.EKO_RESPONSAVEL||null) }) });
      const d2=await r.json();
      if(!r.ok||!d2.ok){ toast('erro',esc((d2&&d2.erro)||'Falha ao corrigir'),5000); return; }
      toast('ok','✓ '+esc(bt.dataset.id)+': '+v.fardos+' fardos +'+v.soltos+' pc'+
        (d2.seguinte?('<br>ajustada também a '+esc(d2.seguinte.id)):''),3500);
      await mostrarResumoTurno(senha, fundo);
      atualizarTudo();
    }catch(e){ toast('erro','Erro: '+esc(e.message),5000); }
  });
}

// Corrigir uma parte do turno: fardos FECHADOS e pacotes SOLTOS no fim dela,
// como no fim de turno. Resolve {fardos, soltos} ou null.
function corrigirParte(id, fardos, soltos){
  return new Promise(resolve=>{
    const fundo=document.createElement('div');
    fundo.className='modal-fundo';
    fundo.innerHTML='<div class="modal"><h2>Corrigir · '+esc(id)+'</h2>'+
      '<div class="m-sub">Lançado: <b>'+fardos+' fardo'+(fardos===1?'':'s')+(soltos?(' +'+soltos+' pc'):'')+'</b>. '+
        'Digite o que confere com o lançamento manual.</div>'+
      '<label>FARDOS FECHADOS NESTE TURNO</label><input id="md-cf" type="number" inputmode="numeric" min="0" max="999" step="1" autocomplete="off" value="'+fardos+'">'+
      '<label>PACOTES SOLTOS NO FIM</label><div class="fmts soltos">'+[0,1,2,3,4].map(n=>
        '<button class="chip'+(n===soltos?' sel':'')+'" data-s="'+n+'">'+n+'</button>').join('')+'</div>'+
      '<button class="btn btn-verde" id="md-ok">Corrigir</button>'+
      '<button class="btn-link" id="md-cancelar">Cancelar</button></div>';
    document.body.appendChild(fundo);
    const inp=fundo.querySelector('#md-cf');
    let s=soltos;
    fundo.querySelectorAll('.soltos .chip').forEach(c=>c.onclick=()=>{
      s=Number(c.dataset.s); fundo.querySelectorAll('.soltos .chip').forEach(x=>x.classList.toggle('sel',x===c)); });
    const fim=v=>{ fundo.remove(); resolve(v); };
    fundo.querySelector('#md-cancelar').onclick=()=>fim(null);
    fundo.querySelector('#md-ok').onclick=()=>{
      const n=Number(inp.value);
      if(inp.value==='' || !Number.isInteger(n) || n<0 || n>999){ toast('erro','Digite os fardos (0 a 999)',3000); inp.focus(); return; }
      fim({ fardos:n, soltos:s });
    };
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') fundo.querySelector('#md-ok').click(); });
    setTimeout(()=>{ inp.focus(); inp.select(); },50);
  });
}

async function atualizarTudo(){ await Promise.all([carregarTurnoCorte(), carregarSacoleiras(), carregarHistorico()]); }

// ── TURNO (só com o Bling ligado: é o cliente da venda)
async function carregarModo(){
  try{
    const r=await fetch(URL_BASE+'/bobinas/turnos');
    const d=await r.json();
    BLING=!!(d&&d.bling);
    TURNOS=(d&&d.turnos)||[];
  }catch(e){}
  const el=document.getElementById('turnos');
  if(!BLING){ el.classList.add('oculto'); return; }
  try{ const s=JSON.parse(localStorage.getItem('bobinas_turno')||'null'); if(s && TURNOS.find(t=>t.codigo===s.codigo)) TURNO=s; }catch(e){}
  el.innerHTML='<span class="lb">TURNO</span>'+TURNOS.map(t=>
    '<button class="chip'+(TURNO&&TURNO.codigo===t.codigo?' sel':'')+'" onclick="escolherTurno(\''+esc(t.codigo)+'\',\''+esc(t.label)+'\')">'+esc(t.label)+'</button>').join('');
  el.classList.remove('oculto');
}
function escolherTurno(codigo,label){
  TURNO={codigo,label};
  try{ localStorage.setItem('bobinas_turno', JSON.stringify(TURNO)); }catch(e){}
  carregarModo();
}

// Só inicia depois que o colaborador entrar com a senha dele.
// Rede de segurança: se o componente de acesso não carregar por algum motivo,
// a tela ABRE mesmo assim (sem identificação) em vez de ficar morta. Numa
// fábrica, tela travada para a produção; falta de identificação, não.
function comAcesso(tela, aoEntrar) {
  if (window.EkoAcesso && typeof EkoAcesso.exigir === 'function') return EkoAcesso.exigir(tela, aoEntrar);
  console.warn('acesso-colaborador.js não carregou — abrindo a tela sem identificação');
  try { aoEntrar(); } catch (e) { console.error(e); }
}
comAcesso('bobinas', nome => {
  if (nome) document.getElementById('quem').textContent = '👤 ' + nome;
  carregarModo();
  atualizarTudo();
  retomarInventario();
  // Outro celular pode trocar bobina: atualiza as sacoleiras a cada minuto
  // enquanto a tela estiver visível e sem leitura em andamento.
  setInterval(()=>{ if(MODO==='sac' && !document.hidden && !bobinaAtual && !enviando) atualizarTudo(); }, 60000);
});
