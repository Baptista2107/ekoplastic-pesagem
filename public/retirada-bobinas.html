<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script src="/acesso-colaborador.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Bobina na Sacoleira</title>
<script src="/vendor/html5-qrcode.min.js"></script>
<style>
  /* Tela revista em 28/09/2026 (VPS, pedido do Frederico): sem turno, um
     botão de digitar só, as sacoleiras no topo e o histórico enxuto. */
  :root{
    --bg:#0a1119; --panel:#131f30; --panel-hi:#1d2c42; --border:#2a3a52;
    --txt:#eef4fb; --muted:#94a8c4; --verde:#00ff9d; --ambar:#ffc250; --vermelho:#ff6b6b; --azul:#5aa9ff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;} html{height:100%;}
  body{background:var(--bg); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding-bottom:24px; font-size:16px; line-height:1.4; min-height:100dvh;}
  header{padding:calc(12px + env(safe-area-inset-top)) 16px 12px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:20; display:flex; align-items:center; gap:12px;}
  header h1{margin:0; font-size:19px; font-weight:800; flex:1; line-height:1.2;}
  header h1 small{display:block; font-size:12px; color:var(--muted); font-weight:600; margin-top:2px;}
  .btn-sair{background:var(--panel-hi); border:1px solid var(--border); color:var(--muted); border-radius:12px; min-width:44px; height:44px; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:800; text-decoration:none;}
  .wrap{padding:14px 16px; max-width:560px; margin:0 auto;}
  .oculto{display:none !important;}

  .btn{border:none; border-radius:14px; font-family:inherit; font-weight:800; cursor:pointer; min-height:52px; font-size:17px; padding:12px 16px; transition:transform .05s;}
  .btn:active{transform:scale(0.98);}
  .btn:disabled{opacity:.5;}
  .btn-verde{background:var(--verde); color:#052916;}
  .btn-cinza{background:var(--panel-hi); color:var(--txt); border:1.5px solid var(--border);}
  .btn-link{background:none; border:none; color:var(--muted); font-family:inherit; font-size:15px; font-weight:700; padding:12px; min-height:44px; cursor:pointer; width:100%;}

  .sec-tit{display:flex; justify-content:space-between; align-items:baseline; font-size:12px; font-weight:800; letter-spacing:1px; color:var(--muted); text-transform:uppercase; margin:22px 0 10px;}
  .sec-tit:first-child{margin-top:4px;}
  .sec-tit .sub{letter-spacing:0; text-transform:none; font-weight:700;}

  /* Sacoleiras */
  .sacs{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .sac{background:var(--panel); border:1.5px solid var(--border); border-radius:14px; padding:12px; min-width:0; display:flex; flex-direction:column;}
  .sac .s-top{display:flex; align-items:center; gap:6px; font-size:12px; font-weight:800; letter-spacing:.8px; color:var(--muted);}
  .sac .dot{width:8px; height:8px; border-radius:50%; background:var(--border); flex:0 0 auto;}
  .sac.ativa{border-color:rgba(0,255,157,.45);}
  .sac.ativa .dot{background:var(--verde);}
  .sac .s-mat{font-size:16px; font-weight:800; margin-top:8px; line-height:1.25; overflow-wrap:anywhere;}
  .sac .s-info{font-size:12px; color:var(--muted); margin-top:4px; font-family:ui-monospace,monospace; overflow-wrap:anywhere;}
  .sac .s-vazia{font-size:15px; color:var(--muted); margin-top:8px; font-weight:700; flex:1;}
  .sac .s-fim{margin-top:10px; min-height:40px; font-size:14px; padding:8px; border-radius:10px; width:100%;}

  /* Ações */
  .acoes{display:flex; gap:10px; margin-top:16px;}
  .acoes .principal{flex:1;}
  .acoes .quad{flex:0 0 56px; padding:0; font-size:22px;}
  #reader{width:100%; border-radius:14px; overflow:hidden; background:#000; display:none; border:1.5px solid var(--border); margin-top:12px;}
  #reader.on{display:block; min-height:240px;}
  #reader video{width:100%!important; height:auto!important; display:block;}
  #zoom-barra, #lente-barra{background:var(--panel); border:1.5px solid var(--border); border-radius:12px; padding:12px 14px; margin-top:10px;}
  .zoom-lb{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); font-weight:800; letter-spacing:1px; margin-bottom:8px;}
  .zoom-lb span:last-child{color:var(--verde); font-size:15px;}
  .zoom-linha{display:flex; align-items:center; gap:12px;}
  .zoom-op{background:var(--panel-hi); border:1.5px solid var(--border); color:var(--txt); border-radius:12px; min-width:48px; height:48px; font-size:22px; font-weight:800; font-family:inherit; cursor:pointer;}
  #zoom-range{flex:1; height:40px; accent-color:var(--verde);}
  .lente-botoes{display:flex; gap:8px; flex-wrap:wrap;}
  .lente-btn{flex:1; min-width:80px; background:var(--panel-hi); border:1.5px solid var(--border); color:var(--txt); border-radius:12px; padding:12px 8px; font-size:14px; font-weight:700; font-family:inherit; cursor:pointer;}
  .lente-btn.sel{border-color:var(--verde); color:var(--verde);}
  #painel-diag{background:var(--panel); border:1.5px solid var(--ambar); border-radius:14px; padding:14px; margin-top:12px; font-size:14px; line-height:1.6;}

  /* Bobina lida */
  .lida{background:var(--panel-hi); border:2px solid var(--verde); border-radius:16px; padding:16px; margin-top:14px;}
  .lida.erro{border-color:var(--vermelho);}
  .lida .l-id{font-family:ui-monospace,monospace; font-size:14px; color:var(--muted); font-weight:700;}
  .lida .l-mat{font-size:22px; font-weight:900; margin:4px 0 2px; line-height:1.2;}
  .lida.erro .l-mat{color:var(--vermelho); font-size:18px;}
  .lida .l-kg{font-size:26px; font-weight:900; color:var(--verde);}
  .lida .l-orig{font-size:13px; color:var(--muted); margin-top:4px;}
  .lida .l-per{font-size:12px; font-weight:800; letter-spacing:1px; color:var(--muted); margin-top:16px;}
  .destinos{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px;}
  .destinos .btn{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:72px; line-height:1.15;}
  .destinos .btn b{font-size:22px;}
  .destinos .btn span{font-size:12px; font-weight:700; opacity:.8; margin-top:3px;}

  /* Turno — só aparece com o Bling ligado */
  .turnos{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:6px;}
  .turnos .lb{font-size:12px; font-weight:800; letter-spacing:1px; color:var(--muted); margin-right:4px;}
  .chip{background:var(--panel); border:1.5px solid var(--border); color:var(--txt); border-radius:999px; padding:10px 14px; font-weight:800; font-family:inherit; font-size:14px; min-height:44px; cursor:pointer;}
  .chip.sel{border-color:var(--verde); color:var(--verde);}

  /* Hoje */
  .hist{display:flex; flex-direction:column; gap:6px;}
  .h-item{display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--panel); border:1px solid var(--border); border-radius:12px;}
  .h-item .h-hora{font-family:ui-monospace,monospace; font-size:13px; color:var(--muted); flex:0 0 auto;}
  .h-item .h-sac{font-size:12px; font-weight:900; background:var(--panel-hi); border-radius:8px; padding:3px 7px; flex:0 0 auto;}
  .h-item .h-mat{flex:1; min-width:0; font-size:14px; font-weight:700; line-height:1.25;}
  .h-item .h-mat small{display:block; font-family:ui-monospace,monospace; font-size:11px; color:var(--muted); font-weight:600;}
  .h-item .h-dir{text-align:right; flex:0 0 auto; font-size:13px; font-weight:800; line-height:1.3;}
  .h-item .h-dir small{display:block; font-size:11px; font-weight:700; color:var(--muted);}
  .h-item .na-maq{color:var(--verde);}
  .vazio{color:var(--muted); font-size:14px; text-align:center; padding:18px; background:var(--panel); border-radius:12px;}
  .carregando{color:var(--muted); font-size:14px; text-align:center; padding:18px;}

  /* Modal de fardos */
  .modal-fundo{position:fixed; inset:0; background:rgba(0,0,0,0.72); z-index:90; display:flex; align-items:center; justify-content:center; padding:16px;}
  .modal{background:var(--panel); border:2px solid var(--ambar); border-radius:18px; padding:18px; width:100%; max-width:420px; max-height:92dvh; overflow:auto;}
  .modal h2{margin:0 0 6px; font-size:19px;}
  .modal .m-sub{color:var(--muted); font-size:14px; line-height:1.45;}
  .modal .m-sub b{color:var(--txt);}
  .modal label{display:block; font-size:12px; color:var(--muted); font-weight:800; letter-spacing:1px; margin-top:16px;}
  .modal input{width:100%; margin-top:6px; padding:12px; font-size:30px; font-weight:900; text-align:center; border-radius:12px; border:2px solid var(--border); background:var(--bg); color:var(--txt); font-family:inherit;}
  .modal input:focus{outline:none; border-color:var(--ambar);}
  .modal .btn{width:100%; margin-top:12px;}

  .toast{position:fixed; left:50%; transform:translateX(-50%); top:76px; padding:14px 20px; border-radius:14px; font-size:16px; font-weight:800; z-index:100; box-shadow:0 8px 28px rgba(0,0,0,0.6); max-width:92vw; text-align:center; display:none;}
  .toast.ok{background:#0d3b2a; color:var(--verde); border:1.5px solid var(--verde);}
  .toast.erro{background:#3b1414; color:var(--vermelho); border:1.5px solid var(--vermelho);}
  .toast.aviso{background:#3b2f0d; color:var(--ambar); border:1.5px solid var(--ambar);}
</style>

<body>
<header>
  <h1>🧵 Bobina na Sacoleira<small id="quem"></small></h1>
  <a class="btn-sair" href="/" title="Voltar ao sistema">✕</a>
</header>
<div class="toast" id="toast"></div>

<div class="wrap">
  <!-- Turno: só com o Bling ligado (é o cliente da venda). -->
  <div class="turnos oculto" id="turnos"></div>

  <div class="sec-tit"><span>Sacoleiras agora</span></div>
  <div class="sacs" id="sacs"><div class="carregando">Carregando…</div></div>

  <div class="acoes">
    <button class="btn btn-verde principal" id="btn-camera" onclick="toggleCamera()">📷 Ler etiqueta</button>
    <button class="btn btn-cinza quad" onclick="digitarCodigo()" title="Digitar o número da etiqueta">⌨️</button>
    <button class="btn btn-cinza quad oculto" id="btn-torch" onclick="toggleTorch()" title="Lanterna">🔦</button>
  </div>
  <div id="reader"></div>
  <div id="zoom-barra" class="oculto">
    <div class="zoom-lb"><span>ZOOM</span><span id="zoom-valor">1.0×</span></div>
    <div class="zoom-linha">
      <button class="zoom-op" onclick="ajustarZoom(-1)">−</button>
      <input type="range" id="zoom-range" min="1" max="5" step="0.1" value="1" oninput="aplicarZoom(this.value)">
      <button class="zoom-op" onclick="ajustarZoom(1)">+</button>
    </div>
  </div>
  <div id="lente-barra" class="oculto">
    <div class="zoom-lb"><span>LENTE DA CÂMERA</span></div>
    <div id="lente-botoes" class="lente-botoes"></div>
  </div>
  <div id="painel-diag" class="oculto"></div>

  <!-- bobina lida, aguardando a sacoleira -->
  <div id="area-bobina"></div>

  <div class="sec-tit"><span>Hoje</span><span class="sub" id="hoje-resumo"></span></div>
  <div class="hist" id="lista-hist"><div class="carregando">Carregando…</div></div>
</div>

<script>
const URL_BASE='';
let scanner=null, camLigada=false, ULTIMO_ERRO_CAM=null;
let ZOOM_CAPS=null, CAMERAS=[], CAMERA_ID=null, RESOLUCAO_CAM=null;
const ultimoBipe={};
let bobinaAtual=null;      // bobina lida, aguardando a sacoleira
let BLING=false;           // a baixa cria pedido no Bling? (config baixa_bobina_bling)
let TURNOS=[], TURNO=null; // só usados com o Bling ligado
let ABERTAS=[];            // [{sacoleira, bobina|null}] — o que está montado agora
let enviando=false;

function toast(tipo,msg,ms){
  const t=document.getElementById('toast');
  t.className='toast '+tipo; t.innerHTML=msg; t.style.display='block';
  clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none', ms||2400);
}
function beep(freq,dur){
  try{
    const ac=beep._ac=beep._ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.frequency.value=freq;o.connect(g);g.connect(ac.destination);
    g.gain.setValueAtTime(0.15,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+(dur||0.12));
    o.start();o.stop(ac.currentTime+(dur||0.12));
  }catch(e){}
}
function vibrar(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }
function fmtKg(n){ return (Math.round(n*10)/10).toLocaleString('pt-BR')+' kg'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function descBob(b){ return esc(b.cor)+' · '+esc(b.largura)+(b.tipo_bobina?(' · '+esc(b.tipo_bobina)):''); }
// Curta (cor · largura) para os cartões das sacoleiras e o histórico: com o
// tipo junto o texto quebra em duas linhas no celular.
function descCurta(b){ return esc(b.cor)+' · '+esc(b.largura); }
function hora(iso){ try{ return new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
function diaHora(iso){ try{ return new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
// "há 2h 15min" desde a montagem — é o que o operador olha para saber se a
// bobina está perto do fim.
function haQuanto(iso){
  const min=Math.max(0, Math.round((Date.now()-new Date(iso).getTime())/60000));
  if(min<60) return 'há '+min+' min';
  const h=Math.floor(min/60), m=min%60;
  if(h<48) return 'há '+h+'h'+(m?(' '+String(m).padStart(2,'0')+'min'):'');
  return 'desde '+diaHora(iso);
}

function formatosSuportados(){
  if(typeof Html5QrcodeSupportedFormats === 'undefined') return undefined;
  const F=Html5QrcodeSupportedFormats;
  return [F.CODE_128,F.CODE_39,F.EAN_13,F.EAN_8,F.ITF,F.CODABAR,F.QR_CODE];
}

// Verifica os pré-requisitos e devolve a causa exata quando algo falta.
function checarPreRequisitos(){
  if(typeof Html5Qrcode === 'undefined')
    return 'A biblioteca de leitura não carregou. Recarregue a página (puxe a tela para baixo).';
  if(!window.isSecureContext)
    return 'A página não está em conexão segura. Acesse por https://…:3443 (não http).';
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
    return 'CERTIFICADO: o Safari bloqueou a câmera porque o certificado do servidor não é confiável neste iPhone. Toque em "⚙️ Diagnóstico" para ver como resolver.';
  return null;
}

// Mostra o estado real do aparelho — é o que diz a causa quando a câmera falha.
async function mostrarDiagnostico(){
  const p=document.getElementById('painel-diag');
  p.classList.remove('oculto');
  const emQuadro = (window.self !== window.top);
  const linhas=[];
  const sim='<b style="color:var(--verde)">SIM</b>', nao='<b style="color:var(--vermelho)">NÃO</b>';
  linhas.push('Biblioteca de leitura: '+(typeof Html5Qrcode!=='undefined'?sim:nao));
  linhas.push('Conexão segura (HTTPS): '+(window.isSecureContext?sim:nao));
  linhas.push('Acesso à câmera disponível: '+((navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)?sim:nao));
  linhas.push('Aberto em tela cheia: '+(emQuadro?nao+' (está dentro de um quadro)':sim));
  linhas.push('Endereço: '+location.protocol+'//'+location.host);
  if(ULTIMO_ERRO_CAM) linhas.push('<b style="color:var(--vermelho)">Último erro: '+ULTIMO_ERRO_CAM+'</b>');
  p.innerHTML='<div style="font-weight:800; margin-bottom:8px; color:var(--ambar)">⚙️ Diagnóstico</div>'+linhas.join('<br>')+'<div class="carregando" style="padding:8px 0">procurando câmeras…</div>';
  let extra='';
  try{
    if(typeof Html5Qrcode!=='undefined'){
      const cams=await Html5Qrcode.getCameras();
      extra='<br>Câmeras encontradas: <b>'+cams.length+'</b>'+(cams.length?(' ('+cams.map(c=>c.label||'sem nome').join(', ')+')'):'');
    }
  }catch(e){ extra='<br>Erro ao listar câmeras: <b style="color:var(--vermelho)">'+(e&&(e.name||e.message))+'</b>'; }

  let solucao='';
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    solucao='<div style="margin-top:12px; padding:12px; background:rgba(255,194,80,0.12); border-radius:10px;">'+
      '<b>Causa provável:</b> o iPhone não confia no certificado do servidor, e o Safari bloqueia a câmera nesse caso — mesmo com a permissão concedida.<br><br>'+
      '<b>Como resolver:</b><br>1. Baixe o certificado: <a href="/cert-ekoplastic.pem" style="color:var(--azul)">tocar aqui</a><br>'+
      '2. Ajustes → Geral → VPN e Gerenciamento → instale o perfil<br>'+
      '3. Ajustes → Geral → Sobre → Ajustes de Confiança do Certificado → <b>ative "Ekoplastic"</b><br>'+
      '4. Feche e reabra o Safari</div>';
  }
  p.innerHTML='<div style="font-weight:800; margin-bottom:8px; color:var(--ambar)">⚙️ Diagnóstico</div>'+linhas.join('<br>')+extra+solucao
    +'<button class="btn btn-cinza" style="margin-top:14px; min-height:44px; font-size:14px;" onclick="document.getElementById(\'painel-diag\').classList.add(\'oculto\')">fechar</button>';
}

// Escolhe a MELHOR câmera traseira do aparelho. O iPhone expõe várias (grande-angular,
// ultra-angular, dupla); a "traseira" simples é a que foca de perto com nitidez —
// justamente o que código de barras exige. Escolher pelo ID evita que o sistema
// selecione a ultra-angular, que não foca a curta distância.
async function escolherCameraId(){
  try{
    const cams = await Html5Qrcode.getCameras();
    if(!cams || !cams.length) return null;
    const rot = c => (c.label||'').toLowerCase();
    const traseiras = cams.filter(c => /traseira|back|rear|trás/.test(rot(c)));
    if(traseiras.length){
      // evita ultra-angular (foco ruim de perto) e prefere a traseira "simples"
      const semUltra = traseiras.filter(c => !/ultra/.test(rot(c)));
      const lista = semUltra.length ? semUltra : traseiras;
      const simples = lista.find(c => !/dupla|dual|tripla|grande|wide/.test(rot(c)));
      return (simples || lista[lista.length-1]).id;
    }
    return cams[cams.length-1].id;
  }catch(e){ return null; }
}

// Alternativa à câmera: digitar o número da etiqueta. Passa pelas mesmas
// validações da leitura.
async function digitarCodigo(){
  const cod = prompt('Número da etiqueta da bobina (ex.: 1669 ou E0001669):');
  if(!cod) return;
  let id = cod.trim().toUpperCase().replace(/\s+/g,'');
  if(!id) return;
  // Só os números: completa como a etiqueta impressa (E + 7 dígitos).
  if(/^\d{1,7}$/.test(id)) id = 'E' + id.padStart(7,'0');
  delete ultimoBipe[id];   // digitação manual não sofre o anti-repetição da câmera
  await onLeu(id);
}

async function toggleCamera(){
  if(camLigada){ await pararCamera(); return; }
  const problema = checarPreRequisitos();
  if(problema){ toast('erro', problema, 9000); return; }

  document.getElementById('reader').classList.add('on');
  document.getElementById('btn-camera').textContent='⏹ Parar câmera';
  camLigada=true;
  ULTIMO_ERRO_CAM=null;

  // Mira ampla: de longe o QR aparece pequeno no quadro, então a área
  // analisada precisa ser grande para não deixá-lo de fora.
  const qrboxFn = (vw, vh) => {
    const lado = Math.floor(Math.min(vw, vh) * 0.92);
    return { width: Math.max(120, lado), height: Math.max(120, lado) };
  };
  // Resolução alta é o que permite ler de longe: um QR de 91mm a 4,5m precisa
  // de ~2 pixels por quadradinho do código. Pede a maior possível — o aparelho
  // entrega a melhor que tiver.
  const config = { fps:10, qrbox:qrboxFn, aspectRatio:1.0,
                   videoConstraints: { facingMode:'environment', width:{ ideal:3840 }, height:{ ideal:2160 } } };

  // Tenta na ordem: câmera traseira escolhida pelo ID → traseira genérica → qualquer uma.
  // Cada tentativa usa uma instância NOVA (uma instância que falhou não reinicia).
  const idTraseira = CAMERA_ID || await escolherCameraId();
  CAMERA_ID = idTraseira || null;
  const alvos = [];
  if(idTraseira) alvos.push(idTraseira);
  alvos.push({ facingMode:'environment' });
  alvos.push({ facingMode:'user' });

  let ok=false;
  for(const alvo of alvos){
    try{ if(scanner){ try{ await scanner.stop(); }catch(e){} try{ scanner.clear(); }catch(e){} } }catch(e){}
    scanner = new Html5Qrcode('reader', { formatsToSupport: formatosSuportados(), verbose:false });
    try{
      await scanner.start(alvo, config, onLeu, ()=>{});
      ok=true; break;
    }catch(err){
      ULTIMO_ERRO_CAM = (err && (err.name ? (err.name+': '+(err.message||'')) : (err.message||String(err)))) || 'erro desconhecido';
      const n=String(ULTIMO_ERRO_CAM);
      if(/NotAllowed|Permission/i.test(n)) break;   // permissão negada: não insiste
    }
  }

  if(!ok){
    camLigada=false;
    document.getElementById('reader').classList.remove('on');
    document.getElementById('btn-camera').textContent='📷 Ler etiqueta';
    toast('erro','Câmera não abriu. Toque em ⚙️ e me mande o "Último erro".', 7000);
    return;
  }

  // Melhorias opcionais — se falharem, a leitura continua normal.
  try{ await scanner.applyVideoConstraints({ advanced:[{ focusMode:'continuous' }] }); }catch(e){}
  try{
    const caps = scanner.getRunningTrackCapabilities();
    if(caps && caps.torch){ document.getElementById('btn-torch').classList.remove('oculto'); }
    prepararZoom(caps);
    try{
      const st = scanner.getRunningTrackSettings ? scanner.getRunningTrackSettings() : null;
      if(st && st.width) RESOLUCAO_CAM = st.width + ' x ' + st.height;
    }catch(e){}
  }catch(e){}
  prepararLentes();
}

async function pararCamera(){
  camLigada=false; torchOn=false;
  document.getElementById('btn-camera').textContent='📷 Ler etiqueta';
  const bt=document.getElementById('btn-torch'); if(bt){ bt.classList.add('oculto'); bt.style.background=''; bt.style.color=''; }
  ['zoom-barra','lente-barra'].forEach(id=>{ const e=document.getElementById(id); if(e) e.classList.add('oculto'); });
  try{ if(scanner){ await scanner.stop(); scanner.clear(); } }catch(e){}
  document.getElementById('reader').classList.remove('on');
}
// O diagnóstico saiu da tela para deixá-la limpa, mas continua a um toque
// longo de distância: segurar o botão da câmera por 2 segundos. Fica lá para
// quando algo der errado, sem ocupar espaço no dia a dia.
(function ligarDiagnosticoOculto(){
  const liga = () => {
    const b = document.getElementById('btn-camera');
    if (!b) return setTimeout(liga, 300);
    let t = null;
    const comecar = () => { t = setTimeout(() => { t = null; mostrarDiagnostico(); }, 2000); };
    const parar   = () => { if (t) { clearTimeout(t); t = null; } };
    b.addEventListener('touchstart', comecar, { passive: true });
    b.addEventListener('touchend', parar);
    b.addEventListener('touchmove', parar);
    b.addEventListener('mousedown', comecar);
    b.addEventListener('mouseup', parar);
    b.addEventListener('mouseleave', parar);
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', liga); else liga();
})();

// ─────────── ZOOM ───────────
// Aproxima a imagem sem chegar perto do QR. Só aparece se o aparelho
// permitir controlar o zoom pela web (a maioria dos Android permite; no
// iPhone depende da versão do iOS — por isso existe a troca de lente).
function prepararZoom(caps){
  const barra=document.getElementById('zoom-barra');
  const z = caps && caps.zoom;
  if(!z || z.max === undefined || z.max <= (z.min||1)){ barra.classList.add('oculto'); ZOOM_CAPS=null; return; }
  ZOOM_CAPS = { min: z.min || 1, max: z.max, step: z.step || 0.1 };
  const r=document.getElementById('zoom-range');
  r.min=ZOOM_CAPS.min; r.max=ZOOM_CAPS.max; r.step=ZOOM_CAPS.step;
  // retoma o zoom usado por último neste aparelho
  let inicial=ZOOM_CAPS.min;
  try{ const salvo=parseFloat(localStorage.getItem('eko_zoom')); if(salvo>=ZOOM_CAPS.min && salvo<=ZOOM_CAPS.max) inicial=salvo; }catch(e){}
  r.value=inicial;
  barra.classList.remove('oculto');
  aplicarZoom(inicial);
}
async function aplicarZoom(v){
  if(!ZOOM_CAPS || !scanner) return;
  const val=Math.max(ZOOM_CAPS.min, Math.min(ZOOM_CAPS.max, parseFloat(v)));
  document.getElementById('zoom-valor').textContent=val.toFixed(1)+'×';
  document.getElementById('zoom-range').value=val;
  try{
    await scanner.applyVideoConstraints({ advanced:[{ zoom: val }] });
    try{ localStorage.setItem('eko_zoom', String(val)); }catch(e){}
  }catch(e){ /* alguns aparelhos recusam: mantém como está */ }
}
function ajustarZoom(d){
  if(!ZOOM_CAPS) return;
  const r=document.getElementById('zoom-range');
  const passo=Math.max(ZOOM_CAPS.step, (ZOOM_CAPS.max-ZOOM_CAPS.min)/10);
  aplicarZoom(parseFloat(r.value) + d*passo);
}

// ─────────── LENTES ───────────
// Alternativa ao zoom (útil no iPhone): trocar a lente traseira. A "tele"
// enxerga mais longe; a normal foca melhor de perto.
async function prepararLentes(){
  const barra=document.getElementById('lente-barra');
  try{
    if(!CAMERAS.length) CAMERAS=(await Html5Qrcode.getCameras())||[];
  }catch(e){ CAMERAS=[]; }
  const rot=c=>(c.label||'').toLowerCase();
  const tras=CAMERAS.filter(c=>/traseira|back|rear|trás/.test(rot(c)));
  if(tras.length<2){ barra.classList.add('oculto'); return; }
  const apelido=c=>{
    const r=rot(c);
    if(/ultra/.test(r)) return 'Ampla';
    if(/tele/.test(r))  return 'Tele';
    if(/dupla|dual|tripla/.test(r)) return 'Dupla';
    return 'Normal';
  };
  const el=document.getElementById('lente-botoes');
  el.innerHTML='';
  tras.forEach(c=>{
    const b=document.createElement('button');
    b.className='lente-btn'+(c.id===CAMERA_ID?' sel':'');
    b.textContent=apelido(c);
    b.onclick=()=>trocarLente(c.id);
    el.appendChild(b);
  });
  barra.classList.remove('oculto');
}
async function trocarLente(id){
  if(!camLigada || id===CAMERA_ID) return;
  CAMERA_ID=id;
  try{ if(scanner){ await scanner.stop(); scanner.clear(); } }catch(e){}
  scanner=new Html5Qrcode('reader',{formatsToSupport:formatosSuportados(), verbose:false});
  const qrboxFn=(vw,vh)=>{const w=Math.max(120,Math.floor(vw*0.9));return {width:w,height:Math.max(90,Math.floor(Math.min(vh*0.6,w*0.6)))};};
  try{
    await scanner.start(id,{fps:10,qrbox:qrboxFn,aspectRatio:1.0},onLeu,()=>{});
    try{ await scanner.applyVideoConstraints({advanced:[{focusMode:'continuous'}]}); }catch(e){}
    try{ prepararZoom(scanner.getRunningTrackCapabilities()); }catch(e){}
    prepararLentes();
    toast('ok','Lente trocada',1500);
  }catch(e){ toast('erro','Não consegui usar esta lente',3000); }
}

// Liga/desliga a lanterna do aparelho (quando suportado).
let torchOn=false;
async function toggleTorch(){
  if(!scanner || !camLigada) return;
  try{
    torchOn=!torchOn;
    await scanner.applyVideoConstraints({ advanced: [ { torch: torchOn } ] });
    const bt=document.getElementById('btn-torch');
    bt.style.background = torchOn ? 'var(--ambar)' : '';
    bt.style.color = torchOn ? '#3b2f0d' : '';
  }catch(e){ toast('aviso','Este aparelho não permite a lanterna pela web',3000); torchOn=false; }
}


// ── LEITURA: consulta a bobina e mostra para o operador escolher a sacoleira.
async function onLeu(codigo){
  const id=(codigo||'').trim().toUpperCase();
  const agora=Date.now();
  if(ultimoBipe[id] && agora-ultimoBipe[id]<2500) return;
  ultimoBipe[id]=agora;
  if(enviando) return;
  try{
    const r=await fetch(URL_BASE+'/bobinas/'+encodeURIComponent(id));
    const d=await r.json();
    if(!r.ok || !d.ok){ beep(320,0.2); vibrar(150); mostrarErro(id,(d&&d.erro)||'Etiqueta não encontrada'); return; }
    const b=d.bobina;
    if(b.status==='consumida'){
      beep(320,0.2); vibrar([80,60,80]);
      mostrarErro(id,'Já foi para a sacoleira'+(b.destino?(' '+esc(b.destino)):'')+(b.baixa_em?(' em '+diaHora(b.baixa_em)):''));
      return;
    }
    if(b.status==='cancelada'){ beep(320,0.2); vibrar(150); mostrarErro(id,'Etiqueta cancelada'); return; }
    if(d.bling && !b.produto_id){ beep(320,0.2); vibrar(150); mostrarErro(id,'Sem produto no Bling para '+esc(b.chave)); return; }

    beep(880,0.1); vibrar(60);
    if(camLigada) pararCamera();
    bobinaAtual=b;
    await carregarSacoleiras();
    const botao=p=>{
      const m=(ABERTAS.find(a=>a.sacoleira===p)||{}).bobina;
      const sub=m?('troca '+esc(m.id)):'livre';
      return '<button class="btn btn-verde btn-destino" data-destino="'+p+'" onclick="confirmarBaixa(\''+p+'\')"><b>'+p+'</b><span>'+sub+'</span></button>';
    };
    const orig=['Extrusora '+esc(b.maquina||'—'), esc(b.operador||''), b.hora_impressao?diaHora(b.hora_impressao):''].filter(Boolean).join(' · ');
    document.getElementById('area-bobina').innerHTML=
      '<div class="lida">'+
        '<div class="l-id">'+esc(b.id)+'</div>'+
        '<div class="l-mat">'+descBob(b)+'</div>'+
        '<div class="l-kg">'+fmtKg(b.peso)+'</div>'+
        '<div class="l-orig">'+orig+'</div>'+
        '<div class="l-per">MONTAR NA SACOLEIRA</div>'+
        '<div class="destinos">'+botao('P1')+botao('P2')+'</div>'+
        '<button class="btn-link" onclick="cancelarLeitura()">Cancelar</button>'+
      '</div>';
    document.getElementById('area-bobina').scrollIntoView({behavior:'smooth', block:'center'});
  }catch(e){ toast('erro','Erro ao consultar: '+esc(e.message),3000); }
}

function mostrarErro(id,msg){
  bobinaAtual=null;
  document.getElementById('area-bobina').innerHTML=
    '<div class="lida erro"><div class="l-id">'+esc(id)+'</div><div class="l-mat">⛔ '+msg+'</div>'+
    '<button class="btn-link" onclick="cancelarLeitura()">Fechar</button></div>';
}
function cancelarLeitura(){ bobinaAtual=null; document.getElementById('area-bobina').innerHTML=''; }
function travarDestinos(p){
  document.querySelectorAll('.btn-destino').forEach(b=>{ b.disabled=true; if(b.dataset.destino===p) b.querySelector('span').textContent=BLING?'enviando ao Bling…':'registrando…'; });
}
function soltarDestinos(){ document.querySelectorAll('.btn-destino').forEach(b=>{ b.disabled=false; }); }

// ── BAIXA: a bobina entra na sacoleira. Se já havia uma, ela sai agora e a
// tela pergunta quantos fardos ela deu.
async function confirmarBaixa(sac){
  if(!bobinaAtual || enviando) return;
  if(BLING && !TURNO){ toast('erro','Escolha o turno primeiro',3000); return; }
  let fardosAnterior=null;
  const montada=(ABERTAS.find(a=>a.sacoleira===sac)||{}).bobina;
  if(montada && montada.id!==bobinaAtual.id){
    fardosAnterior=await perguntarFardos(montada, sac, 'troca');
    if(fardosAnterior===null) return;           // cancelou: nada é gravado
  }
  enviando=true; travarDestinos(sac);
  try{
    let d, r;
    for(let tentativa=0; tentativa<2; tentativa++){
      r=await fetch(URL_BASE+'/bobinas/baixa',{
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ id:bobinaAtual.id, destino:sac, turno:(BLING&&TURNO)?TURNO.codigo:null,
                              fardos_anterior:fardosAnterior, operador:(window.EKO_RESPONSAVEL||null) })
      });
      d=await r.json();
      // Outro celular montou bobina nesta sacoleira no meio do caminho: o
      // servidor pede os fardos dela. Pergunta e tenta de novo, uma vez.
      if(r.status===409 && d && d.precisa_fardos && tentativa===0){
        fardosAnterior=await perguntarFardos(d.anterior, sac, 'troca');
        if(fardosAnterior===null){ soltarDestinos(); enviando=false; return; }
        continue;
      }
      break;
    }
    if(!r.ok || !d.ok){ beep(320,0.25); vibrar(200); toast('erro',esc((d&&d.erro)||'Falha ao registrar'),6000); soltarDestinos(); enviando=false; return; }
    beep(1050,0.14); vibrar([60,50,60]);
    const ped = d.modo==='sem_bling' ? '' : ('<br>pedido '+esc(d.pedido)+(d.modo==='simulacao'?' (simulação)':''));
    toast('ok','✓ '+esc(bobinaAtual.id)+' na '+sac+ped,3000);
    cancelarLeitura();
    await atualizarTudo();
  }catch(e){ toast('erro','Erro: '+esc(e.message),5000); soltarDestinos(); }
  enviando=false;
}

// Pergunta quantos fardos a bobina deu. Resolve com o número, ou null.
function perguntarFardos(bob, sac, modo){
  return new Promise(resolve=>{
    const fundo=document.createElement('div');
    fundo.className='modal-fundo';
    const tit = modo==='troca' ? ('Troca na Sacoleira '+sac) : ('Finalizar Sacoleira '+sac);
    const acao = modo==='troca' ? 'Confirmar troca' : 'Finalizar bobina';
    fundo.innerHTML='<div class="modal">'+
      '<h2>'+tit+'</h2>'+
      '<div class="m-sub">Sai a <b>'+esc(bob.id)+'</b> · '+descBob(bob)+' · '+fmtKg(bob.peso)+
        (bob.baixa_em?('<br>montada '+haQuanto(bob.baixa_em)):'')+'</div>'+
      '<label>QUANTOS FARDOS ELA DEU?</label><input id="md-fardos" type="number" inputmode="numeric" min="0" max="999" step="1" autocomplete="off">'+
      '<button class="btn btn-verde" id="md-ok">'+acao+'</button>'+
      '<button class="btn-link" id="md-cancelar">Cancelar</button></div>';
    document.body.appendChild(fundo);
    const inp=fundo.querySelector('#md-fardos');
    setTimeout(()=>inp.focus(),50);
    const fim=v=>{ fundo.remove(); resolve(v); };
    fundo.querySelector('#md-cancelar').onclick=()=>fim(null);
    fundo.querySelector('#md-ok').onclick=()=>{
      const n=Number(inp.value);
      if(inp.value==='' || !Number.isInteger(n) || n<0 || n>999){ toast('erro','Digite o número de fardos (0 a 999)',3000); inp.focus(); return; }
      fim(n);
    };
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') fundo.querySelector('#md-ok').click(); });
  });
}

// Finalizar: a bobina saiu SEM outra no lugar (máquina parou, acabou o pedido).
async function finalizar(sac){
  const bob=(ABERTAS.find(a=>a.sacoleira===sac)||{}).bobina;
  if(!bob) return;
  const n=await perguntarFardos(bob, sac, 'finalizar');
  if(n===null) return;
  try{
    const r=await fetch(URL_BASE+'/bobinas/finalizar',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ sacoleira:sac, fardos:n, operador:(window.EKO_RESPONSAVEL||null) })
    });
    const d=await r.json();
    if(!r.ok || !d.ok){ toast('erro',esc((d&&d.erro)||'Falha ao finalizar'),5000); return; }
    beep(1050,0.14); vibrar([60,50,60]);
    toast('ok','✓ '+esc(bob.id)+' finalizada · '+n+' fardo'+(n===1?'':'s'),3000);
    await atualizarTudo();
  }catch(e){ toast('erro','Erro: '+esc(e.message),5000); }
}

// ── SACOLEIRAS AGORA
async function carregarSacoleiras(){
  const g=document.getElementById('sacs');
  try{
    const r=await fetch(URL_BASE+'/bobinas/abertas');
    const d=await r.json();
    ABERTAS=(d&&d.sacoleiras)||[];
  }catch(e){ g.innerHTML='<div class="vazio" style="grid-column:1/-1">Não consegui ler as sacoleiras.</div>'; return; }
  g.innerHTML=ABERTAS.map(a=>{
    const b=a.bobina;
    if(!b) return '<div class="sac"><div class="s-top"><span class="dot"></span>SACOLEIRA '+a.sacoleira+'</div>'+
                  '<div class="s-vazia">Sem bobina</div></div>';
    return '<div class="sac ativa"><div class="s-top"><span class="dot"></span>SACOLEIRA '+a.sacoleira+'</div>'+
      '<div class="s-mat">'+descCurta(b)+'</div>'+
      '<div class="s-info">'+esc(b.id)+' · '+fmtKg(b.peso)+'<br>'+haQuanto(b.baixa_em)+'</div>'+
      '<button class="btn btn-cinza s-fim" onclick="finalizar(\''+a.sacoleira+'\')">Finalizar</button></div>';
  }).join('');
}

// ── HOJE: o que entrou nas sacoleiras hoje, com os fardos de quem já saiu.
async function carregarHistorico(){
  const el=document.getElementById('lista-hist');
  try{
    const r=await fetch(URL_BASE+'/bobinas/baixas-hoje');
    const d=await r.json();
    const lista=(d&&d.baixas)||[];
    document.getElementById('hoje-resumo').textContent = lista.length
      ? (lista.length+' bobina'+(lista.length===1?'':'s')+' · '+((d.total_kg||0).toLocaleString('pt-BR'))+' kg') : '';
    if(!lista.length){ el.innerHTML='<div class="vazio">Nenhuma bobina entrou nas sacoleiras hoje.</div>'; return; }
    el.innerHTML=lista.map(x=>{
      const sac=String(x.destino||'').replace(/^Sacoleira\s*/i,'')||'—';
      let dir;
      if(!x.encerrada_em) dir='<span class="na-maq">na máquina</span>';
      else if(x.fardos==null) dir='<span>—</span><small>sem fardos</small>';
      else dir='<span>'+x.fardos+' fardo'+(x.fardos===1?'':'s')+'</span>';
      return '<div class="h-item">'+
        '<span class="h-hora">'+hora(x.hora)+'</span>'+
        '<span class="h-sac">'+esc(sac)+'</span>'+
        '<div class="h-mat">'+descCurta(x)+'<small>'+esc(x.id)+' · '+fmtKg(x.peso)+(x.pedido?(' · pedido '+esc(x.pedido)):'')+'</small></div>'+
        '<div class="h-dir">'+dir+'</div></div>';
    }).join('');
  }catch(e){ el.innerHTML='<div class="vazio">Não consegui ler o histórico.</div>'; }
}

async function atualizarTudo(){ await Promise.all([carregarSacoleiras(), carregarHistorico()]); }

// ── TURNO (só com o Bling ligado: é o cliente da venda)
async function carregarModo(){
  try{
    const r=await fetch(URL_BASE+'/bobinas/turnos');
    const d=await r.json();
    BLING=!!(d&&d.bling);
    TURNOS=(d&&d.turnos)||[];
  }catch(e){}
  const el=document.getElementById('turnos');
  if(!BLING){ el.classList.add('oculto'); return; }
  try{ const s=JSON.parse(localStorage.getItem('bobinas_turno')||'null'); if(s && TURNOS.find(t=>t.codigo===s.codigo)) TURNO=s; }catch(e){}
  el.innerHTML='<span class="lb">TURNO</span>'+TURNOS.map(t=>
    '<button class="chip'+(TURNO&&TURNO.codigo===t.codigo?' sel':'')+'" onclick="escolherTurno(\''+esc(t.codigo)+'\',\''+esc(t.label)+'\')">'+esc(t.label)+'</button>').join('');
  el.classList.remove('oculto');
}
function escolherTurno(codigo,label){
  TURNO={codigo,label};
  try{ localStorage.setItem('bobinas_turno', JSON.stringify(TURNO)); }catch(e){}
  carregarModo();
}

// Só inicia depois que o colaborador entrar com a senha dele.
// Rede de segurança: se o componente de acesso não carregar por algum motivo,
// a tela ABRE mesmo assim (sem identificação) em vez de ficar morta. Numa
// fábrica, tela travada para a produção; falta de identificação, não.
function comAcesso(tela, aoEntrar) {
  if (window.EkoAcesso && typeof EkoAcesso.exigir === 'function') return EkoAcesso.exigir(tela, aoEntrar);
  console.warn('acesso-colaborador.js não carregou — abrindo a tela sem identificação');
  try { aoEntrar(); } catch (e) { console.error(e); }
}
comAcesso('bobinas', nome => {
  if (nome) document.getElementById('quem').textContent = '👤 ' + nome;
  carregarModo();
  atualizarTudo();
  // Outro celular pode trocar bobina: atualiza as sacoleiras a cada minuto
  // enquanto a tela estiver visível e sem leitura em andamento.
  setInterval(()=>{ if(!document.hidden && !bobinaAtual && !enviando) atualizarTudo(); }, 60000);
});
