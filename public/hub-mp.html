<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ekoplastic · MP</title>
<!-- Tela inicial do app "Ekoplastic MP" (coletor do almoxarifado, 25/11/2026).
     Só leva às telas que já existem; cada uma pede o PIN dela. A lista de
     botões está em /hub-mp.js. -->
<style>
  :root { --bg:#0a1119; --panel:#131f30; --borda:#2a3a52; --txt:#eef4fb; --muted:#94a8c4; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:var(--bg); color:var(--txt); min-height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; -webkit-tap-highlight-color:transparent; }
  header { display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 14px 10px; border-bottom:1px solid var(--borda); }
  header h1 { font-size:20px; font-weight:900; letter-spacing:.3px; user-select:none; }
  header h1 span { color:#00ff9d; }
  .status { font-size:12px; font-weight:800; padding:6px 10px; border-radius:999px;
    border:1px solid var(--borda); color:var(--muted); white-space:nowrap; }
  .status.on  { color:#00ff9d; border-color:rgba(0,255,157,.45); }
  .status.off { color:#ff6b6b; border-color:rgba(255,107,107,.5); }
  main { padding:12px 12px 20px; display:flex; flex-direction:column; gap:12px; }
  .tela { display:flex; align-items:center; gap:14px; min-height:84px; padding:14px 16px;
    border-radius:18px; background:var(--panel); border:2px solid var(--borda);
    border-left:8px solid var(--cor); color:var(--txt); text-decoration:none; }
  .tela:active { transform:scale(.98); background:#1d2c42; }
  .tela .ico { font-size:34px; width:44px; text-align:center; flex:0 0 44px; }
  .tela .txt { display:flex; flex-direction:column; gap:3px; min-width:0; }
  .tela b { font-size:22px; font-weight:900; color:var(--cor); }
  .tela small { font-size:14px; color:var(--muted); font-weight:600; }
  .tela .aberta { font-style:normal; font-size:13px; font-weight:800; color:#ffc250; }
  .tela .aberta:empty { display:none; }
  footer { text-align:center; color:#5d708c; font-size:12px; padding:4px 0 18px; }
</style>
</head>
<body data-tela="Hub MP">
<header>
  <h1>Ekoplastic <span>MP</span></h1>
  <div class="status" id="hub-status">Conectando…</div>
</header>
<main id="hub-telas"></main>
<footer>Cada tela pede a sua senha · <span id="hub-versao"></span></footer>
<script src="/hub-mp.js"></script>
</body>
</html>
