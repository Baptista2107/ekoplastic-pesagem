<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ekoplastic · MP</title>
<!-- Tela inicial do app "Ekoplastic MP" (coletor do almoxarifado, 25/11/2026).
     Só leva às telas que já existem; cada uma pede o PIN dela. A lista de
     botões está em /hub-mp.js. -->
<style>
  /* Coletor TC60 (25/11/2026): a WebView do app tem ~360×690 px de CSS.
     Uma mão, às vezes de luva, galpão claro: botões que enchem a tela (10 px
     de folga), texto ≥ 16 px e contraste ≥ 7:1 com o fundo, também no toque
     (testes/navegador/hub_tc60.py mede tudo isso, de 560 a 690 px de altura).
     O botão não tem min/max-height: o mínimo é o próprio conteúdo, então
     em tela baixa ou com fonte maior a página rola, mas o texto nunca sai
     do botão. No monitor do Mini PC a coluna fica no meio, até 640 px. */
  :root { --bg:#070c13; --panel:#111b2a; --borda:#3a4e6b; --txt:#f4f8fc; --muted:#c9d6e8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:var(--bg); color:var(--txt); min-height:100%;
    font-family:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-tap-highlight-color:transparent;
    -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; overflow-x:hidden; }
  header, main, footer { width:100%; max-width:640px; margin:0 auto; }
  header { display:flex; flex-direction:column; gap:8px; padding:10px 8px 0; }
  header h1 { font-size:22px; line-height:28px; font-weight:900; letter-spacing:.3px; user-select:none; padding:0 4px; }
  header h1 span { color:#00ff9d; }
  /* Status numa faixa inteira: "Sem conexão" tem de saltar aos olhos. */
  .status { font-size:16px; line-height:20px; font-weight:800; padding:9px 12px; border-radius:12px; text-align:center;
    border:2px solid var(--borda); background:#1b2738; color:var(--txt); }
  .status.on  { color:#5dffb8; background:#0b2e22; border-color:#1f8a5e; }
  .status.off { color:#fff; background:#a51616; border-color:#ff6b6b; }
  main { flex:1 0 auto; display:flex; flex-direction:column; gap:10px; padding:10px 8px; }
  .tela { flex:1 1 0; display:flex; align-items:center; gap:10px; padding:10px 10px 10px 8px;
    border-radius:16px; background:var(--panel); border:2px solid var(--borda);
    border-left:9px solid var(--cor); color:var(--txt); text-decoration:none;
    user-select:none; -webkit-user-select:none; }
  .tela:active { transform:scale(.98); background:#0b1420; border-color:var(--cor); }
  .tela .ico { font-size:30px; line-height:1; width:36px; text-align:center; flex:0 0 36px; }
  .tela .txt { display:flex; flex-direction:column; align-items:flex-start; gap:3px; min-width:0; }
  .tela b { font-size:23px; line-height:27px; font-weight:900; color:var(--cor); }
  .tela small { font-size:16px; line-height:20px; color:var(--muted); font-weight:500; }
  /* "em andamento": etiqueta amarela cheia, para ver de longe. */
  .tela .aberta { font-style:normal; font-size:16px; line-height:20px; font-weight:800; color:#1a1300;
    background:#ffc250; border-radius:999px; padding:1px 10px; margin-top:2px; }
  .tela .aberta:empty { display:none; }
  footer { text-align:center; color:var(--muted); font-size:16px; line-height:20px; padding:0 8px 12px; }
</style>
</head>
<body data-tela="Hub MP">
<header>
  <h1>Ekoplastic <span>MP</span></h1>
  <div class="status" id="hub-status">Conectando…</div>
</header>
<main id="hub-telas"></main>
<footer>Cada tela pede a sua senha · <span id="hub-versao"></span></footer>
<script src="/hub-mp.js"></script>
</body>
</html>
